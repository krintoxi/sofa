name: Tests
on:
  push:
    paths-ignore: ["docs/**", "*.md", "android/**", "roku/**", "deploy/sofa-box/**"]
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.12"]          # 3.9: what macOS Ventura and Monterey come with
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Run the tests
        run: python -W ignore -m unittest discover -s tests -t . -v
      - name: Check the web app's JavaScript
        run: node --check client/app.js
