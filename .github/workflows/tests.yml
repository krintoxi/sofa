name: Tests
on:
  push:
    paths-ignore: ["docs/**", "*.md", "android/**"]
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.12"]          # 3.9: what macOS Ventura and Monterey come with
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: false
      - name: Let's Encrypt's test server (Pebble), ffmpeg for the conversion tests, mpv for the Sofa box's
        run: |
          go install github.com/letsencrypt/pebble/v2/cmd/pebble@v2.6.0
          echo "PEBBLE=$(go env GOPATH)/bin/pebble" >> "$GITHUB_ENV"
          echo "PEBBLE_DIR=$(go env GOMODCACHE)/github.com/letsencrypt/pebble/v2@v2.6.0" >> "$GITHUB_ENV"
          echo "127.0.0.1 sofa.test" | sudo tee -a /etc/hosts
          sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg mpv
      - name: Run the tests
        run: |
          set -o pipefail
          uv run --no-project --python ${{ matrix.python }} python -W ignore -m unittest discover -s tests -t . -v 2>&1 | tee test-output.txt
      - name: Say which tests failed (readable without the logs)
        if: failure()
        run: |
          python3 - <<'EOF'
          import re
          text = open("test-output.txt", encoding="utf-8", errors="replace").read()
          for block in re.findall(r"^(?:FAIL|ERROR): .*?(?=^=====|^-----\nRan |\Z)", text, re.M | re.S)[:8]:
              lines = block.strip().splitlines()
              msg = "%0A".join(l.replace("%", "%25") for l in lines[:30])
              print("::error title=" + lines[0][:120].replace(":", " ") + "::" + msg)
          EOF
      - name: Check the JavaScript (the web app, the box's home screen and games)
        run: |
          for f in client/app.js deploy/sofa-box/home/*.js deploy/sofa-box/games/*.js; do node --check "$f" || exit 1; done
  windows:
    # Sofa on Windows (deploy/windows): the same tests on GitHub's Windows Server machines, with the ffmpeg the
    # Windows installer carries (tools/windows-deps.py). Python runs in UTF-8 mode, as the installed Sofa does.
    # What can't run on Windows is skipped with its reason (tests/__init__.py, WINDOWS_SKIPS).
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.12"]
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: "1"
    steps:
      - name: Files exactly as they are in the repository (git on Windows would turn LF into CRLF)
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - uses: actions/cache@v4
        with:
          path: build/windows/downloads
          key: windows-deps-${{ hashFiles('tools/windows-deps.py') }}
      - name: ffmpeg, as the installer carries it (vendor/ffmpeg, where Sofa looks first; on PATH for the tests that ask PATH)
        run: |
          uv run --no-project --python 3.12 python tools/windows-deps.py --ffmpeg
          echo "$GITHUB_WORKSPACE\\vendor\\ffmpeg\\bin" >> "$GITHUB_PATH"
      - name: Run the tests
        run: |
          set -o pipefail
          uv run --no-project --python ${{ matrix.python }} python -W ignore -m unittest discover -s tests -t . -v 2>&1 | tee test-output.txt
      - name: Say which tests failed (readable without the logs)
        if: failure()
        run: |
          python - <<'PYEOF'
          import re
          text = open("test-output.txt", encoding="utf-8", errors="replace").read()
          for block in re.findall(r"^(?:FAIL|ERROR): .*?(?=^=====|^-----\nRan |\Z)", text, re.M | re.S)[:40]:
              lines = block.strip().splitlines()
              msg = "%0A".join(l.replace("%", "%25") for l in lines[:30])
              print("::error title=" + lines[0][:120].replace(":", " ") + "::" + msg)
          PYEOF
