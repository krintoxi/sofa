name: Tests
on:
  push:
    paths-ignore: ["docs/**", "*.md", "android/**"]
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.12"]          # 3.9: what macOS Ventura and Monterey come with
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: false
      - name: Let's Encrypt's test server (Pebble), and ffmpeg for the conversion tests
        run: |
          go install github.com/letsencrypt/pebble/v2/cmd/pebble@v2.6.0
          echo "PEBBLE=$(go env GOPATH)/bin/pebble" >> "$GITHUB_ENV"
          echo "PEBBLE_DIR=$(go env GOMODCACHE)/github.com/letsencrypt/pebble/v2@v2.6.0" >> "$GITHUB_ENV"
          echo "127.0.0.1 sofa.test" | sudo tee -a /etc/hosts
          command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      - name: Run the tests
        run: uv run --no-project --python ${{ matrix.python }} python -W ignore -m unittest discover -s tests -t . -v
      - name: Check the web app's JavaScript
        run: node --check client/app.js
