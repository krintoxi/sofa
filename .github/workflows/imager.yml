name: Sofa Box Imager

# Builds Sofa Box Imager (imager/) and runs its tests on GitHub's Macs, and runs the shared core's tests (ImagerKit) on
# Linux and on Windows. Unsigned: no certificate or key is used here. imager/README.md ("Signing") says what a signed, notarised build
# needs, and "On Windows and Linux" where the other systems stand.

on:
  push:
    paths: ["imager/**", ".github/workflows/imager.yml"]
  pull_request:
    paths: ["imager/**", ".github/workflows/imager.yml"]
  workflow_dispatch:

permissions:
  contents: read

# Each build on main replaces the zip on one release, "sofa-box-imager", so there is always one fixed place to
# download the newest Mac app (edgeventure.uk/downloads links to it). A pre-release, so it never becomes the
# repository's "latest" release. Pull requests and other branches only keep the artifact, as before.

jobs:
  linux:
    # The shared core and its tests in the Swift project's own Linux image, on Intel and Arm. The test disks macOS's tools
    # make are committed (imager/Tests/ImagerKitTests/Fixtures/disks), so only the check that makes them afresh to compare
    # needs macOS (it runs on the Macs below); apart from the tests run only when asked, any other skip fails.
    name: linux (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    container: swift:6.4-noble
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, arch: x86_64 }
          - { runner: ubuntu-24.04-arm, arch: arm64 }
    steps:
      - uses: actions/checkout@v5
      - name: What's on this machine
        run: |
          uname -m
          swift --version
      - name: Run the tests
        working-directory: imager
        run: |
          set -o pipefail
          swift test 2>&1 | tee test-output.txt
      - name: Only the fresh-disk check (it needs macOS) and the tests run when asked were skipped
        working-directory: imager
        run: |
          grep -E "Executed [0-9]+ tests" test-output.txt | tail -1
          if grep "Test skipped - " test-output.txt \
              | grep -v -e "DiskFixtureTests.testAFreshDiskReadsLikeTheCommittedOne : Test skipped - needs macOS's" \
                        -e "Test skipped - set SOFA_IMAGER_"; then
            echo "::error title=Tests were skipped on Linux::only the fresh-disk check and the tests run when asked may skip here."
            exit 1
          fi

  windows:
    # The shared core and its tests on GitHub's Windows machines, on Intel and Arm, with the Swift project's own
    # installer for Windows (the version below, each file's SHA-256 as first downloaded here; Visual Studio's compiler and the Windows SDK are on the machine
    # already). Plain files stand in for disks, as on Linux: no disk is opened here.
    name: windows (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      SWIFT: 6.4.2
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            arch: x86_64
            installer: windows10
            sha256: 8FE5D31CA1153DFE6BE3A76DE0B93347FD42A27599671E9F9ADE23A3648E7184
          - runner: windows-11-arm
            arch: arm64
            installer: windows10-arm64
            sha256: E4E5FDB6CA88B18AC430FBCE3DE35DD80E2249A84A484A02272D82D89F2C7969
    steps:
      - name: Files exactly as they are in the repository (git on Windows would turn LF into CRLF)
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v5
      - name: Get Swift's installer from swift.org and check it's the one expected, and signed
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $Url = "https://download.swift.org/swift-$env:SWIFT-release/${{ matrix.installer }}/swift-$env:SWIFT-RELEASE/swift-$env:SWIFT-RELEASE-${{ matrix.installer }}.exe"
          $Installer = Join-Path $env:RUNNER_TEMP "swift-installer.exe"
          & curl.exe --fail --silent --show-error --location --retry 3 --retry-delay 5 --output $Installer $Url
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::Couldn't download $Url"; exit 1 }
          $Signature = Get-AuthenticodeSignature $Installer
          Write-Host "$Url"
          $Hash = (Get-FileHash $Installer -Algorithm SHA256).Hash
          Write-Host "$((Get-Item $Installer).Length) bytes, SHA-256 $Hash"
          if ($Hash -ne "${{ matrix.sha256 }}") { Write-Host "::error::Not the installer this job expects (${{ matrix.sha256 }})."; exit 1 }
          Write-Host "Signature: $($Signature.Status), by $($Signature.SignerCertificate.Subject)"
          if ($Signature.Status -ne "Valid") { Write-Host "::error::The installer's signature isn't valid."; exit 1 }
      - name: Install Swift
        shell: pwsh
        run: |
          $Installer = Join-Path $env:RUNNER_TEMP "swift-installer.exe"
          $Process = Start-Process -FilePath $Installer -ArgumentList @("/quiet", "/log", "$env:RUNNER_TEMP\swift-install.log") -Wait -PassThru
          if ($Process.ExitCode -ne 0 -and $Process.ExitCode -ne 3010) {
            Write-Host "::error::Swift's installer ended with $($Process.ExitCode)"
            Get-ChildItem "$env:RUNNER_TEMP\swift-install*.log*" | ForEach-Object { Get-Content $_ -Tail 40 }
            exit 1
          }
          # The installer sets the search path and SDKROOT for new sign-ins; hand them to the steps that follow.
          $Before = @($env:Path -Split ';')
          $Paths = @()
          foreach ($Level in "Machine", "User") {
            $Variables = [Environment]::GetEnvironmentVariables($Level)
            foreach ($Name in $Variables.Keys) {
              if ($Name -eq "Path") {
                $Paths += @($Variables[$Name] -Split ';' | Where-Object { $_ -and ($Before -notcontains $_) })
              } elseif (-not (Test-Path "Env:$Name")) {
                "$Name=$($Variables[$Name])" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
              }
            }
          }
          $Paths | Select-Object -Unique | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          Write-Host "Added to the search path:"; $Paths | Select-Object -Unique | ForEach-Object { Write-Host "  $_" }
      - name: What's on this machine
        shell: pwsh
        run: |
          Get-CimInstance Win32_OperatingSystem | ForEach-Object { "$($_.Caption) $($_.Version) $($_.OSArchitecture)" }
          Write-Host "SDKROOT=$env:SDKROOT"
          swift --version
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Build the core and its tests
        shell: bash
        working-directory: imager
        run: swift build --build-tests
      - name: Run the tests
        shell: bash
        working-directory: imager
        run: |
          set -o pipefail
          swift test 2>&1 | tee test-output.txt
      - name: Only the fresh-disk check (it needs macOS) and the tests run when asked were skipped
        shell: bash
        working-directory: imager
        run: |
          grep -E "Executed [0-9]+ tests" test-output.txt | tail -1
          if grep "Test skipped - " test-output.txt \
              | grep -v -e "DiskFixtureTests.testAFreshDiskReadsLikeTheCommittedOne : Test skipped - needs macOS's" \
                        -e "Test skipped - set SOFA_IMAGER_"; then
            echo "::error title=Tests were skipped on Windows::only the fresh-disk check and the tests run when asked may skip here."
            exit 1
          fi

  mac:
    name: ${{ matrix.mac }}
    runs-on: ${{ matrix.mac }}
    permissions:
      contents: write   # only the publish step below uses it, and only on main
    strategy:
      fail-fast: false
      matrix:
        # Apple silicon on the newest macOS and the one before, and an Intel Mac (the app is built for both).
        mac: [macos-26, macos-15, macos-15-intel]
    steps:
      - uses: actions/checkout@v5
      - name: What's on this Mac
        run: |
          sw_vers
          uname -m
          swift --version
          xcodebuild -version
      - name: Run the tests
        # They write only disks they attach themselves (RAM disks), after checking each is the one just attached.
        working-directory: imager
        run: |
          set -o pipefail
          swift test 2>&1 | tee test-output.txt
      - name: The tests that write a disk ran (a skip there would hide a broken writer)
        working-directory: imager
        run: |
          grep -E "WriteJobTests.* (passed|failed|skipped)" test-output.txt
          if grep -E "(WriteJobTests|DiskListTests|AuthOpenTests).* skipped" test-output.txt; then
            echo "::error title=Disk tests were skipped::hdiutil could not attach a RAM disk on this runner, so the write path was not tested."
            exit 1
          fi
      - name: Build Sofa Box Imager.app (Apple silicon and Intel, unsigned)
        working-directory: imager
        run: BUILD=${{ github.run_number }} scripts/build-app.sh
      - name: The built app starts, reads a list and looks at this Mac's disks (it only reads)
        run: |
          "imager/build/Sofa Box Imager.app/Contents/MacOS/SofaBoxImager" \
            --list imager/Tests/ImagerKitTests/Fixtures/sofa-box.rpi-imager-manifest --versions --disks
      - uses: actions/upload-artifact@v4
        if: matrix.mac == 'macos-26'
        with:
          name: sofa-box-imager-mac-unsigned
          path: imager/build/*.zip
          if-no-files-found: error
      - name: Publish it on the "sofa-box-imager" release (main only)
        if: matrix.mac == 'macos-26' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD: ${{ github.run_number }}
        run: |
          set -e
          ZIP="$(ls imager/build/*.zip)"
          NAME="$(basename "$ZIP")"
          VERSION="$(tr -d ' \n' < imager/VERSION)"
          cat > notes.md <<NOTES
          <!-- sofa-box-imager version=$VERSION build=$BUILD commit=$GITHUB_SHA -->
          **Sofa Box Imager $VERSION** for Mac (build $BUILD, from ${GITHUB_SHA::7} on main): EdgeVenture's own app that writes Sofa Box OS, other Linux systems, Windows installers (from your own ISO) and images of your own to SD cards, USB sticks and DVDs, and reads every byte back. macOS 13 or newer, Apple silicon and Intel.

          - **On real hardware so far: one Windows 11 USB stick**, written on an Intel Mac and installed on a laptop. No real SD card, Linux stick or DVD yet; everything else is tested on GitHub's Macs, and every kind of stick has been started in virtual PCs. If you try it, tell us how it went: https://github.com/krintoxi/sofa/issues/new/choose
          - **It isn't signed**, so macOS stops it the first time: open it, then System Settings → Privacy & Security → Open Anyway.
          - Raspberry Pi's own Imager works too, with our list: https://github.com/krintoxi/sofa/releases/download/sofa-box/sofa-box.rpi-imager-manifest

          Download **$NAME** below, unzip it and move the app to Applications. The guide: https://github.com/krintoxi/sofa/blob/main/imager/README.md
          NOTES
          if ! gh release view sofa-box-imager >/dev/null 2>&1; then
            gh release create sofa-box-imager --prerelease --title "Sofa Box Imager $VERSION for Mac (unsigned)" --notes-file notes.md --target "$GITHUB_SHA"
          fi
          gh release upload sofa-box-imager "$ZIP" --clobber
          # Only the newest zip stays on the release.
          gh release view sofa-box-imager --json assets --jq '.assets[].name' | while read -r old; do
            [ "$old" = "$NAME" ] || gh release delete-asset sofa-box-imager "$old" -y
          done
          gh release edit sofa-box-imager --prerelease --title "Sofa Box Imager $VERSION for Mac (unsigned, build $BUILD)" --notes-file notes.md
