name: Docker image

# The Sofa container image (Dockerfile), published to GitHub's registry as ghcr.io/krintoxi/sofa on every change to
# Sofa on main: tagged "latest" and with Sofa's version (sofa/__init__.py), for amd64 and arm64 (a Raspberry Pi 4 or
# 5, an Apple-silicon Mac). Pull requests build it as a check and publish nothing. It needs only GITHUB_TOKEN.
#
# The first publish makes a private package: the owner makes it public once, under the package's settings on
# GitHub (Packages → sofa → Package settings → Change visibility), and `docker pull ghcr.io/krintoxi/sofa` works
# for everyone from then on.
on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "deploy/**"
      - "sofa/**"
      - "client/**"
      - "roku/**"
      - "integrations/**"
      - "sofa.py"
      - "LICENSE"
      - "NOTICE"
      - ".github/workflows/docker-image.yml"
  pull_request:
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "compose.yml"
      - "deploy/docker/**"
      - ".github/workflows/docker-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Sofa's version, for the image's tag
        run: echo "SOFA_VERSION=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' sofa/__init__.py)" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          build-args: SOFA_COMMIT=${{ github.sha }}
          tags: |
            ghcr.io/krintoxi/sofa:latest
            ghcr.io/krintoxi/sofa:${{ env.SOFA_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
