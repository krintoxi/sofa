name: Fire TV and Google TV apps
# One app, two builds (android/app/build.gradle.kts):
#   firetv    the Fire TV app, signed with the repository's sideload key as ever, published from main as firetv-<build>
#   googletv  Android TV and Google TV: a debug APK to try on a TV or an emulator, and the bundle Google Play takes.
#             Its release is signed only with a key that isn't in the repository (the SOFA_TV_* secrets, when the
#             owner has set them); without one the bundle is built unsigned. Nothing of it is published from here.
# Then the Google TV build is put on an Android TV emulator and worked with the remote's keys (android/tv_check.py).
on:
  push:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04               # comes with the Android SDK
    permissions:
      contents: write                   # (the Fire TV release, from main)
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK
        run: |
          set -e
          if [ -z "$ANDROID_HOME" ] || [ ! -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            ANDROID_HOME="$HOME/android-sdk"
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            curl -sSLo /tmp/tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/tools.zip -d "$ANDROID_HOME/cmdline-tools"
            mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          fi
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" > /tmp/sdk.log 2>&1 \
            || { tail -5 /tmp/sdk.log | while IFS= read -r l; do echo "::error::sdkmanager: $l"; done; exit 1; }
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build the apps
        working-directory: android
        env:
          SOFA_TV_KEYSTORE_BASE64: ${{ secrets.SOFA_TV_KEYSTORE_BASE64 }}
          SOFA_TV_KEYSTORE_PASSWORD: ${{ secrets.SOFA_TV_KEYSTORE_PASSWORD }}
          SOFA_TV_KEY_ALIAS: ${{ secrets.SOFA_TV_KEY_ALIAS }}
          SOFA_TV_KEY_PASSWORD: ${{ secrets.SOFA_TV_KEY_PASSWORD }}
        run: |
          set -o pipefail
          if [ -n "$SOFA_TV_KEYSTORE_BASE64" ]; then        # the owner's key, kept in GitHub's secrets, never in the repository
            printf '%s' "$SOFA_TV_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/sofa-tv.jks"
            export SOFA_TV_KEYSTORE="$RUNNER_TEMP/sofa-tv.jks"
          fi
          gradle assembleFiretvRelease assembleGoogletvDebug bundleGoogletvRelease --no-daemon 2>&1 | tee build.log
      - name: Show what went wrong
        if: failure()
        working-directory: android
        run: |
          grep -E "^e: |error:|What went wrong" -A2 build.log | grep -v "^--$" | head -12 | while IFS= read -r line; do echo "::error::${line}"; done
      - name: Name the files
        run: |
          find android/app/build/outputs -name "*.apk" -o -name "*.aab" | sort
          cp android/app/build/outputs/apk/firetv/release/app-firetv-release.apk sofa-firetv.apk
          cp android/app/build/outputs/apk/googletv/debug/app-googletv-debug.apk sofa-googletv-debug.apk
          cp android/app/build/outputs/bundle/googletvRelease/app-googletv-release.aab sofa-googletv.aab
      - name: Which key signed what
        run: |
          set -e
          signer="$ANDROID_HOME/build-tools/34.0.0/apksigner"
          sideload="$(keytool -list -v -keystore android/sofa-sideload.jks -storepass sofa-sideload -alias sofa | sed -n 's/.*SHA256: //p' | tr -d ':' | tr 'A-F' 'a-f')"
          firetv="$("$signer" verify --print-certs sofa-firetv.apk | sed -n 's/.*certificate SHA-256 digest: //p' | head -1)"
          googletv="$("$signer" verify --print-certs sofa-googletv-debug.apk | sed -n 's/.*certificate SHA-256 digest: //p' | head -1)"
          echo "The sideload key:        $sideload"
          echo "The Fire TV app:         $firetv"
          echo "The Google TV debug app: $googletv"
          # The Fire TV app must keep its key (a new build installs over the old one); the Google TV app must never have it.
          [ "$firetv" = "$sideload" ] || { echo "::error::The Fire TV app isn't signed with the sideload key any more: it wouldn't install over the one on a Fire TV."; exit 1; }
          [ "$googletv" != "$sideload" ] || { echo "::error::The Google TV app is signed with the public sideload key."; exit 1; }
          "$ANDROID_HOME/build-tools/34.0.0/aapt2" dump badging sofa-googletv-debug.apk | grep -E "^package:|leanback|banner|uses-feature" | cut -c1-200
          if jarsigner -verify sofa-googletv.aab 2>&1 | grep -q "jar verified"; then
            echo "The Google TV bundle is signed (the owner's key, from the secrets)."
            ! jarsigner -verify -verbose -certs sofa-googletv.aab 2>&1 | grep -qi "CN=Sofa sideload" || { echo "::error::The Google TV bundle is signed with the sideload key."; exit 1; }
          else
            echo "The Google TV bundle is unsigned: no key in this repository's secrets. Google Play signs it, or the owner does."
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: sofa-firetv
          path: sofa-firetv.apk
      - uses: actions/upload-artifact@v4
        with:
          name: sofa-googletv
          path: |
            sofa-googletv-debug.apk
            sofa-googletv.aab
      - name: Publish the Fire TV app (main only)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: firetv-${{ github.run_number }}
          name: Sofa for Fire TV (build ${{ github.run_number }})
          body: "Install it on a Fire TV with the Downloader app: type the address your Sofa Server page shows under Apps (http://<Sofa computer>:8090/firetv). See android/README.md."
          files: sofa-firetv.apk
          make_latest: true
  tv:
    name: The Google TV build on an Android TV (emulator)
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: sofa-googletv
      - name: The emulator may use this machine's own processor (KVM)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: A Sofa beside it (a scratch one, on this machine)
        run: |
          mkdir -p "$RUNNER_TEMP/sofa/data" "$RUNNER_TEMP/sofa/media"
          cat > "$RUNNER_TEMP/sofa/data/config.json" <<JSON
          {"offline": true, "dlna": false, "machine_test": false, "previews": false, "trickplay": false, "detect_intros": false,
           "auto_convert": false, "archive_channels": false, "retro_eras": false, "live_check": false,
           "shows": "$RUNNER_TEMP/sofa/media/Shows", "movies": "$RUNNER_TEMP/sofa/media/Movies", "music": "$RUNNER_TEMP/sofa/media/Music",
           "musicvideos": "$RUNNER_TEMP/sofa/media/Music Videos", "inbox": "$RUNNER_TEMP/sofa/media/Inbox",
           "review": "$RUNNER_TEMP/sofa/media/Needs Review", "adult": "$RUNNER_TEMP/sofa/media/Adult",
           "originals": "$RUNNER_TEMP/sofa/media/Converted Originals"}
          JSON
          SOFA_DATA="$RUNNER_TEMP/sofa/data" nohup python3 sofa.py serve > "$RUNNER_TEMP/sofa/server.log" 2>&1 &
          for i in $(seq 1 40); do curl -sf -m 2 http://127.0.0.1:8090/api/info > /dev/null && break; sleep 1; done
          curl -sf -m 5 http://127.0.0.1:8090/api/info
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: android-tv
          arch: x86
          profile: tv_1080p
          cores: 4
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: python3 android/tv_check.py sofa-googletv-debug.apk
      - name: What Sofa said
        if: failure()
        run: tail -40 "$RUNNER_TEMP/sofa/server.log" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: google-tv-screenshots
          path: shots/
          if-no-files-found: ignore
