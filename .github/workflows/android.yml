name: Fire TV app
on:
  push:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04               # comes with the Android SDK
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK
        run: |
          set -e
          if [ -z "$ANDROID_HOME" ] || [ ! -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            ANDROID_HOME="$HOME/android-sdk"
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            curl -sSLo /tmp/tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/tools.zip -d "$ANDROID_HOME/cmdline-tools"
            mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          fi
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" > /tmp/sdk.log 2>&1 \
            || { tail -5 /tmp/sdk.log | while IFS= read -r l; do echo "::error::sdkmanager: $l"; done; exit 1; }
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build the app
        working-directory: android
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon 2>&1 | tee build.log
      - name: Show what went wrong
        if: failure()
        working-directory: android
        run: |
          grep -E "^e: |error:|What went wrong" -A2 build.log | grep -v "^--$" | head -12 | while IFS= read -r line; do echo "::error::${line}"; done
      - name: Name the app file
        run: cp android/app/build/outputs/apk/release/app-release.apk sofa-firetv.apk
      - uses: actions/upload-artifact@v4
        with:
          name: sofa-firetv
          path: sofa-firetv.apk
      - name: Publish it (main only)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: firetv-${{ github.run_number }}
          name: Sofa for Fire TV (build ${{ github.run_number }})
          body: "Install it on a Fire TV with the Downloader app: type the address your Sofa Server page shows under Apps (http://<Sofa computer>:8090/firetv). See android/README.md."
          files: sofa-firetv.apk
          make_latest: true
