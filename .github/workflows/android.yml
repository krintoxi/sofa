name: Fire TV app
on:
  push:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build the app
        working-directory: android
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon 2>&1 | tee build.log
      - name: Show what went wrong
        if: failure()
        working-directory: android
        run: |
          grep -E "^e: |error:|What went wrong" -A2 build.log | grep -v "^--$" | head -12 | while IFS= read -r line; do echo "::error::${line}"; done
      - name: Name the app file
        run: cp android/app/build/outputs/apk/release/app-release.apk sofa-firetv.apk
      - uses: actions/upload-artifact@v4
        with:
          name: sofa-firetv
          path: sofa-firetv.apk
      - name: Publish it (main only)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: firetv-${{ github.run_number }}
          name: Sofa for Fire TV (build ${{ github.run_number }})
          body: "Install it on a Fire TV with the Downloader app: type the address your Sofa Server page shows under Apps (http://<Sofa computer>:8090/firetv). See android/README.md."
          files: sofa-firetv.apk
          make_latest: true
