name: Sofa box card

# A ready-to-write card for the Sofa box (Raspberry Pi OS Lite, 64-bit, with the box set up), built on
# GitHub's Arm computers. Publishing a release whose tag starts with "box-v" (on the website: Releases →
# Draft a new release → tag box-v1 → Publish) builds the card and attaches it to that release. Changes to
# the box build it as a check, kept for a week under the run's Artifacts.
on:
  workflow_dispatch:
  release:
    types: [published]
  push:
    branches: ["**"]
    paths:
      - "deploy/sofa-box/**"
      - "!deploy/sofa-box/README.md"
      - "tools/build-sofa-box-image.sh"
      - ".github/workflows/sofa-box-image.yml"

permissions:
  contents: write

jobs:
  card:
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'box-v')
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends parted xz-utils e2fsprogs
      - name: Build the card
        run: sudo tools/build-sofa-box-image.sh out
      - name: What's on it
        run: |
          { echo '### What is on the card'; echo '```'; cat out/*-report.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          # the same as a notice, readable through the API too (newlines as %0A)
          echo "::notice title=Sofa box card::$(sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g' out/*-report.txt)"
      - name: Keep it (a week)
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: sofa-box-card
          path: out/
          retention-days: 7
          compression-level: 0
      - name: Put it on the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$TAG" out/*.img.xz out/*.sha256 out/*-report.txt --clobber
          if [ -z "$(gh release view "$TAG" --json body --jq .body)" ]; then
            gh release edit "$TAG" --notes "A card for the Sofa box (Raspberry Pi 3, 4 or 5). Write it with Raspberry Pi Imager: Choose OS → Use custom. See deploy/sofa-box/README.md."
          fi
