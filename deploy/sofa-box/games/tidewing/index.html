<script>
/* Tidewing: a race over open water for Sofa Box OS, the first game on Low3D, the box's game engine (../low3d.js).
   You fly a skimmer, a small hover-craft with a wing, low over the sea through the gates of a course: three laps
   against three rivals. Carve through the turns to fill your boost, pick up sparks, hit the boost pads, keep off the
   rocks. Everything is the game's own and made in code: the six courses, the low-poly islands and craft, the music.
   The engine tunes it to the box: 3D at a size and draw distance the GPU holds steady, or the same water in 2D on a box
   without a real GPU. It plays offline, with a controller first (A B X Y, or ✕ ○ □ △) or the keyboard, and keeps its
   records on the box. In the address: #fps, #flat or #gl, #rung=N, #test (window.TW, for checks). */
(function () {
"use strict";
const L3 = window.Low3D, U = L3.U, M4 = L3.M4, TAU = U.TAU, clamp = U.clamp, lerp = U.lerp, wrap = U.wrap;
const $ = id => document.getElementById(id), hex = U.hex, shade = U.shade, mix = U.mix, ord = U.ord, time = U.time;

// ---------------------------------------------------------------- what's kept on the box (the engine keeps its tuning apart)
const SAVE = "tidewing";
function fresh() { return { v: 1, best: {}, open: 1, opts: { picture: "auto", music: 6, sound: 8, camera: 0, throttle: 0, crisp: 0 } }; }
let save = fresh();
try { const j = JSON.parse(localStorage.getItem(SAVE) || "null"); if (j && j.v === 1) save = Object.assign(fresh(), j, { opts: Object.assign(fresh().opts, j.opts || {}) }); } catch (e) { /* a fresh start */ }
function store() { try { localStorage.setItem(SAVE, JSON.stringify(save)); } catch (e) { /* full or blocked: the race still runs */ } }

// ---------------------------------------------------------------- the waters
const THEMES = {
  dawn: { top: 0x6a8acb, horizon: 0xf2cba8, fog: 0xe6c9b4, sun: [-0.55, 0.32, 0.78], sunCol: 0xffd9ae, amb: 0x8c92b4, ground: 0x5a4c54,
    deep: 0x2d6b92, shallow: 0x62b9c0, sand: 0xe7d2a2, rock: [0x8a7d78, 0x9c8f88, 0xafa196], top2: 0xbdb1a4, grass: 0x7da862, leaf: 0x4f8a4c, trunk: 0x7a5a3e,
    buoyA: 0xee5e3c, buoyB: 0xf4efe4, banner: 0xf4ac3c, hill: 0xa49cb8, near: 0.45, palms: 1, glow: 0 },
  noon: { top: 0x3b7dd4, horizon: 0xbfe1f6, fog: 0xc6e3f4, sun: [0.32, 0.9, 0.28], sunCol: 0xfff4de, amb: 0x90a8c2, ground: 0x585048,
    deep: 0x1d6c9e, shallow: 0x46c3c7, sand: 0xf0dfae, rock: [0x4e4a56, 0x5c5764, 0x6c6674], top2: 0x7c7684, grass: 0x6aae56, leaf: 0x3e8e44, trunk: 0x6e5038,
    buoyA: 0xf2c43c, buoyB: 0x2a3a4e, banner: 0xe8484e, hill: 0x8aaec8, near: 0.5, palms: 0, glow: 0 },
  kelp: { top: 0x5a8ec0, horizon: 0xd6e6d0, fog: 0xcfe0cc, sun: [0.5, 0.62, -0.6], sunCol: 0xfff0cc, amb: 0x88a8a0, ground: 0x4a5040,
    deep: 0x226468, shallow: 0x54aa8c, sand: 0xdcd2a0, rock: [0x6e7262, 0x7e826e, 0x8e927c], top2: 0x9aa07e, grass: 0x88b25a, leaf: 0x4c8a3e, trunk: 0x6a5236,
    buoyA: 0xf08a3a, buoyB: 0xf2f0dc, banner: 0x4ab4d8, hill: 0x92ae9e, near: 0.45, palms: 1, glow: 0 },
  dusk: { top: 0x2a2858, horizon: 0xe2826a, fog: 0xa86c74, sun: [0.62, 0.1, 0.78], sunCol: 0xffa064, amb: 0x6c6294, ground: 0x40303e,
    deep: 0x243e68, shallow: 0x3e7c8e, sand: 0xc8a888, rock: [0x5a4a5c, 0x6a586a, 0x7a6878], top2: 0x8a7684, grass: 0x5e7a52, leaf: 0x3a5a40, trunk: 0x4e3a32,
    buoyA: 0xf6d06a, buoyB: 0x3a2e4a, banner: 0xff8a5a, hill: 0x6a4a6a, near: 0.4, palms: 0, lamps: 1, glow: 0 },
  fog: { top: 0x9eaab4, horizon: 0xc4ccd0, fog: 0xbec8cc, sun: [-0.3, 0.7, 0.4], sunCol: 0xd8dcdc, amb: 0x98a4ac, ground: 0x5a6064,
    deep: 0x37586a, shallow: 0x698c94, sand: 0xb4ae9c, rock: [0x5c6066, 0x6a6e74, 0x7a7e84], top2: 0x8a8e90, grass: 0x6a8a66, leaf: 0x46684c, trunk: 0x584a3e,
    buoyA: 0xff6a3a, buoyB: 0xe8ece8, banner: 0xffb43a, hill: 0x9aa4aa, near: 0.2, far: 0.55, palms: 0, lamps: 1, glow: 0 },
  night: { top: 0x070d24, horizon: 0x223058, fog: 0x18224a, sun: [-0.35, 0.55, 0.6], sunCol: 0x8ea0d8, amb: 0x3a4474, ground: 0x1a1a30,
    deep: 0x0b2442, shallow: 0x1a5870, sand: 0x7a7a8a, rock: [0x3a3c50, 0x46485e, 0x52546a], top2: 0x5e6076, grass: 0x34504a, leaf: 0x22403a, trunk: 0x3a3030,
    buoyA: 0x6ae0ff, buoyB: 0x24304a, banner: 0x9a7aff, hill: 0x202a52, near: 0.35, palms: 0, lamps: 1, glow: 1 }
};
// each course: its theme, control points (a gate on each), how wide the gates are, rocks on the line, weed beds, boost
// pads and sparks (each at a share of the lap and a step to the left), the rivals' pace, its music's key and tempo
const COURSES = [
  { id: "wren", name: "Wren Shallows", theme: "dawn", seed: 11, k: 0.78, w: 11, pace: 0.84, key: 0, tempo: 96,
    pts: [[0, -250], [170, -230], [270, -120], [280, 40], [200, 180], [60, 240], [-100, 230], [-230, 150], [-280, 0], [-230, -150], [-120, -235]],
    rocks: [], kelp: [[0.42, -22, 14]], pads: [[0.16, 0], [0.62, 0]], sparks: [[0.08, 0, 4], [0.3, -4, 4], [0.5, 4, 4], [0.75, 0, 4], [0.9, -3, 3]],
    about: "A gentle loop at sunrise. Learn to carve." },
  { id: "basalt", name: "Basalt Narrows", theme: "noon", seed: 23, k: 0.8, w: 10, pace: 0.88, key: 5, tempo: 108,
    pts: [[-300, -60], [-150, -110], [0, -60], [150, -110], [300, -60], [335, 60], [200, 125], [60, 80], [-60, 140], [-200, 110], [-335, 60]],
    rocks: [[0.06, 6, 4], [0.1, -6, 4], [0.14, 6, 5], [0.36, -5, 4], [0.4, 6, 4], [0.66, -6, 5], [0.7, 5, 4]], kelp: [], pads: [[0.24, 0], [0.55, 0]],
    sparks: [[0.12, 0, 3], [0.33, 0, 4], [0.48, -5, 3], [0.78, 0, 4], [0.92, 4, 3]], about: "Black stone columns in the noon sun. Slalom the pillars." },
  { id: "kelpmere", name: "Kelpmere", theme: "kelp", seed: 37, k: 0.8, w: 11, pace: 0.9, key: 2, tempo: 100,
    pts: [[-250, -200], [0, -265], [250, -200], [305, 0], [200, 150], [60, 60], [-60, 60], [-200, 150], [-305, 0]],
    rocks: [[0.55, 0, 3]], kelp: [[0.17, 26, 22], [0.33, 30, 20], [0.5, -18, 16], [0.62, 22, 18], [0.84, 30, 24], [0.95, 20, 16]], pads: [[0.06, 0], [0.73, 0]],
    sparks: [[0.12, 0, 4], [0.27, -4, 3], [0.45, 0, 4], [0.58, 0, 3], [0.8, -4, 4]], about: "Green water and thick weed. Cut the corners at a cost." },
  { id: "lantern", name: "Lantern Reach", theme: "dusk", seed: 41, k: 0.82, w: 10, pace: 0.93, key: 7, tempo: 112,
    pts: [[-350, -80], [0, -92], [330, -80], [385, 0], [330, 82], [100, 92], [0, 32], [-100, 92], [-330, 82], [-385, 0]],
    rocks: [[0.6, 0, 4]], kelp: [], pads: [[0.06, -3], [0.12, 3], [0.36, 0], [0.56, 0], [0.88, 0]],
    sparks: [[0.2, 0, 5], [0.42, 4, 3], [0.66, -4, 3], [0.8, 0, 5]], about: "Long reaches and hairpins as the lanterns come on." },
  { id: "skerries", name: "Fogbound Skerries", theme: "fog", seed: 53, k: 0.84, w: 10, pace: 0.96, key: 3, tempo: 92,
    pts: [[-200, -250], [-40, -200], [60, -262], [220, -200], [242, -60], [140, 0], [240, 100], [200, 240], [40, 200], [-60, 262], [-222, 200], [-180, 60], [-262, -60]],
    rocks: [[0.1, -5, 3], [0.27, 5, 3], [0.45, 0, 3], [0.62, -5, 3], [0.8, 5, 3]], kelp: [[0.37, -24, 14]], pads: [[0.2, 0], [0.7, 0]],
    sparks: [[0.05, 0, 3], [0.22, 0, 3], [0.4, 3, 3], [0.55, -3, 3], [0.75, 0, 3], [0.92, 0, 3]], about: "Rocks in the fog. Watch for the next gate's light." },
  { id: "moonwake", name: "Moonwake", theme: "night", seed: 67, k: 0.84, w: 10, pace: 0.99, key: 9, tempo: 116,
    pts: [[0, -320], [220, -260], [320, -80], [200, 40], [300, 180], [160, 300], [-40, 220], [-160, 300], [-320, 160], [-240, 0], [-320, -160], [-180, -260]],
    rocks: [[0.3, -5, 4], [0.34, 5, 4], [0.7, 0, 4]], kelp: [[0.52, 24, 16]], pads: [[0.1, 0], [0.46, 0], [0.8, 0]],
    sparks: [[0.05, 0, 4], [0.2, -4, 4], [0.4, 4, 3], [0.6, 0, 4], [0.86, -4, 3]], about: "The sea glows where you pass. The last and fastest." }
];
const LAPS = 3, MAP = 1024, HALF = MAP / 2;
const RIVALS = [{ name: "Petrel", col: 0xf2803a, trim: 0x3a2a24, skill: 1.0 }, { name: "Skua", col: 0x9a6ad6, trim: 0x2a2440, skill: 0.975 },
  { name: "Tern", col: 0x2fc0a6, trim: 0x1c3a36, skill: 0.95 }];
const YOU = { name: "You", col: 0x3aa2f2, trim: 0xf4f6fa, skill: 0.97 };
const TMP = new Float32Array(5);

// ---------------------------------------------------------------- a course: its line, gates and everything on the water
function buildCourse(C) {
  const T = THEMES[C.theme], rnd = U.rand(C.seed * 977 + 13);
  const pts = C.pts.map(p => [p[0] * C.k, p[1] * C.k]);
  const P = new L3.Path(pts, { step: 2 });
  const W = { C, T, P, gates: [], islands: [], stones: [], kelp: [], pads: [], sparks: [], len: P.len };
  for (const i of P.knots) W.gates.push({ x: P.x[i], z: P.z[i], tx: P.tx[i], tz: P.tz[i], s: P.s[i], w: C.w });   // a gate on each point, square to the line
  const side = (f, off) => { P.side(f * P.len, off, TMP); return { x: TMP[0], z: TMP[1], s: f * P.len }; };
  for (const r of C.rocks) { const o = side(r[0], r[1]), st = { x: o.x, z: o.z, r: r[2], h: r[2] * 1.4 + 2, kind: "stone", seed: (rnd() * 1e9) | 0, su: o.s, off: r[1] }; W.islands.push(st); W.stones.push(st); }
  for (const k of C.kelp) { const o = side(k[0], k[1]); W.kelp.push({ x: o.x, z: o.z, r: k[2] }); }
  for (const p of C.pads) { const o = side(p[0], p[1]); P.at(o.s, TMP); W.pads.push({ x: o.x, z: o.z, yaw: Math.atan2(TMP[2], TMP[3]) }); }
  for (const sp of C.sparks) for (let j = 0; j < sp[2]; j++) { const o = side(sp[0] + j * 7 / P.len, sp[1]); W.sparks.push({ x: o.x, z: o.z, s: o.s, got: false }); }
  // islands: a landmark inside the loop, then more about, never on the line
  let cx = 0, cz = 0; for (const p of pts) { cx += p[0]; cz += p[1]; } cx /= pts.length; cz /= pts.length;
  const kinds = C.theme === "noon" ? ["columns", "columns", "rock", "green"] : C.theme === "fog" ? ["skerry", "skerry", "rock", "rock"] : ["green", "rock", "green", "skerry"];
  const want = C.theme === "fog" ? 46 : 30;
  const fits = (x, z, r, clear) => {
    if (Math.abs(x) > HALF - r - 20 || Math.abs(z) > HALF - r - 20) return false;
    P.near(x, z); if (P.dist < r + clear) return false;
    for (const o of W.islands) if (Math.hypot(o.x - x, o.z - z) < o.r + r + 8) return false;
    return true;
  };
  { const r = 34 + rnd() * 10; if (fits(cx, cz, r, 26)) W.islands.push({ x: cx, z: cz, r, h: 22 + rnd() * 10, kind: "landmark", seed: (rnd() * 1e9) | 0 }); }

  cam.ty += wv;
  const fovWant = 0.76 + (you.boosting || you.padT > 0 ? 0.11 : 0) + clamp(you.speed / 50, 0, 1) * 0.05;
  cam.fov += (fovWant - cam.fov) * (1 - Math.exp(-4 * dt));
  cam.roll = you.bank * 0.25;
  if (shake > 0) { const s = shake * 0.6; cam.x += (Math.random() - 0.5) * s; cam.y += (Math.random() - 0.5) * s; }
}

// ---------------------------------------------------------------- drawing
function draw(now, dt) {
  updateCam(dt, now);
  if (E.mode === "gl") drawGL(now); else drawFlat(now);
  if (you && state !== "attract") drawHUD(now);
}
function drawGL(now) {
  const g3 = E.g3, W = world, T = W.T, R = E.rung, far = R.far * (T.far || 1), M = G.mat;
  L3.begin(E, cam, 0.6, 2600);
  const L = g3.L, n0 = L.fog[0], f0 = L.fog[1];       // far hills, in their own haze
  L.fog[0] = 500; L.fog[1] = T.near < 0.3 ? 1040 : 2600; g3.frame++;
  g3.lit(G.hills, null, 1, 1, 1, 0);
  L.fog[0] = n0; L.fog[1] = f0; g3.frame++;
  G.world.draw(g3, cam.x, cam.z, far, R.detail);
  const wv = R.waves && G.seaWave;
  for (let i = 0; i < racers.length; i++) {
    const r = racers[i]; if (Math.hypot(r.x - cam.x, r.z - cam.z) > far + 5 || !g3.sees(r.x, 1, r.z, 4)) continue;
    r.y = 0.55 + Math.sin(raceT * 3 + i) * 0.06 + (wv ? waveAt(r.x, r.z, raceT) * 0.45 : 0);
    M4.model(M, r.x, r.y, r.z, r.yaw, -r.speed * 0.0015 + (r.carve ? 0.03 : 0), r.bank, 1);
    g3.lit(G.crafts[i], M, 1, 1, 1, 0);
  }
  if (wv) { for (let i = 0; i < G.seaWave.length; i++) { const h = G.seaWave[i]; if (h.r > 1000 || (Math.hypot(h.x - cam.x, h.z - cam.z) - h.r < far && g3.sees(h.x, 0, h.z, h.r + 2))) g3.sea(h, G.tex, -HALF, -HALF, MAP, raceT, 0.5); } }
  else g3.sea(G.seaFlat[0], G.tex, -HALF, -HALF, MAP, raceT, 0);
  for (const sp of W.sparks) {                       // sparks still to get, turning
    if (sp.got || Math.hypot(sp.x - cam.x, sp.z - cam.z) > far * 0.8 || !g3.sees(sp.x, 1.6, sp.z, 1.2)) continue;
    M4.model(M, sp.x, 1.6 + Math.sin(now / 300 + sp.s) * 0.25, sp.z, now / 400 + sp.s, 0, 0, 1); g3.lit(G.gem, M, 1, 1, 1, 0.65);
  }
  g3.sky(R.sun);
  for (let i = 0; i < racers.length; i++) {          // see-through things: shadows, wakes, flames, the next gate's light, spray
    const r = racers[i]; if (Math.hypot(r.x - cam.x, r.z - cam.z) > far * 0.7) continue;
    M4.model(M, r.x, 0.05, r.z, r.yaw, 0, 0, 1); g3.glow(G.shadow, M, 0, 0.02, 0.05, 0.3, "mix");
  }
  const m = G.wakeM, wc = T.glow ? 0x60e8ff : 0xffffff; m.n = 0;
  for (let k = racers.length - 1, used = 0; k >= 0 && used < R.wakes; k--) { const r = racers[k]; if (Math.hypot(r.x - cam.x, r.z - cam.z) > 90) continue; used++; r.trail.ribbon(m, 0.06, wc, 0.6, 0.16, 200); }
  if (m.n) { g3.update(G.wake, m); g3.glow(G.wake, null, 1, 1, 1, T.glow ? 0.9 : 0.55, T.glow ? "add" : "mix"); }
  for (let i = 0; i < racers.length; i++) {
    const r = racers[i]; if ((!r.throttle && !r.boosting) || Math.hypot(r.x - cam.x, r.z - cam.z) > 70) continue;
    const s = 0.5 + r.throttle * 0.3 + (r.boosting || r.padT > 0 ? 0.6 : 0) + Math.sin(now / 30 + i) * 0.08;
    M4.model(M, r.x, r.y, r.z, r.yaw, -r.speed * 0.0015, r.bank, 1);
    const jx = M[4] * 0.5 - M[8] * 1.92 + M[12], jy = M[5] * 0.5 - M[9] * 1.92 + M[13], jz = M[6] * 0.5 - M[10] * 1.92 + M[14];
    M[8] *= s; M[9] *= s; M[10] *= s; M[12] = jx; M[13] = jy; M[14] = jz;   // (at the jet, longer with the throttle)
    g3.glow(G.flame, M, r.boosting ? 0.7 : 1, r.boosting ? 0.95 : 0.7, r.boosting ? 1 : 0.35, 0.85, "add");
  }
  if (you && state !== "done") {
    const gt = W.gates[you.passed % W.gates.length], pulse = 0.55 + 0.45 * Math.sin(now / 160);
    M4.model(M, gt.x, Math.sin(now / 300) * 0.4, gt.z, Math.atan2(gt.tx, gt.tz) + now / 900, 0, 0, 1.3); g3.glow(G.next, M, 1, 0.85, 0.3, 0.55 + pulse * 0.4, "add");
  }
  spray.points(G.sprayM, 0xebf8ff);
  if (G.sprayM.n) { g3.update(G.spray, G.sprayM); g3.glow(G.spray, null, 1, 1, 1, 0.8, "mix", 0.22); }
}
const P4 = new Float32Array(4), POLY = new Float32Array(12);
function drawFlat(now) {
  const flat = E.flat, W = world, T = W.T, R = E.rung, far = R.far * (T.far || 1);
  L3.begin(E, cam);
  { const s = T.sun, k = 1000;                       // the sun (or moon), far off where it is
    if (flat.project(cam.x + s[0] * k, cam.y + s[1] * k, cam.z + s[2] * k, P4)) { const sz = flat.h * 0.5; flat.ctx.globalAlpha = 0.75; flat.ctx.drawImage(F.sun.c, P4[0] - sz / 2, P4[1] - sz / 2, sz, sz); flat.ctx.globalAlpha = 1; } }
  for (const it of F.islands) { const o = it.o; if (Math.hypot(o.x - cam.x, o.z - cam.z) - o.r <= far) flat.sprite(it.s, o.x, 0, o.z, 1 / it.s.ppu); }
  for (const gt of W.gates) {
    if (Math.hypot(gt.x - cam.x, gt.z - cam.z) > far) continue;
    const nx = -gt.tz, nz = gt.tx, w = gt.w;
    flat.sprite(F.buoy, gt.x + nx * w, 0, gt.z + nz * w, 0.1); flat.sprite(F.buoy, gt.x - nx * w, 0, gt.z - nz * w, 0.1);
    POLY[0] = gt.x + nx * w; POLY[1] = 6.4; POLY[2] = gt.z + nz * w; POLY[3] = gt.x - nx * w; POLY[4] = 6.4; POLY[5] = gt.z - nz * w;
    POLY[6] = gt.x - nx * w; POLY[7] = 5.9; POLY[8] = gt.z - nz * w; POLY[9] = gt.x + nx * w; POLY[10] = 5.9; POLY[11] = gt.z + nz * w;
    flat.poly(POLY, F.banner, 1);
  }
  if (you && state !== "done") { const gt = W.gates[you.passed % W.gates.length]; flat.sprite(F.glow, gt.x, 7.5, gt.z, 0.16, 0.75 + 0.25 * Math.sin(now / 160)); }
  for (const sp of W.sparks) if (!sp.got && Math.hypot(sp.x - cam.x, sp.z - cam.z) <= far * 0.8) flat.sprite(F.gem, sp.x, 1.2 + Math.sin(now / 300 + sp.s) * 0.25, sp.z, 1 / 14);
  for (let i = 0; i < racers.length; i++) {
    const r = racers[i], d = Math.hypot(r.x - cam.x, r.z - cam.z); if (d > far) continue;
    if (R.detail > 0.5 && d < 70) r.trail.spots(flat, F.foam, 0, 0.035, 0.006, 0.55, 2);
    flat.sprite(F.shadow, r.x, 0, r.z, 0.06, 0.8);
    const views = F.crafts[i], rel = wrap(r.yaw - Math.atan2(r.x - cam.x, r.z - cam.z)), vi = ((Math.round(-rel / TAU * 16) % 16) + 16) % 16;
    const row = views.length === 3 ? (r.bank > 0.12 ? 2 : r.bank < -0.12 ? 0 : 1) : 0;
    flat.sprite(views[row][vi], r.x, 0.4 + Math.sin(raceT * 3 + i) * 0.06, r.z, 1 / 12);
  }
  spray.sprites(flat, F.spray, 0.02);
  flat.flush();
}

// ---------------------------------------------------------------- the race's numbers on screen
const mm = $("minimap"), mmx = mm.getContext("2d"), mmBase = document.createElement("canvas"); mmBase.width = mmBase.height = 128;
function mmXY(x, z, o) { const b = world.bounds, s = 112 / Math.max(b[2] - b[0], b[3] - b[1]); o[0] = 64 + (x - (b[0] + b[2]) / 2) * s; o[1] = 64 + (z - (b[1] + b[3]) / 2) * s; return o; }
function drawMinimapBase() {
  const g = mmBase.getContext("2d"), P = world.P, T = world.T, p = [0, 0], b = world.bounds, s = 112 / Math.max(b[2] - b[0], b[3] - b[1]);
  g.clearRect(0, 0, 128, 128); g.fillStyle = "rgba(4,16,30,0.55)"; g.beginPath(); g.arc(64, 64, 64, 0, TAU); g.fill();
  g.fillStyle = hex(mix(T.sand, T.rock[1], 0.4));
  for (const o of world.islands) { mmXY(o.x, o.z, p); g.beginPath(); g.arc(p[0], p[1], Math.max(1, o.r * s), 0, TAU); g.fill(); }
  g.strokeStyle = "rgba(255,255,255,0.85)"; g.lineWidth = 2.2; g.lineJoin = "round"; g.beginPath();
  for (let i = 0; i <= P.n; i += 3) { mmXY(P.x[i % P.n], P.z[i % P.n], p); if (i) g.lineTo(p[0], p[1]); else g.moveTo(p[0], p[1]); }
  g.closePath(); g.stroke();
}
const MMP = [0, 0], texts = {};
let hudAt = 0;
function setText(id, t) { if (texts[id] !== t) { texts[id] = t; $(id).textContent = t; } }
function drawHUD(now) {
  if (now - hudAt < 100) return; hudAt = now;      // ten times a second is plenty
  mmx.clearRect(0, 0, 128, 128); mmx.drawImage(mmBase, 0, 0);
  const gt = world.gates[you.passed % world.gates.length]; mmXY(gt.x, gt.z, MMP); mmx.fillStyle = "#ffd24f"; mmx.fillRect(MMP[0] - 2.5, MMP[1] - 2.5, 5, 5);
  for (const r of racers) { mmXY(r.x, r.z, MMP); mmx.fillStyle = hex(r.def.col); mmx.beginPath(); mmx.arc(MMP[0], MMP[1], r === you ? 4.5 : 3.2, 0, TAU); mmx.fill(); if (r === you) { mmx.strokeStyle = "#fff"; mmx.lineWidth = 1.5; mmx.stroke(); } }
  const ps = you.place + "<small>" + ord(you.place).slice(-2) + " of " + racers.length + "</small>";
  if (texts.place !== ps) { texts.place = ps; $("place").innerHTML = ps; }
  setText("lap", "Lap " + lapOf(you) + "/" + LAPS);
  setText("clock", time(state === "race" || state === "done" ? (you.done ? you.time : raceT) : 0));
  const bf = $("boostfill"), bw = Math.round(you.boost * 100) + "%"; if (texts.bw !== bw) { texts.bw = bw; bf.style.width = bw; } bf.classList.toggle("full", you.boost > 0.99);
  setText("boostlabel", you.boosting ? "Boost!" : you.carve ? "Carving: your boost fills" : label("x") + ": boost · " + label("b") + " in a turn: carve");
  const a = wrap(Math.atan2(gt.x - you.x, gt.z - you.z) - cam.yaw), show = Math.abs(a) > 0.75 && state === "race" && !you.done;
  $("arrow").classList.toggle("hidden", !show);                                   // the next gate, out of sight: its way
  if (show) $("arrow").style.transform = "rotate(" + (-a * 180 / Math.PI).toFixed(0) + "deg)";
}

// ---------------------------------------------------------------- the menus' content
function toCourses() {
  pausedFrom = null; engineOn(false); $("hud").classList.add("hidden");
  load(course, true); state = "attract"; const C = COURSES[course]; synth.song({ seed: C.seed, root: 50 + C.key, tempo: C.tempo, calm: true });
  menu.show("courses");
}
function pause() { if (menu.at) return; pausedFrom = state; state = "paused"; engineOn(false); menu.show("pause"); }
function resume() { menu.hide(); state = pausedFrom || "race"; pausedFrom = null; engineOn(true); E.gov.hold(800); }
const MEDAL = ["", "🥇", "🥈", "🥉"];
function renderCourses() {
  $("cards").innerHTML = COURSES.map((c, i) => {
    const b = save.best[c.id], open = i < save.open, T = THEMES[c.theme];
    return `<div class="item card${open ? "" : " locked"}" data-do="course" data-i="${i}"><span class="medal">${b && b.place <= 3 ? MEDAL[b.place] : open ? "" : "🔒"}</span>
      <span class="nm">${c.name}</span><span class="info"><i class="swatch" style="background:linear-gradient(90deg,${hex(T.horizon)},${hex(T.deep)})"></i>${open ? c.about : "Finish in the top three on the one before."}</span>
      <span class="info">${b ? "Best " + time(b.time) + " · lap " + time(b.lap) : open ? "Not raced yet" : ""}</span></div>`;
  }).join("");
  hints();
}
function optionChanged(k) {
  store();
  if (k === "music" || k === "sound") volumes();
  if (k === "picture") { clearTimeout(optionChanged.t); optionChanged.t = setTimeout(() => E.setPicture(), 700); }   // (once the choice settles: it rebuilds the world)
  if (k === "crisp") crisp();
}
function renderBox() { $("boxtable").innerHTML = E.rows().map(r => `<tr><td>${r[0]}</td><td>${U.esc(r[1])}</td></tr>`).join(""); }
function retest() { $("boxtable").innerHTML = "<tr><td>Test</td><td>running… (about two seconds)</td></tr>"; E.retest(renderBox); }
function showResults(newBest) {
  if (state !== "done") return;
  const C = COURSES[course], next = course + 1 < COURSES.length && course + 1 < save.open;
  const list = racers.slice().sort((a, b) => a.place - b.place).map(r => `<span style="color:${hex(r.def.col)}">${ord(r.place)} ${r.def.name}</span>`).join(" &nbsp; ");
  $("resultText").innerHTML = `<span class="big">${MEDAL[you.place] || ""} ${ord(you.place)}</span>${C.name}<br>Time ${time(you.time)} · best lap ${time(you.bestLap)}${newBest ? " · a new best" : ""}<br><small>${list}</small>`;
  $("resultButtons").innerHTML = (next ? `<div class="item" data-do="next">Next water</div>` : "") + `<div class="item" data-do="again">Race again</div><div class="item" data-do="courses">Other waters</div>`;
  engineOn(false); $("hud").classList.add("hidden"); menu.show("results");
}

addEventListener("pointerdown", () => synth.start());
document.addEventListener("visibilitychange", () => { if (document.hidden && state === "race") pause(); });
if (E.test) window.TW = { get state() { return state; }, get you() { return you; }, get racers() { return racers; }, get world() { return world; },
  get gov() { return E.gov; }, get mode() { return E.mode; }, get probe() { return E.probe; }, get bench() { return E.bench; }, get plan() { return E.plan; },
  get screen() { return menu.at; }, get g3() { return E.g3; }, E, startRace, menu, save: () => save, cam };
E.start();
})();
</script></body></html>
