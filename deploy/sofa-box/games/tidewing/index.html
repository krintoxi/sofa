   sparks, hit the boost pads, keep off the rocks and the shore. Twelve courses in three cups (points for every place,
   a trophy opens the next cup and a new skimmer), time trials against the ghost of your best lap, four skimmers that
   handle differently, weather (a gale with lightning, snow on the ice, ash off a volcano, water that glows), land
   with height (cliffs, a red-rock gorge, a volcano, reefs) and two players on one screen with the rivals.
   Everything is the game's own and made in code: the courses, the low-poly islands and craft, the music. The engine
   tunes it to the box: 3D at a size and draw distance the GPU holds steady, or the same water in 2D on a box without
   a real GPU. It plays offline, with a controller first (A B X Y, or ✕ ○ □ △) or the keyboard, and keeps its records
   on the box. In the address: #fps, #flat or #gl, #rung=N, #test (window.TW, for checks), #demo (it races itself). */

let save = fresh();

function store() { if (E.demo) return; try { localStorage.setItem(SAVE, JSON.stringify(save)); } catch (e) { /* full or blocked: the race still runs */ } }
