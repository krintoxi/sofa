function spr(rows, over) {
  let w = 0; for (let i = 0; i < rows.length; i++) w = Math.max(w, rows[i].length);
  const c = mk(w, rows.length), g = g2(c);
  for (let y = 0; y < rows.length; y++) for (let x = 0; x < rows[y].length; x++) {
    const ch = rows[y][x]; if (ch === ".") continue;
    const col = (over && over[ch]) || PAL[ch]; if (!col) continue;
    g.fillStyle = col; g.fillRect(x, y, 1, 1);

  return c;
}
function flipped(src) { const c = mk(src.width, src.height), g = g2(c); g.translate(src.width, 0); g.scale(-1, 1); g.drawImage(src, 0, 0); return c; }
function whiteOf(src) {
  const c = mk(src.width, src.height), g = g2(c); g.drawImage(src, 0, 0);
  g.globalCompositeOperation = "source-in"; g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height); return c;
}
function scaled(src, k) { const c = mk(src.width * k, src.height * k), g = g2(c); g.drawImage(src, 0, 0, c.width, c.height); return c; }

function sset(frames, over, k) {
  const r = [], l = [];
  for (let i = 0; i < frames.length; i++) { let c = spr(frames[i], over); if (k > 1) c = scaled(c, k); r.push(c); l.push(flipped(c)); }
  return { r, l, wr: whiteOf(r[0]), wl: whiteOf(l[0]), w: r[0].width, h: r[0].height };
}

    else if (P.gold < r.p) { toast("YOU NEED " + (r.p - P.gold) + " MORE GOLD", C_RED); sfx(SND_MENU); }
    else if (r.k === 0) { if (P.belt[r.i] >= BELT[r.i].cap) toast("YOUR BELT HOLDS NO MORE", C_GREY); else { P.belt[r.i]++; P.gold -= r.p; sfx(SND_COIN); } }
    else { if (P.pack.length >= PACK) toast("YOUR PACK IS FULL", C_RED); else { P.gold -= r.p; P.pack.push(r.it); stock.splice(r.i, 1); toast("BOUGHT " + r.n, RAR_C[r.it.r]); sfx(SND_COIN); shopSel = Math.max(0, Math.min(shopSel, rowsNow().length - 1)); } }
    save();
  }
}
function drawShop() {
  ctx.drawImage(frozen, 0, 0); dim(0.5); panel(14, 8, 452, 254);
  text(ctx, "HESK'S CANDLES AND CURES", 24, 16, C_GOLD, 2); ctx.drawImage(S.coin, 448, 17); rtext(ctx, "" + P.gold, 444, 17, C_GOLD);
  const tabs = ["BUY", "SELL"];
  for (let t = 0; t < 2; t++) { const x = 24 + t * 50; ctx.fillStyle = t === shopTab ? "#5a4a6a" : "#241d2e"; ctx.fillRect(x, 34, 46, 13); ctext(ctx, tabs[t], x + 23, 37, t === shopTab ? C_GOLD : C_GREY); }
  text(ctx, T_LB + T_RB, 128, 37, C_W);
  const rows = rowsNow(), top = Math.max(0, Math.min(shopSel - 5, rows.length - 10));
  if (!rows.length) text(ctx, shopTab ? "YOUR PACK IS EMPTY" : "HESK IS SOLD OUT", 28, 56, C_DARK);
  for (let i = top; i < Math.min(rows.length, top + 10); i++) {
    const r = rows[i], y = 54 + (i - top) * 18, sel = i === shopSel;
    ctx.fillStyle = sel ? "#3a3048" : "#1d1726"; ctx.fillRect(24, y, 214, 16); if (sel) { ctx.fillStyle = "#f2c14e"; ctx.fillRect(24, y, 2, 16); }
    ctx.drawImage(r.ic, 28, y + 2); text(ctx, r.n.length > 26 ? r.n.slice(0, 25) + "." : r.n, 44, y + 5, r.c);
    rtext(ctx, "" + r.p, 226, y + 5, r.k === 2 || P.gold >= r.p ? C_GOLD : C_RED); ctx.drawImage(S.coin, 229, y + 5);
  }
  ctx.fillStyle = "#241d2e"; ctx.fillRect(250, 34, 206, 206);
  const r = rows[shopSel];
  if (r && r.it) drawDetails(r.it, P.eq[r.it.s], 256, 40, 196);
  else if (r) { const ls = wrap(BELT[r.i].d, 196); text(ctx, BELT[r.i].n, 256, 40, C_W); for (let k = 0; k < ls.length; k++) text(ctx, ls[k], 256, 52 + k * 10, C_GREY); }
  const say = wrap(shopTab ? "\"I'LL GIVE YOU A FAIR PRICE. FAIRER THAN THE GLOAM WOULD.\"" : "\"TONICS, OIL AND ASH. AND WHAT THE BRAVE BROUGHT BACK UP.\"", 196);
  for (let k = 0; k < say.length; k++) text(ctx, say[k], 256, 206 + k * 10, C_PURP);
  hints(T_OK + (shopTab ? " SELL" : " BUY") + "   " + T_LB + T_RB + " BUY / SELL   " + T_BACK + " LEAVE");
}
function updMap() { if (hit[A_B] || hit[A_START] || hit[A_A] || hit[A_MAP]) { mode = M_PLAY; } }
function drawMapOv() {
  ctx.drawImage(frozen, 0, 0); dim(0.55);
  const k = isTown ? 6 : 4, w = MW * k, h = MH * k, x0 = Math.round(VW / 2 - w / 2), y0 = 30;
  panel(x0 - 8, y0 - 16, w + 16, h + 36);
  cstext(ctx, isTown ? "WICKHOLLOW" : "FLOOR " + depth + DOT + ZONES[zone].name, VW / 2, y0 - 10, C_GOLD);
  for (let ty = 0; ty < MH; ty++) for (let tx = 0; tx < MW; tx++) {
    const i = ty * MW + tx; if (!seen[i]) continue; const t = tiles[i];
    ctx.fillStyle = t === T_STAIRS ? "#f2c14e" : t === T_ROPE ? "#7ad8f0" : t === T_WALL || t === T_SOLID ? "#8e88a0" : "#3a3446";
    if (t === T_WALL) { let open = false; for (let d = 0; d < 8; d++) { const nx = tx + DX8[d], ny = ty + DY8[d]; if (nx >= 0 && ny >= 0 && nx < MW && ny < MH && tiles[ny * MW + nx] !== T_WALL) { open = true; break; } } if (!open) continue; }
    ctx.fillRect(x0 + tx * k, y0 + ty * k, k, k);
  }
  if (BRZ.on && seen[tidx(BRZ.x, BRZ.y)]) { ctx.fillStyle = BRZ.lit ? "#ee8a3a" : "#9a94a8"; ctx.fillRect(x0 + ((BRZ.x / TS) | 0) * k, y0 + ((BRZ.y / TS) | 0) * k, k, k); }
  ctx.fillStyle = "#ece8f4"; ctx.fillRect(x0 + Math.round(P.x / TS * k) - 2, y0 + Math.round(P.y / TS * k) - 2, 4, 4);
  hints(isTown ? T_BACK + " BACK" : "YELLOW: THE STAIR DOWN   BLUE: THE ROPE UP   " + T_BACK + " BACK");
}
function updWell() {
  if (nav[A_LEFT] || nav[A_DOWN]) { wellSel = wellSel > 1 ? wellSel - 1 : P.deepest; dirty = true; sfx(SND_MENU); }
  if (nav[A_RIGHT] || nav[A_UP]) { wellSel = wellSel < P.deepest ? wellSel + 1 : 1; dirty = true; sfx(SND_MENU); }
  if (hit[A_B]) { mode = M_PLAY; return; }
  if (hit[A_A]) goFloor(wellSel);
}
function drawWell() {
  ctx.drawImage(frozen, 0, 0); dim(0.55); panel(110, 70, 260, 120);
  cstext(ctx, "THE WELL", VW / 2, 80, C_GOLD, 2);
  cstext(ctx, "THE ROPE REACHES AS DEEP AS YOU HAVE BEEN: FLOOR " + P.deepest + ".", VW / 2, 104, C_GREY);
  cstext(ctx, LEFT + "  FLOOR " + wellSel + "  " + RIGHT, VW / 2, 122, C_W, 2);
  cstext(ctx, ZONES[zoneOf(wellSel)].name + (wellSel % 4 === 0 ? DOT + "A GUARDIAN'S FLOOR" : ""), VW / 2, 144, C_PURP);
  hints(T_MOVE + " CHOOSE THE FLOOR   " + T_OK + " DESCEND   " + T_BACK + " STAY");
}
function updTalk() {
  if (hit[A_A]) { talkPage++; dirty = true; sfx(SND_MENU); if (talkPage >= talkPages.length) mode = talkBack; }
  if (hit[A_B]) mode = talkBack;
}
function drawTalk() {
  ctx.drawImage(frozen, 0, 0); panel(20, 188, 440, 72);
  text(ctx, talkWho, 30, 196, C_GOLD);
  const ls = wrap(talkPages[talkPage] || "", 420); for (let k = 0; k < ls.length; k++) text(ctx, ls[k], 30, 210 + k * 10, C_W);
  rtext(ctx, (talkPage + 1) + "/" + talkPages.length + "  " + T_OK, 452, 248, C_GREY);
}
function updDead() { if (hit[A_A]) { goTown(); } }
function drawDead() {
  ctx.drawImage(frozen, 0, 0); dim(0.75);
  cstext(ctx, "THE GLOAM TAKES YOU", VW / 2, 92, C_RED, 3);
  cstext(ctx, "YOU WAKE BY THE WELL, WHERE THE VILLAGERS CARRIED YOU.", VW / 2, 130, C_W);
  cstext(ctx, deathGold ? "THE DARK KEPT " + deathGold + " OF YOUR GOLD." : "YOU HAD NO GOLD FOR THE DARK TO KEEP.", VW / 2, 142, C_GREY);
  hints(T_OK + " RISE");
}

// ---------------------------------------------------------------- the loop
const SHOW_FPS = /fps/i.test(location.hash);
let last = 0, fpsT = 0, fpsN = 0, fpsS = "";
function updPlay(dt) {
  gameTime += dt;
  if (shakeT > 0) { shakeT -= dt; if (shakeT <= 0) shakeM = 0; }
  if (bannerT > 0) bannerT -= dt; if (targetT > 0) targetT -= dt;
  for (let k = 0; k < 3; k++) if (toasts[k].t > 0) toasts[k].t -= dt;
  if (later) { laterT -= dt; if (laterT <= 0) { const f = later; later = null; f(); return; } }
  if (!P.dead) {
    if (hit[A_START]) { freeze(); pauseSel = 0; mode = M_PAUSE; dirty = true; sfx(SND_MENU); return; }
    if (hit[A_SEL]) { freeze(); gearSel = 0; gearArm = -1; mode = M_GEAR; dirty = true; sfx(SND_MENU); return; }
    if (hit[A_MAP]) { freeze(); mode = M_MAP; dirty = true; sfx(SND_MENU); return; }
  }
  updatePlayer(dt);
  if (mode !== M_PLAY) return;
  const tx = (P.x / TS) | 0, ty = (P.y / TS) | 0;
  if (tx !== P.tx || ty !== P.ty) { P.tx = tx; P.ty = ty; computeFOV(); if (!isTown) buildFlow(); }
  if (!isTown) { updateMonsters(dt); updateProj(dt); updateDrops(dt); }
  updateParts(dt);
  for (let i = 0; i < NFT; i++) { const f = FT[i]; if (!f.on) continue; f.t -= dt; f.y -= 22 * dt; if (f.t <= 0) f.on = false; }
}
function frame(now) {
  requestAnimationFrame(frame);
  let dt = (now - last) / 1000; last = now; if (!(dt > 0)) dt = 0; if (dt > 0.05) dt = 0.05;
  if (SHOW_FPS) { fpsT += dt; fpsN++; if (fpsT >= 1) { fpsS = fpsN + " FPS"; fpsT = 0; fpsN = 0; } }
  readInput(now, dt);
  const was = mode;
  switch (mode) {
    case M_TITLE: updTitle(dt); break; case M_CLASS: updClass(dt); break; case M_HELP: updHelp(); break; case M_PLAY: updPlay(dt); break;
    case M_PAUSE: updPause(); break; case M_GEAR: updGear(); break; case M_SHOP: updShop(); break; case M_MAP: updMap(); break;
    case M_TALK: updTalk(); break; case M_DEAD: updDead(); break; case M_WELL: updWell(); break;
  }
  if (mode !== was) dirty = true;
  // the title screens move; the game draws every frame; a menu only when something on it changed
  switch (mode) {
    case M_TITLE: drawTitle(); break; case M_CLASS: drawClass(); break;
    case M_PLAY: drawWorld(); drawHUD(); break;
    default:
      if (!dirty) break;
      switch (mode) {
        case M_HELP: drawHelp(); break; case M_PAUSE: drawPause(); break; case M_GEAR: drawGear(); break; case M_SHOP: drawShop(); break;
        case M_MAP: drawMapOv(); break; case M_TALK: drawTalk(); break; case M_DEAD: drawDead(); break; case M_WELL: drawWell(); break;
      }
  }
  dirty = false;
}
function init() {
  buildSprites(); buildFont(); buildBadges(); buildLights(); buildTitle(); loadOpts();
  for (let i = 0; i < CLS.length; i++) {
    const c = CLS[i]; c.bl = wrap(c.blurb, 132); c.stat = "HP " + c.hp + "   WICK " + c.mp;
    for (let k = 0; k < 2; k++) { const sk = c.sk[k]; sk.label = (k ? T_Y : T_X) + " " + sk.name; sk.dl = wrap(sk.desc, 116); }
  }
  setSaved(loadSave()); fit(); addEventListener("resize", fit);
  addEventListener("pointerdown", () => wakeAudio());
  requestAnimationFrame(t => { last = t; requestAnimationFrame(frame); });
}
init();
})();
