/* Neon Brawler: a street beat 'em up for Sofa Box OS, on Low2D (../low2d.js), the box's 2D engine. Five stages through

// ---------------------------------------------------------------- sheets: every figure's moves, drawn once
const BUILT = {};
function sheetOf(id, spec, fin, moves) {          // (made the first time it's wanted; a frame as big as its figure needs)
  if (BUILT[id]) return BUILT[id];
  moves = moves || FIGHTER_MOVES;
  const S = spec.size || 1, ext = spec.holds === "sledge" ? 22 : spec.holds ? 12 : 0;
  const W = Math.round((54 + ext) * S * Math.max(1, (spec.wide || 1) * 0.9)), H = Math.round((60 + (spec.holds === "sledge" ? 14 : 4)) * S);
  const frames = [], hands = [], at = {}, n = {};
  for (const m of moves) {
    at[m] = frames.length; n[m] = ANIM[m].length;
    for (let name of ANIM[m]) {
      if (m === "fin" && fin) { const f0 = Object.keys(fin)[0]; name = f0 === "hammer" ? (name === "kick0" ? "hammer0" : "hammer1") : name === "kick0" ? "kick0" : f0 === "spin" ? "spin1" : "round1"; }
      const f = figure(spec, POSES[name], W, H); frames.push(f.c); hands.push(f.hand);
    }
  }
  const sh = L2.sheet(frames, null, { ax: W >> 1, ay: H - 3 });
  sh.at = at; sh.n = n; sh.hands = hands;
  return (BUILT[id] = sh);
}
function foeSheet(kind) { const K = FOES[kind] || BOSSES[kind]; return K.flies ? droneSheet() : sheetOf(kind, K.spec, null, FOE_MOVES.concat(K.moves || [])); }
function forget(keep) { for (const k in BUILT) if (keep.indexOf(k) < 0) delete BUILT[k]; }   // (a stage's foes, let go after it)
function droneSheet() {                           // a drone: a lit body, a ring, two rotors that blur
  if (BUILT.drone) return BUILT.drone;
  const frames = [0, 1, 2].map(f => { const c = mk(26, 18), g = g2(c);
    px(g, 7, 7, 12, 5, "#1a1428"); px(g, 8, 6, 10, 1, "#2c263c"); px(g, 9, 8, 8, 2, "#ff2a6d"); px(g, 12, 8, 2, 2, "#ffea00");
    px(g, 2, 4, 6, 1, f === 1 ? "#7a7094" : "#b8b0c8"); px(g, 18, 4, 6, 1, f === 2 ? "#7a7094" : "#b8b0c8"); px(g, 4, 5, 1, 2, "#423854"); px(g, 21, 5, 1, 2, "#423854");
    px(g, 11, 12, 4, 2, "#05d9e8"); return c; });
  return (BUILT.drone = L2.sheet(frames, null, { ax: 13, ay: 17 }));
}
