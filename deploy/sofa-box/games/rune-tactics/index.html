// ---------------------------------------------------------------- a battlefield, made from a seed
// Height in steps (0-2) from smooth noise, then the theme's ground: forest, water, pits, rock, mud, ice. Your side
// deploys on the left, the foes' on the right; a way through for walkers is kept, and pits never wall it off.
function makeField(theme, seed) {
  const r = U.rand(seed * 977 + 31), t = new Uint8Array(MW * MH), h = new Uint8Array(MW * MH);
  const n = (x, y, s, o) => { const fx = x / s + o, fy = y / s + o * 1.7, ix = Math.floor(fx), iy = Math.floor(fy), tx = fx - ix, ty = fy - iy, a = hash(ix + seed, iy), b = hash(ix + 1 + seed, iy), c = hash(ix + seed, iy + 1), d = hash(ix + 1 + seed, iy + 1);
    return a + (b - a) * tx + (c - a) * ty + (a - b - c + d) * tx * ty; };
  const P = { meadow: [0.12, 0.08, 0.04, 0.04, 0, 0, 0], marsh: [0.1, 0.22, 0.04, 0.02, 0, 0.14, 0], ash: [0.04, 0.04, 0.09, 0.06, 0, 0.04, 0], frost: [0.08, 0.16, 0.05, 0.05, 0.08, 0, 0],
    ruins: [0.06, 0.05, 0.07, 0.1, 0, 0, 0.35], crypt: [0.02, 0.04, 0.12, 0.08, 0, 0, 0.6] }[theme];
  for (let y = 0; y < MH; y++) for (let x = 0; x < MW; x++) {
    const i = y * MW + x, hv = n(x, y, 4.5, 0.3);
    h[i] = hv > 0.68 ? 2 : hv > 0.48 ? 1 : 0;
    const q = r(); let k = GRASS, acc = 0;
    for (const [kind, p] of [[FOREST, P[0]], [WATER, P[1]], [PIT, P[2]], [ROCK, P[3]], [ICE, P[4]], [MUD, P[5]], [FLOOR, P[6]]]) { acc += p; if (q < acc) { k = kind; break; } }
    if (k === WATER || k === PIT || k === ICE) h[i] = 0;
    if ((k === WATER || k === PIT || k === ROCK) && (x < 2 || x > MW - 3)) k = theme === "crypt" || theme === "ruins" ? FLOOR : GRASS;
    t[i] = k;
  }
  // water and ice and pits in clumps: a lone pool grows a neighbour
  for (let i = 0; i < MW * MH; i++) if ((t[i] === WATER || t[i] === ICE) && r() < 0.6) { const [dx, dy] = DIRS[(r() * 4) | 0], x = i % MW + dx, y = ((i / MW) | 0) + dy; if (x > 1 && y >= 0 && x < MW - 2 && y < MH) { t[y * MW + x] = t[i]; h[y * MW + x] = 0; } }
  // a way across for walkers: if the right can't be reached from the left, clear a winding path
  const ok = i => TERRAIN[t[i]].cost < 99;
  const reach = () => { const seen = new Uint8Array(MW * MH), q = []; for (let y = 0; y < MH; y++) if (ok(y * MW)) { seen[y * MW] = 1; q.push(y * MW); }
    while (q.length) { const c = q.pop(), x = c % MW, y = (c / MW) | 0; for (const [dx, dy] of DIRS) { const nx = x + dx, ny = y + dy; if (nx < 0 || ny < 0 || nx >= MW || ny >= MH) continue; const k = ny * MW + nx; if (!seen[k] && ok(k) && Math.abs(h[k] - h[c]) < 2) { seen[k] = 1; q.push(k); } } }
    let right = 0; for (let y = 0; y < MH; y++) if (seen[y * MW + MW - 1]) right++; let all = 0, got = 0; for (let k = 0; k < MW * MH; k++) if (ok(k)) { all++; if (seen[k]) got++; } return right >= 3 && got >= all * 0.9; };
  for (let tries = 0; tries < 6 && !reach(); tries++) {
    let y = (r() * MH) | 0;
    for (let x = 0; x < MW; x++) { const i = y * MW + x; if (!ok(i)) t[i] = theme === "crypt" || theme === "ruins" ? FLOOR : GRASS; if (x > 0) h[i] = Math.min(h[i], h[i - 1] + 1); if (r() < 0.3) { y = clamp(y + (r() < 0.5 ? -1 : 1), 0, MH - 1); const j = y * MW + x; if (!ok(j)) t[j] = GRASS; h[j] = Math.min(h[j], h[i] + 1); } }
    // cliffs too steep: soften them
    for (let k = 0; k < MW * MH; k++) for (const [dx, dy] of DIRS) { const x = k % MW + dx, yy = ((k / MW) | 0) + dy; if (x < 0 || yy < 0 || x >= MW || yy >= MH) continue; const j = yy * MW + x; if (h[k] - h[j] > 1) h[k] = h[j] + 1; }
  }
  return { t, h, fire: new Uint8Array(MW * MH), theme };
}

// ---------------------------------------------------------------- the figures (drawn once each, two frames)
const SPR = {};
function sprite(k) {
  if (SPR[k]) return SPR[k];
  const big = FOES[k] && FOES[k].boss, w = big ? 28 : 16, hh = big ? 31 : 23, c = mk(w * 2, hh), g = g2(c);
  for (let f = 0; f < 2; f++) { g.save(); g.translate(f * w, 3 + (f ? 1 : 0)); drawFig(g, k, w, hh); g.restore(); }   // (room above for hats)
  // an outline round it, so it reads on any ground
  const o = mk(w * 2 + 2, hh + 2), og = g2(o), sil = L2.silhouette(c, "#0b0912");
  for (const [dx, dy] of [[0, 1], [2, 1], [1, 0], [1, 2]]) og.drawImage(sil, dx, dy); og.drawImage(c, 1, 1);
  return (SPR[k] = { c: o, w, h: hh });
}
function drawFig(g, k, w, h) {
  const P = (x, y, ww, hh, c) => px(g, x, y, ww, hh, c);
  const man = (body, head, legs) => { P(5, 15, 2, 4, legs || "#3a3040"); P(9, 15, 2, 4, legs || "#3a3040"); P(4, 8, 8, 8, body); P(4, 8, 8, 1, shade(body, 1.3)); P(5, 3, 6, 5, head || "#d8a07a"); P(3, 9, 1, 5, shade(body, 0.8)); P(12, 9, 1, 5, shade(body, 0.8)); };
  switch (k) {
    case "kael": man("#5a6a8a"); P(4, 8, 8, 2, "#c8ccd8"); P(5, 2, 6, 3, "#c8ccd8"); P(5, 5, 6, 1, "#8a90a0"); P(1, 8, 4, 7, "#3a6ad8"); P(2, 9, 2, 5, "#e8d070"); P(12, 3, 1, 8, "#e8e8f0"); P(11, 10, 3, 1, "#a87a3a"); P(7, 15, 2, 3, "#3a6ad8"); break;
    case "lyra": man("#4a7a3a"); P(4, 2, 8, 3, "#3a8a3a"); P(4, 4, 2, 4, "#3a8a3a"); P(10, 4, 2, 4, "#3a8a3a"); P(12, 4, 1, 11, "#8a5a2a"); P(13, 5, 1, 9, "#e8e0c8"); P(3, 7, 2, 6, "#6a4a2a"); break;
    case "orin": man("#b83a2a"); P(4, 0, 8, 2, "#8a2a1e"); P(6, -2, 4, 2, "#8a2a1e"); P(7, -3, 2, 1, "#8a2a1e"); P(3, 14, 10, 2, "#8a2a1e"); P(12, 8, 2, 2, "#ffd27a"); P(12, 6, 2, 2, "#ff8a3a"); P(6, 5, 1, 1, "#141018"); P(9, 5, 1, 1, "#141018"); break;
    case "sefa": man("#e8e4d8", null, "#c8c0b0"); P(4, 12, 8, 1, "#d8b040"); P(5, 2, 6, 2, "#d8b040"); P(13, 2, 1, 14, "#a87a3a"); P(12, 1, 3, 3, "#ffd27a"); P(3, 14, 10, 2, "#e8e4d8"); break;
    case "vesk": man("#5a3a9a"); P(5, 2, 6, 2, "#9ad8f0"); P(13, 3, 1, 13, "#6a5a8a"); P(12, 1, 3, 3, "#5ae0ff"); P(3, 14, 10, 2, "#4a2e7a"); P(4, 11, 8, 1, "#9ad8f0"); break;
