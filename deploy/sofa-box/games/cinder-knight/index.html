/* Cinder Knight's rules, apart from the drawing: the knight's moves, the stages and what's in them. The game plays
   by these, and the box's tests play every stage with them in node (each stage can be finished with the moves you
   have by then). */
window.CinderRules = (function () {
"use strict";
const L2 = window.Low2D, TS = 16;
// how the knight moves (pixels and seconds): a jump clears 3 tiles, two jumps 6, a dash 4 across without falling
const PHYS = { run: 112, accel: 1500, air: 1100, fric: 2200, grav: 980, fall: 400, jump: 330, cut: 0.45, jump2: 300,
  dash: 330, dashT: 0.2, dashCD: 0.3, cling: 46, climb: 72, kick: 150, wallJump: 300, kickT: 0.14, hop: 230,
  coyote: 0.09, buffer: 0.13, w: 10, h: 20 };
// tiles: their kinds, and what each kind is
const K = { AIR: 0, SOLID: 1, PLAT: 2, SPIKE: 3, POOL: 4, DEEP: 5, CRACK: 6, CRUMBLE: 7, VEIL: 8, GATE: 9, ALT: 10 };
const CRACK = 16, CRUMBLE = 32, VEIL = 64;
const CHARS = { "#": K.SOLID, X: K.ALT, "=": K.PLAT, "^": K.SPIKE, "~": K.POOL, "%": K.CRACK, ":": K.CRUMBLE, "|": K.VEIL };
// things: the start, checkpoints, the way out, the three ember shards, embers, chests, heart vials, torches, the
// stage's shrine (a move learned), the boss and its gates, and the eight kinds of foe
const THINGS = "@CE*o$+TDBGcbkgsrwx";
const FOES = { c: "cinderling", b: "ashbat", k: "husk", g: "grub", s: "spouter", r: "shardback", w: "wisp", x: "shade" };
function flagsOf(map) {
  const f = map.flags;
  f[K.SOLID] = f[K.ALT] = L2.SOLID; f[K.PLAT] = L2.ONEWAY; f[K.SPIKE] = f[K.POOL] = f[K.DEEP] = L2.HURT;
  f[K.CRACK] = L2.SOLID | CRACK; f[K.CRUMBLE] = L2.ONEWAY | CRUMBLE; f[K.VEIL] = L2.SOLID | VEIL; f[K.GATE] = 0;
}
// a stage's rows of characters: its map and its things
function parse(rows) {
  const h = rows.length; let w = 0; for (const r of rows) w = Math.max(w, r.length);
  const map = new L2.TileMap(w, h, TS); flagsOf(map); map.outside = K.SOLID;
  const things = [];
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const c = rows[y][x] || ".";
    const k = CHARS[c];
    map.t[y * w + x] = k == null ? K.AIR : k;
    if (THINGS.indexOf(c) >= 0) things.push({ c, x, y });
  }
  for (let x = 0; x < w; x++) for (let y = 1; y < h; y++) { const i = y * w + x; if (map.t[i] === K.POOL && (map.t[i - w] === K.POOL || map.t[i - w] === K.DEEP)) map.t[i] = K.DEEP; }
  return { map, things, w, h };
}
function knight(x, y) {
  return { x, y, w: PHYS.w, h: PHYS.h, vx: 0, vy: 0, face: 1, ground: false, coyote: 0, buffer: 0, held: false, air2: false,
    dashT: 0, dashCD: 0, dashUsed: false, cling: 0, kickT: 0, dropT: 0, jumped: 0, landed: false };
}
function approach(v, t, d) { return v < t ? Math.min(t, v + d) : Math.max(t, v - d); }
// a wall beside the knight, all the way up its body, on side s (-1 left, 1 right)
function wallAt(k, map, s) {
  const x = Math.floor((k.x + s * (k.w / 2 + 1)) / TS), y0 = Math.floor((k.y - k.h + 2) / TS), y1 = Math.floor((k.y - 3) / TS);
  for (let y = y0; y <= y1; y++) if (!(map.flag(x, y) & L2.SOLID)) return false;
  return true;
}
function onPlatform(k, map) {                        // standing on one-way tiles alone (down and jump drops through)
  const y = Math.floor((k.y + 0.5) / TS), x0 = Math.floor((k.x - k.w / 2) / TS), x1 = Math.floor((k.x + k.w / 2 - 0.01) / TS);
  let plat = false;
  for (let x = x0; x <= x1; x++) { const f = map.flag(x, y); if (f & L2.SOLID) return false; if (f & L2.ONEWAY) plat = true; }
  return plat;
}
// one fixed step of the knight's moving. inp: { x, y: -1..1, jump: pressed now, held: the jump button held, dash:
// pressed now, slow: how fast it may walk (1; less behind the shield) }; moves: { double, dash, climb, shield }
function step(k, inp, dt, map, moves) {
  const P = PHYS;
  k.coyote = k.ground ? P.coyote : Math.max(0, k.coyote - dt);
  k.buffer = inp.jump ? P.buffer : Math.max(0, k.buffer - dt);
  if (k.dashCD > 0) k.dashCD -= dt;
  if (k.dropT > 0) k.dropT -= dt;
  if (k.kickT > 0) k.kickT -= dt;
  k.jumped = 0;
  if (inp.dash && moves.dash && k.dashT <= 0 && k.dashCD <= 0 && !k.dashUsed) {
    if (k.cling) { k.face = -k.cling; k.cling = 0; } else if (inp.x > 0.3) k.face = 1; else if (inp.x < -0.3) k.face = -1;
    k.dashT = P.dashT; k.dashCD = P.dashT + P.dashCD; if (!k.ground) k.dashUsed = true;
    k.vy = 0; k.held = false; k.jumped = 4;
  }
  if (k.dashT > 0) {
    k.dashT -= dt; k.vx = k.face * P.dash; k.vy = 0;
    if (k.dashT <= 0) k.vx = k.face * P.run;
  } else {
    if (k.cling) {                                   // let go: pushed away from it, landed, or the wall ends (climbing
      if (k.ground || inp.x * k.cling < -0.3) k.cling = 0;   // up over its top: a hop up and over)
      else if (!wallAt(k, map, k.cling)) { if (inp.y < -0.4 || inp.x * k.cling > 0.3) k.vy = -P.hop; k.cling = 0; }
    } else if (moves.climb && !k.ground && k.vy > -40 && k.kickT <= 0) {
      const s = inp.x > 0.3 ? 1 : inp.x < -0.3 ? -1 : 0;
      if (s && wallAt(k, map, s)) { k.cling = s; k.vx = 0; k.air2 = !!moves.double; k.dashUsed = false; }
    }
    if (k.cling) { k.vx = 0; k.face = k.cling; k.vy = inp.y < -0.4 ? -P.climb : inp.y > 0.4 ? P.climb * 1.5 : P.cling; }
    else {
      const target = inp.x * P.run * (inp.slow == null ? 1 : inp.slow);
      const a = k.ground ? (Math.abs(target) < 1 ? P.fric : P.accel) : k.kickT > 0 ? P.air * 0.3 : P.air;
      k.vx = approach(k.vx, target, a * dt);
      if (inp.x > 0.3) k.face = 1; else if (inp.x < -0.3) k.face = -1;
    }
    if (k.buffer > 0) {
      if ((k.ground || k.coyote > 0) && inp.y > 0.5 && onPlatform(k, map)) { k.dropT = 0.22; k.buffer = 0; k.ground = false; k.coyote = 0; }
      else if (k.ground || k.coyote > 0) { k.vy = -P.jump; k.ground = false; k.coyote = 0; k.buffer = 0; k.held = true; k.jumped = 1; }
      else if (k.cling) { k.vy = -P.wallJump; k.vx = -k.cling * P.kick; k.face = -k.cling; k.cling = 0; k.kickT = P.kickT; k.buffer = 0; k.held = true; k.jumped = 3; }
      else if (k.air2) { k.vy = -P.jump2; k.air2 = false; k.buffer = 0; k.held = true; k.jumped = 2; }
    }
    if (k.held && (!inp.held || k.vy >= 0)) { if (k.vy < 0) k.vy *= P.cut; k.held = false; }   // let go early: a lower jump
    if (!k.cling) k.vy = Math.min(P.fall, k.vy + P.grav * dt);
  }
  const hit = map.move(k, k.vx * dt, k.vy * dt, k.dropT > 0);
  if (hit & (L2.LEFT | L2.RIGHT)) { k.vx = 0; if (k.dashT > 0) k.dashT = 0; }
  if (hit & L2.UP && k.vy < 0) { k.vy = 0; k.held = false; }
  const was = k.ground;
  k.ground = !!(hit & L2.DOWN) || (k.vy >= 0 && k.dashT <= 0 && map.ground(k, k.dropT > 0));
  if (k.ground) { if (k.vy > 0) k.vy = 0; k.air2 = !!moves.double; k.dashUsed = false; k.cling = 0; k.coyote = P.coyote; }
  k.landed = k.ground && !was;
  return hit;
}

// ================================================================ the controller (and keys) outside the menus
function onButton(b, how, who) {
  if (how !== "press" && how !== "repeat") return;
  if (DEMO) return;
  if (mode === "title" && !menu.at) { menu.show("title"); return; }
  if (mode === "play") {
    if (banner && banner.learn) { if (banner.t > 0.8 && (b === "a" || b === "x" || b === "b" || b === "start")) banner = null; return; }
    if ((b === "start" || b === "back" || b === "select") && how === "press") pause();
    return;
  }
  if (mode === "map") {
    if (b === "right" || b === "down") { if (mapAt < Math.min(slot.reached, 15)) { mapAt++; snd("move"); music(R.STAGES[mapAt].region); } }
    else if (b === "left" || b === "up") { if (mapAt > 0) { mapAt--; snd("move"); music(R.STAGES[mapAt].region); } }
    else if (how !== "press") return;
    else if (b === "a" || b === "start") { if (mapAt <= slot.reached) { snd("ok"); startStage(mapAt); } else snd("no"); }
    else if (b === "y" || b === "x") { snd("ok"); setMode("forge"); menu.show("forge"); }
    else if (b === "b" || b === "back") { snd("move"); toTitle(); }
    return;
  }
  if ((mode === "intro" || mode === "ending") && how === "press" && (b === "a" || b === "start" || b === "b") && modeT > 2) {
    if (mode === "intro") toMap(); else { G.fade(toMap); }
  }

  switch (mode) {
    case "title": updTitle(dt); break;
    case "intro": case "ending": if (rnd() < dt * 10) parts.emit(rr(60, VW - 60), VH + 2, 1, { c: EMB, v: 30, a: -Math.PI / 2, sp: 0.5, life: 4, bright: 1, drag: 0.2 }); parts.step(dt); break;
    case "map": parts.step(dt); break;
    case "forge": parts.step(dt); break;

  for (const f of ST.foes) if (f.on && !f.ghost && Math.abs(f.y - k.y) < 34 && (f.x - k.x) * k.face > -8 && Math.abs(f.x - k.x) < 36) inp.strike = true;

}
