const ctx=canvas.getContext("2d");

function scaleCanvas(){
  const sx=Math.floor(window.innerWidth/W),sy=Math.floor(window.innerHeight/H);
  const sc=Math.max(1,Math.min(sx,sy));
  canvas.style.width=(W*sc)+"px";canvas.style.height=(H*sc)+"px";
}
scaleCanvas();
window.addEventListener("resize",scaleCanvas);

function mk(w,h){const c=document.createElement("canvas");c.width=w;c.height=h;return c;}
function g2(c){const g=c.getContext("2d");g.imageSmoothingEnabled=false;return g;}
function spr(rows,over){
  let w=0;for(let i=0;i<rows.length;i++)w=Math.max(w,rows[i].length);
  const c=mk(w,rows.length),g=g2(c);
  for(let y=0;y<rows.length;y++)for(let x=0;x<rows[y].length;x++){
    const ch=rows[y][x];if(ch===".")continue;
    const col=(over&&over[ch])||PAL[ch];if(!col)continue;
    g.fillStyle=col;g.fillRect(x,y,1,1);
  }
  return c;
}

// ─── BAYER DITHER ──────────────────────────────────────────────────────────
const BAYER=[[0,8,2,10],[12,4,14,6],[3,11,1,9],[15,7,13,5]];
function ditherDisc(ctx,cx,cy,r,hexCol,maxAlpha){
  const r2=r*r;
  const x0=Math.floor(cx-r),x1=Math.ceil(cx+r);
  const y0=Math.floor(cy-r),y1=Math.ceil(cy+r);
  for(let py=y0;py<=y1;py++){
    for(let px=x0;px<=x1;px++){
      const dx=px-cx,dy=py-cy,d2=dx*dx+dy*dy;
      if(d2>r2)continue;
      const dist=Math.sqrt(d2)/r;
      const alpha=maxAlpha*(1-dist);
      const thr=BAYER[py&3][px&3]/16;
      if(alpha>thr){ctx.fillStyle=hexCol;ctx.fillRect(px,py,1,1);}
    }
  }
}
function ditherRect(ctx,x,y,w,h,hexCol,alpha){
  for(let py=y;py<y+h;py++){
    for(let px=x;px<x+w;px++){
      const thr=BAYER[py&3][px&3]/16;
      if(alpha>thr){ctx.fillStyle=hexCol;ctx.fillRect(px,py,1,1);}
    }
  }
}

// the letters: each drawn once in each colour, then copied (far cheaper on a Pi than every pixel, every frame)
let GLYPHS={}, glyphCols=0;
function glyphOf(ch,col){
  let set=GLYPHS[col];
  if(!set){ if(++glyphCols>48){ GLYPHS={}; glyphCols=1; } set=GLYPHS[col]={}; }
  let c=set[ch]; if(c) return c;
  const glyph=FONT_MAP[ch]||FONT_MAP[" "];
  c=document.createElement("canvas"); c.width=5; c.height=7; const g=c.getContext("2d"); g.fillStyle=col;
  for(let gy=0;gy<7;gy++){ const row=glyph[gy]||"00000"; for(let gx=0;gx<5;gx++) if(row[gx]==="1") g.fillRect(gx,gy,1,1); }
  return set[ch]=c;
}
function drawText(ctx,str,x,y,col,scale,shadow){
  scale=scale||1; const s=str.toUpperCase(); col=col||PAL.w;
  let cx=x;
  for(let i=0;i<s.length;i++){
    const ch=s[i];
    if(ch!==" "){ if(shadow) ctx.drawImage(glyphOf(ch,PAL.k),cx+scale,y+scale,5*scale,7*scale); ctx.drawImage(glyphOf(ch,col),cx,y,5*scale,7*scale); }
    cx+=6*scale;
  }
}
function textWidth(str,scale){return str.length*(5+1)*(scale||1);}
function drawCenter(ctx,str,y,col,scale){
  const tw=textWidth(str,scale);
  drawText(ctx,str,Math.floor((W-tw)/2),y,col,scale,true);
}

// ─── WEB AUDIO ─────────────────────────────────────────────────────────────
let audioCtx=null;
function ensureAudio(){
  if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  return audioCtx;
}
function playTone(freq,type,dur,vol,delay,when){
  const ac=ensureAudio();
  const t=(when||ac.currentTime)+(delay||0);
  const osc=ac.createOscillator();
  const gain=ac.createGain();
  osc.connect(gain);gain.connect(ac.destination);
  osc.type=type||"sine";
  osc.frequency.setValueAtTime(freq,t);
  gain.gain.setValueAtTime(vol||0.15,t);
  gain.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  osc.start(t);osc.stop(t+dur+0.01);
}
function sfxLand(){playTone(180,"triangle",0.08,0.1);}
function sfxMatch(gemColor){
  const notes={r:261.6,b:329.6,c:392,e:440,y:523.2,p:659.3};
  const f=notes[gemColor]||261.6;
  playTone(f,"sine",0.2,0.15);
  playTone(f*1.5,"sine",0.15,0.07,0.05);
}
function sfxChain(len){
  const base=261.6;
  for(let i=0;i<len;i++){
    playTone(base*Math.pow(1.2,i),"sine",0.15,0.12,i*0.08);
  }
}
function sfxBeamFire(){
  const ac=ensureAudio();
  const t=ac.currentTime;
  const osc=ac.createOscillator();
  const gain=ac.createGain();
  osc.connect(gain);gain.connect(ac.destination);
  osc.type="sine";
  osc.frequency.setValueAtTime(200,t);
  osc.frequency.linearRampToValueAtTime(800,t+0.4);
  gain.gain.setValueAtTime(0.15,t);
  gain.gain.exponentialRampToValueAtTime(0.0001,t+0.4);
  osc.start(t);osc.stop(t+0.5);
}
function sfxBeamFusion(){
  const scale=[523.2,587.3,659.3,784,880];
  for(let i=0;i<scale.length;i++){
    playTone(scale[i],"sine",0.08,0.12,i*0.05);
  }
}

// ─── CONTROLLER / KEYBOARD ────────────────────────────────────────────────
// The controller through the box's pad.js (SofaPad): presses kept until the frame reads them, the stick and the
// D-pad both move. The keyboard is for when there's no controller; while one is in use, the keys the box sends for
// its presses (for its own menus) are ignored.
const keys={};
document.addEventListener("keydown",e=>{ if(window.SofaPad&&SofaPad.echo(e)) return; keys[e.code]=true; if(/^(Arrow|Space$)/.test(e.code)) e.preventDefault(); ensureAudio(); });
document.addEventListener("keyup",e=>{keys[e.code]=false;});
const padHit={};
if(window.SofaPad) SofaPad.on((b,how)=>{ if(how==="press"){ padHit[b]=1; ensureAudio(); } });
const PADBTN={0:"a",1:"b",2:"x",3:"y",9:"start"};
function btnPressed(idx){ return padHit[PADBTN[idx]]===1; }
function btnHeld(idx){ return !!(window.SofaPad&&SofaPad.held(PADBTN[idx])); }
function axisX(){
  if(!window.SofaPad) return 0;
  return SofaPad.held("left")?-1:SofaPad.held("right")?1:SofaPad.stick().x;
}
function padDown(){ return !!(window.SofaPad&&(SofaPad.held("down")||SofaPad.held("a")||SofaPad.stick().y>0.6)); }
const prevKeys={};
function keyJustPressed(code){ return !!keys[code]&&!prevKeys[code]; }
function updatePrevKeys(){ for(const k in keys){prevKeys[k]=keys[k];} }
function BL(b){
  if(window.SofaPad&&SofaPad.connected()) return SofaPad.kind()==="playstation"?({a:"\u2715",b:"\u25cb",start:"OPTIONS"})[b]:(b==="start"?"MENU":b.toUpperCase());
  return ({a:"SPACE",b:"SHIFT",start:"ESC"})[b];
}

function randomGem(){
  if(Math.random()<0.03)return GEM_WILD;
  return GEM_TYPES[Math.floor(Math.random()*GEM_TYPES.length)];
}
function initGame(){
  initBoard();
  score=0;level=1;chain=0;levelScore=0;
  fallSpeed=800;hyperMode=false;

  particles=[];scorePopups=[];

}
function spawnGem(){
  const col=COLS>>1;
  if(board[0][col]!==null){state="gameover";sfxGameOver();return;}
  falling.col=col;
  falling.row=-1;
  falling.color=nextGems.shift();
  nextGems.push(randomGem());
  heldUsed=false;
  fallTimer=0;
}

// ─── MATCHING ─────────────────────────────────────────────────────────────
function checkMatches(){
  const matched=new Set();
  // horizontal
  for(let r=0;r<ROWS;r++){
    for(let c=0;c<=COLS-MATCH_SIZE;c++){
      const gc=board[r][c];
      if(!gc)continue;
      let run=1;
      while(c+run<COLS&&(board[r][c+run]===gc||gc===GEM_WILD||board[r][c+run]===GEM_WILD))run++;
      if(run>=MATCH_SIZE){for(let i=0;i<run;i++)matched.add(r*COLS+(c+i));}
    }
  }
  // vertical
  for(let c=0;c<COLS;c++){
    for(let r=0;r<=ROWS-MATCH_SIZE;r++){
      const gc=board[r][c];
      if(!gc)continue;
      let run=1;
      while(r+run<ROWS&&(board[r+run][c]===gc||gc===GEM_WILD||board[r+run][c]===GEM_WILD))run++;
      if(run>=MATCH_SIZE){for(let i=0;i<run;i++)matched.add((r+i)*COLS+c);}
    }
  }
  // diagonal ↘
  for(let r=0;r<=ROWS-MATCH_SIZE;r++){
    for(let c=0;c<=COLS-MATCH_SIZE;c++){
      const gc=board[r][c];
      if(!gc)continue;
      let run=1;
      while(r+run<ROWS&&c+run<COLS&&(board[r+run][c+run]===gc||gc===GEM_WILD||board[r+run][c+run]===GEM_WILD))run++;
      if(run>=MATCH_SIZE){for(let i=0;i<run;i++)matched.add((r+i)*COLS+(c+i));}
    }
  }
  // diagonal ↙
  for(let r=0;r<=ROWS-MATCH_SIZE;r++){
    for(let c=MATCH_SIZE-1;c<COLS;c++){
      const gc=board[r][c];
      if(!gc)continue;
      let run=1;
      while(r+run<ROWS&&c-run>=0&&(board[r+run][c-run]===gc||gc===GEM_WILD||board[r+run][c-run]===GEM_WILD))run++;
      if(run>=MATCH_SIZE){for(let i=0;i<run;i++)matched.add((r+i)*COLS+(c-i));}
    }
  }
  return matched;
}
function resolveMatches(){
  let totalCleared=0;
  let chainCount=0;
  let clearing=true;
  while(clearing){
    const matched=checkMatches();
    if(matched.size===0){clearing=false;break;}
    chainCount++;
    // particles + popups
    const matchColors={};
    matched.forEach(idx=>{
      const r=Math.floor(idx/COLS),c=idx%COLS;
      const gc=board[r][c];
      if(!matchColors[gc])matchColors[gc]=0;
      matchColors[gc]++;
      spawnShatter(BX+c*CELL+CELL/2,BY+r*CELL+CELL/2,gc);
      board[r][c]=null;
    });
    // score
    const matchSize=matched.size;
    let pts=0;
    if(matchSize>=5)pts=600;
    else if(matchSize>=4)pts=300;
    else pts=100;
    pts*=level;
    if(chainCount>1)pts*=chainCount;
    if(fusionBonus){pts*=3;fusionBonus=false;sfxBeamFusion();}
    // color-based sound
    const topColor=Object.keys(matchColors).sort((a,b)=>matchColors[b]-matchColors[a])[0];
    sfxMatch(topColor);
    if(chainCount>1)sfxChain(chainCount);
    score+=pts;
    levelScore+=pts;
    totalCleared+=matchSize;
    // popup at board center
    const firstIdx=[...matched][0];
    const pr=Math.floor(firstIdx/COLS),pc=firstIdx%COLS;
    scorePopups.push({x:BX+pc*CELL,y:BY+pr*CELL,val:pts,life:1.5,alpha:1});
    // gravity
    gravityDrop();
    // chain display
    chainDisplay=chainCount;
    chainTimer=1.5;
  }
  if(totalCleared>0){
    chain=chainCount;
    checkLevelUp();
  }
}
function gravityDrop(){
  for(let c=0;c<COLS;c++){
    let write=ROWS-1;
    for(let r=ROWS-1;r>=0;r--){
      if(board[r][c]!==null){board[write][c]=board[r][c];if(write!==r)board[r][c]=null;write--;}
    }
    while(write>=0){board[write][c]=null;write--;}
  }
}
function checkLevelUp(){
  if(score>hiScore)hiScore=score;
  const newLevel=Math.floor(score/2000)+1;
  if(newLevel>level){
    level=newLevel;
    fallSpeed=Math.max(150,800-level*80);
    sfxLevelUp();
    if(score>=5000&&!hyperMode){hyperMode=true;sfxHyperMode();flashTimer=0.6;flashCol=PAL.y;}
  }
}

// ─── PARTICLES ─────────────────────────────────────────────────────────────
function spawnShatter(x,y,color){
  const colMap={r:PAL.r,b:PAL.b,c:PAL.c,e:PAL.e,y:PAL.y,p:PAL.p,[GEM_WILD]:PAL.w};
  const col=colMap[color]||PAL.w;
  for(let i=0;i<8;i++){
    const angle=Math.random()*Math.PI*2;
    const spd=0.5+Math.random()*2;
    particles.push({
      x,y,vx:Math.cos(angle)*spd,vy:Math.sin(angle)*spd-1,
      col,life:0.4+Math.random()*0.2,maxLife:0.6,size:2+Math.floor(Math.random()*2)
    });
  }
}
function updateParticles(dt){
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.x+=p.vx;p.y+=p.vy;p.vy+=0.08;
    p.life-=dt;
    if(p.life<=0)particles.splice(i,1);
  }
}
function drawParticles(){
  for(const p of particles){
    const alpha=p.life/p.maxLife;
    ctx.globalAlpha=Math.min(1,alpha);
    ctx.fillStyle=p.col;
    ctx.fillRect(Math.round(p.x-p.size/2),Math.round(p.y-p.size/2),p.size,p.size);
  }
  ctx.globalAlpha=1;
}

// ─── SCORE POPUPS ──────────────────────────────────────────────────────────
function updatePopups(dt){
  for(let i=scorePopups.length-1;i>=0;i--){
    const p=scorePopups[i];
    p.y-=20*dt;
    p.life-=dt;
    p.alpha=p.life/1.5;
    if(p.life<=0)scorePopups.splice(i,1);
  }
}
function drawPopups(){
  for(const p of scorePopups){
    ctx.globalAlpha=Math.min(1,p.alpha);
    drawText(ctx,"+"+p.val,Math.round(p.x),Math.round(p.y),PAL.y,1,true);
    ctx.globalAlpha=1;
  }
}

// ─── SWEEP BEAM ────────────────────────────────────────────────────────────
function updateBeam(dt){
  beamTimer+=dt*1000;
  const interval=hyperMode?BEAM_INTERVAL*0.6:BEAM_INTERVAL;
  if(beamTimer>=interval&&!beamActive){
    beamTimer=0;
    beamActive=true;
    beamCol=0;
    sfxBeamFire();
  }
  if(beamActive){
    const spd=hyperMode?60:40; // px per sec
    beamCol+=spd*dt;
    if(beamCol>COLS){
      beamActive=false;
      beamHighlight=false;
      beamCol=-1;
    } else {
      const col=Math.floor(beamCol);
      if(col>=0&&col<COLS){
        beamHighlight=true;
        beamHighlightTimer=1.0;
      }
    }
  }
  if(beamHighlight){
    beamHighlightTimer-=dt;
    if(beamHighlightTimer<=0){beamHighlight=false;}
  }
}
function drawBeam(){
  if(!beamActive)return;
  const bx=BX+Math.floor(beamCol)*CELL;
  // glow
  for(let i=0;i<3;i++){
    const r=CELL/2+i*4;
    for(let row=0;row<ROWS;row++){
      const cy=BY+row*CELL+CELL/2;
      ditherDisc(ctx,bx+CELL/2,cy,r,PAL.c,0.5/(i+1));
    }
  }
  // solid core
  ctx.globalAlpha=0.7;
  ctx.fillStyle=PAL.w;
  ctx.fillRect(bx+CELL/2-1,BY,2,ROWS*CELL);
  ctx.globalAlpha=1;
}
function getHighlightedCol(){
  if(!beamHighlight)return -1;
  return Math.floor(beamCol);
}

// ─── DRAWING BOARD ─────────────────────────────────────────────────────────
function drawBoard(){
  // board background
  ctx.fillStyle=PAL.K;
  ctx.fillRect(BX-1,BY-1,COLS*CELL+2,ROWS*CELL+2);
  // grid
  ctx.fillStyle=PAL.k;
  for(let r=0;r<=ROWS;r++)ctx.fillRect(BX,BY+r*CELL,COLS*CELL,1);
  for(let c=0;c<=COLS;c++)ctx.fillRect(BX+c*CELL,BY,1,ROWS*CELL);

  // gems on board
  for(let r=0;r<ROWS;r++){
    for(let c=0;c<COLS;c++){
      const gc=board[r][c];
      if(!gc)continue;
      const sp=gemSprite(gc);
      if(sp)ctx.drawImage(sp,BX+c*CELL,BY+r*CELL);
    }
  }

  // beam highlight columns
  const hcol=getHighlightedCol();
  if(beamHighlight&&hcol>=0&&hcol<COLS){
    const alpha=Math.min(1,(beamHighlightTimer/0.3))*0.3;
    ditherRect(ctx,BX+hcol*CELL,BY,CELL,ROWS*CELL,PAL.c,alpha);
  }

  // falling gem
  if(falling.row>=0&&falling.row<ROWS){
    const sp=gemSprite(falling.color);
    if(sp)ctx.drawImage(sp,BX+falling.col*CELL,BY+falling.row*CELL);
  } else if(falling.row===-1){
    // above board, show at top
    const sp=gemSprite(falling.color);
    if(sp){ctx.globalAlpha=0.6;ctx.drawImage(sp,BX+falling.col*CELL,BY);ctx.globalAlpha=1;}
  }

  // ghost gem
  {
    let ghostRow=falling.row;
    while(ghostRow+1<ROWS&&board[ghostRow+1][falling.col]===null)ghostRow++;
    if(ghostRow>falling.row){
      const sp=gemSprite(falling.color);
      if(sp){ctx.globalAlpha=0.25;ctx.drawImage(sp,BX+falling.col*CELL,BY+ghostRow*CELL);ctx.globalAlpha=1;}
    }
  }

  // board border flash
  if(flashTimer>0){
    const a=Math.min(1,flashTimer/0.3)*0.6;
    ditherRect(ctx,BX-2,BY-2,COLS*CELL+4,2,flashCol,a);
    ditherRect(ctx,BX-2,BY+ROWS*CELL,COLS*CELL+4,2,flashCol,a);
    ditherRect(ctx,BX-2,BY-2,2,ROWS*CELL+4,flashCol,a);
    ditherRect(ctx,BX+COLS*CELL,BY-2,2,ROWS*CELL+4,flashCol,a);
  }
}
function gemSprite(color){
  if(color===GEM_WILD)return SPRITES.gem_wild;
  const map={r:SPRITES.gem_red,b:SPRITES.gem_blue,c:SPRITES.gem_cyan,
    e:SPRITES.gem_green,y:SPRITES.gem_yellow,p:SPRITES.gem_purple};
  return map[color]||null;
}

// ─── INPUT HANDLING ────────────────────────────────────────────────────────
function handleInput(dt){
  // move left
  const leftKey=keys["ArrowLeft"]||keys["KeyA"];
  const rightKey=keys["ArrowRight"]||keys["KeyD"];
  const downKey=keys["ArrowDown"]||keys["KeyS"]||keys["Space"];
  const aBtn=btnPressed(0);
  const bBtn=btnPressed(1);
  const startBtn=btnPressed(9);
  const ax=axisX();

  // axis movement
  const leftInput=leftKey||(ax<-0.5);
  const rightInput=rightKey||(ax>0.5);
  const downInput=downKey||aBtn||padDown();

  // left
  if(leftInput){
    if(inputDelay.left<=0){
      moveFalling(-1);
      inputDelay.left=inputDelay.left===0?0.15:0.08;
    } else inputDelay.left-=dt;
  } else inputDelay.left=0;

  // right
  if(rightInput){
    if(inputDelay.right<=0){
      moveFalling(1);
      inputDelay.right=inputDelay.right===0?0.15:0.08;
    } else inputDelay.right-=dt;
  } else inputDelay.right=0;

  // drop
  if(downInput){
    if(inputDelay.down<=0){
      dropGem();
      inputDelay.down=0.05;
    } else inputDelay.down-=dt;
  } else inputDelay.down=0;

  // hold
  const holdKey=keyJustPressed("ShiftLeft")||keyJustPressed("ShiftRight")||keyJustPressed("KeyZ");
  if(bBtn||holdKey){
    if(!heldUsed)doHold();
  }

  // pause
  if(state==="game"&&(startBtn||keyJustPressed("Escape")||keyJustPressed("KeyP"))) state="pause";
}
function moveFalling(dir){
  const nc=falling.col+dir;
  if(nc>=0&&nc<COLS){
    // check collision
    if(falling.row<0||board[falling.row][nc]===null){
      falling.col=nc;
    }
  }
}
function dropGem(){
  // drop to bottom
  while(falling.row+1<ROWS&&board[falling.row+1][falling.col]===null){
    falling.row++;
  }
  landGem();
}
function doHold(){
  if(heldUsed)return;
  heldUsed=true;
  const cur=falling.color;
  if(held===null){
    held=cur;
    spawnGem();
  } else {
    falling.color=held;
    held=cur;
    falling.row=-1;
    fallTimer=0;
  }
}

// ─── LANDING ───────────────────────────────────────────────────────────────
function landGem(){
  if(falling.row<0){
    // can't place, game over
    state="gameover";sfxGameOver();return;
  }
  // check beam fusion
  const col=falling.col;
  const hcol=Math.floor(beamCol);
  if(beamHighlight&&hcol===col){
    // check if there's a matching gem in the column
    for(let r=0;r<ROWS;r++){
      if(board[r][col]===falling.color){fusionBonus=true;break;}
    }
    if(fusionBonus){flashTimer=0.4;flashCol=PAL.c;}
  }
  board[falling.row][falling.col]=falling.color;
  sfxLand();
  resolveMatches();
  spawnGem();
}

// ─── UPDATE GAME ───────────────────────────────────────────────────────────
function updateGame(dt){
  gameTime+=dt;
  updateParticles(dt);
  updatePopups(dt);
  updateBeam(dt);
  if(chainTimer>0)chainTimer-=dt;
  if(flashTimer>0)flashTimer-=dt;

  // fall
  fallTimer+=dt*1000;
  const speed=hyperMode?fallSpeed*0.6:fallSpeed;
  if(fallTimer>=speed){
    fallTimer=0;
    if(falling.row+1<ROWS&&board[falling.row+1][falling.col]===null){
      falling.row++;
    } else {
      landGem();
    }
  }
  handleInput(dt);
}

// ─── MAIN LOOP ─────────────────────────────────────────────────────────────
let lastTime=0;
function loop(ts){
  const dt=Math.min(0.05,(ts-lastTime)/1000);
  lastTime=ts;

  if(state==="title"){
    updateTitle(dt);
    drawTitle();
    // input to start
    const aBtn=btnPressed(0);
    const startBtn=btnPressed(9);
    if(aBtn||startBtn||keyJustPressed("Space")||keyJustPressed("Enter")||keyJustPressed("KeyZ")){
      ensureAudio();
      initGame();
      state="game";
    }
    blinkTimer+=dt;
  } else if(state==="game"){
    for(const s of bgStars){s.x-=s.spd;if(s.x<0)s.x=W;s.twinkle+=dt*2;}
    drawBg(dt);
    updateGame(dt);
    drawBeam();
    drawBoard();
    drawParticles();
    drawPopups();
    drawHUD();
  } else if(state==="pause"){
    for(const s of bgStars){s.x-=s.spd;if(s.x<0)s.x=W;s.twinkle+=dt*2;}
    drawBg(dt);
    drawBeam();
    drawBoard();
    drawParticles();
    drawPopups();
    drawHUD();
    drawPause();
    // resume
    if(btnPressed(9)||btnPressed(1)||keyJustPressed("Escape")||keyJustPressed("KeyP")){state="game";}
  } else if(state==="gameover"){
    blinkTimer+=dt;
    drawGameOver();
    const aBtn=btnPressed(0);
    const startBtn=btnPressed(9);
    if(aBtn||startBtn||keyJustPressed("Space")||keyJustPressed("Enter")||keyJustPressed("KeyZ")){
      ensureAudio();
      initGame();
      state="game";
    }
  }

  // update prevKeys
  for(const k in keys)prevKeys[k]=keys[k];
  for(const k in padHit) padHit[k]=0;

  requestAnimationFrame(loop);
}

// ─── BOOT ──────────────────────────────────────────────────────────────────
buildSprites();
initBg();
initTitle();
requestAnimationFrame(loop);
</script>
</body>
</html>
