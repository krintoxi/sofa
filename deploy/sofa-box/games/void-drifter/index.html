// ---------------------------------------------------------------- a run: its map of sectors
// Four zones, each five columns of two or three sectors and a boss; each sector leads on to one or two in the next
// column. A shop in every zone before its boss.
function zoneMap(zone, seed) {
  const r = U.rand(seed * 131 + zone * 17), cols = [];
  for (let c = 0; c < 5; c++) {
    const n = c === 0 ? 2 : 2 + (r() < 0.5 ? 1 : 0), col = [];
    for (let i = 0; i < n; i++) { const q = r(); col.push({ type: q < 0.42 ? "fight" : q < 0.62 ? "mine" : q < 0.84 ? "event" : "shop", next: [], done: false, c, i, n }); }
    cols.push(col);
  }
  if (!cols[3].some(s => s.type === "shop") && !cols[2].some(s => s.type === "shop")) cols[3][0].type = "shop";
  cols.push([{ type: "boss", next: [], done: false, c: 5, i: 0, n: 1 }]);
  for (let c = 0; c < 5; c++) {
    const a = cols[c], b = cols[c + 1];
    a.forEach((s, i) => { const j = Math.round(i * (b.length - 1) / Math.max(1, a.length - 1)); s.next.push(j); if (b.length > 1 && r() < 0.5) { const k = clamp(j + (r() < 0.5 ? -1 : 1), 0, b.length - 1); if (!s.next.includes(k)) s.next.push(k); } });
    b.forEach((t, j) => { if (!a.some(s => s.next.includes(j))) a[Math.min(a.length - 1, j)].next.push(j); });
  }

    hull: 0, max: 0, shield: 0, smax: 0, sT: 0, dashT: 0, dashCD: 0, inv: 1.5, fireT: 0, wi: 0, firing: false, beam: null, down: false, revT: 0, droneA: 0, droneT: 0 };
}

// ---------------------------------------------------------------- a sector: what's in it
