<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Neon Dodge</title>
<style>
  html, body { margin: 0; height: 100%; background: #07070c; color: #fff; font: 700 16px/1.3 system-ui, sans-serif; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
  .ui { position: fixed; inset: 0; display: grid; place-content: center; text-align: center; gap: 12px; pointer-events: none; }
  .ui h1 { margin: 0; font-size: 7vw; letter-spacing: -.03em; color: #FF2E88; text-shadow: 0 0 30px #FF2E88; }
  .ui p { margin: 0; font-size: 2vw; color: #c9c9d6; }
  .score { position: fixed; top: 3vh; right: 4vw; font-size: 3vw; color: #E8FF3A; text-shadow: 0 0 16px #E8FF3A; }
</style></head><body>
<canvas id="c"></canvas><div class="score" id="score">0</div>
<div class="ui" id="ui"><h1>NEON DODGE</h1><p>← → switch lanes · OK to start</p><p id="best"></p></div>
<script>
(function () {
  const c = document.getElementById("c"), x = c.getContext("2d");
  let W, H, lane = 1, blocks = [], t = 0, speed, score = 0, playing = false, best = +localStorage.getItem("neonBest") || 0, last = 0, spawn = 0, px = 0;
  const LANES = 3;
  function size() { W = c.width = innerWidth * devicePixelRatio; H = c.height = innerHeight * devicePixelRatio; }
  addEventListener("resize", size); size();
  const laneX = l => W / 2 + (l - 1) * W * 0.18;
  function start() { lane = 1; px = laneX(1); blocks = []; speed = H * 0.45; score = 0; playing = true; spawn = 0; ui.style.display = "none"; }
  function over() {
    playing = false; best = Math.max(best, Math.floor(score)); localStorage.setItem("neonBest", best);
    ui.style.display = ""; ui.querySelector("h1").textContent = "CRASH"; document.getElementById("best").textContent = "Score " + Math.floor(score) + " · best " + best;
  }
  addEventListener("keydown", e => {
    if (e.key === "ArrowLeft") lane = Math.max(0, lane - 1);
    else if (e.key === "ArrowRight") lane = Math.min(LANES - 1, lane + 1);
    else if ((e.key === "Enter" || e.key === " ") && !playing) start();
    else return;
    e.preventDefault();
  });
  addEventListener("pointerdown", e => { if (!playing) return start(); lane = e.clientX < innerWidth / 3 ? Math.max(0, lane - 1) : e.clientX > innerWidth * 2 / 3 ? Math.min(2, lane + 1) : lane; });
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000 || 0); last = now; t += dt;
    x.fillStyle = "#07070c"; x.fillRect(0, 0, W, H);
    // the road: lines rushing past
    x.strokeStyle = "rgba(255,46,136,.35)"; x.lineWidth = 2 * devicePixelRatio;
    for (let i = 0; i <= LANES; i++) { const lx = W / 2 + (i - 1.5) * W * 0.18; x.beginPath(); x.moveTo(lx, 0); x.lineTo(lx, H); x.stroke(); }
    const off = (t * (speed || H * .45)) % (H / 8);
    x.fillStyle = "rgba(232,255,58,.12)";
    for (let y = -H / 8 + off; y < H; y += H / 8) x.fillRect(W / 2 - W * 0.27, y, W * 0.54, 2 * devicePixelRatio);
    if (playing) {
      speed += H * 0.02 * dt; score += dt * 10;
      spawn -= dt;
      if (spawn <= 0) { const free = Math.floor(Math.random() * LANES); for (let l = 0; l < LANES; l++) if (l !== free && Math.random() < 0.55) blocks.push({ l, y: -H * 0.08 }); spawn = Math.max(0.35, 1.1 - score / 400); }
      blocks.forEach(b => b.y += speed * dt);
      blocks = blocks.filter(b => b.y < H * 1.1);
      px += (laneX(lane) - px) * Math.min(1, dt * 18);
      const py = H * 0.84, s = W * 0.05;
      if (blocks.some(b => Math.abs(laneX(b.l) - px) < s * 1.3 && Math.abs(b.y - py) < s * 1.1)) over();
      document.getElementById("score").textContent = Math.floor(score);
    }
    const s = W * 0.05;
    blocks.forEach(b => { x.shadowColor = "#E8FF3A"; x.shadowBlur = 20; x.fillStyle = "#E8FF3A"; x.fillRect(laneX(b.l) - s, b.y - s * 0.6, s * 2, s * 1.2); });
    x.shadowColor = "#FF2E88"; x.shadowBlur = 30; x.fillStyle = "#FF2E88";
    const py = H * 0.84; x.beginPath(); x.moveTo((px || laneX(1)), py - s); x.lineTo((px || laneX(1)) + s * 0.8, py + s * 0.7); x.lineTo((px || laneX(1)) - s * 0.8, py + s * 0.7); x.closePath(); x.fill();
    x.shadowBlur = 0;
    requestAnimationFrame(frame);
  }
  const ui = document.getElementById("ui");
  if (best) document.getElementById("best").textContent = "Best " + best;
  requestAnimationFrame(frame);
})();
</script></body></html>
