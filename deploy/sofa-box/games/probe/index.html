<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Graphics check</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1420; color: #eef4fb; font: 600 16px/1.3 system-ui, sans-serif; }
  #wrap { position: absolute; inset: 0; display: grid; grid-template-columns: 42% 58%; }
  #stage { position: relative; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 2vh; padding-left: 3vw; }
  #view { position: relative; width: 36vw; height: 20.25vw; border-radius: 1.4vh; overflow: hidden; background: #000; }
  #view canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .hidden { display: none !important; }
  #state { font-size: 2.6vh; opacity: .9; text-align: center; min-height: 3.4vh; }
  #live { font: 600 2.2vh ui-monospace, monospace; opacity: .85; text-align: center; white-space: pre; min-height: 2.6vh; }
  #panel { padding: 5vh 4vw 4vh 1vw; overflow: hidden; }
  h1 { margin: 0 0 2vh; font-size: 4.6vh; font-weight: 800; }
  #rows { border-collapse: collapse; font-size: 2.2vh; }
  #rows td { padding: .45vh 1.2vw; vertical-align: top; }
  #rows td:first-child { opacity: .7; text-align: right; white-space: nowrap; }
  #rows td:last-child { font-weight: 700; word-break: break-word; }
  #line { margin-top: 2.2vh; padding: 1.4vh 1.4vw; border-radius: 1vh; background: rgba(255, 255, 255, .08); font: 600 2vh ui-monospace, monospace; word-break: break-word; }
  .acts { display: flex; gap: 1.2vw; margin-top: 2.6vh; }
  .act { padding: 1.1vh 1.8vw; border-radius: 1vh; background: rgba(255, 255, 255, .1); font-size: 2.5vh; font-weight: 800; }
  .act.on { background: #eef4fb; color: #0d2a40; }
  .hint { margin-top: 2.2vh; font-size: 2.3vh; opacity: .85; }
  kbd { display: inline-block; min-width: 1.4em; padding: 0 .35em; border-radius: .4em; background: rgba(255, 255, 255, .9); color: #0d2a40; font: inherit; font-weight: 800; text-align: center; }
  /* the games check */
  #games { position: absolute; inset: 0; padding: 4.5vh 4vw 3vh; overflow: hidden; }
  #gabout { margin: 0 0 2.2vh; max-width: 86vw; font-size: 2.3vh; opacity: .85; }
  #gtab { border-collapse: collapse; font-size: 2.05vh; }
  #gtab th { padding: .6vh 1vw; border-bottom: 1px solid rgba(255, 255, 255, .2); text-align: left; font-weight: 700; opacity: .65; white-space: nowrap; }
  #gtab td { padding: .5vh 1vw; white-space: nowrap; }
  #gtab td.n { text-align: right; font-variant-numeric: tabular-nums; }
  #gtab tr.at td { background: rgba(255, 255, 255, .08); }
  .good { color: #8fe3a0; } .fair { color: #f2d36b; } .poor { color: #ff8c7c; } .dim { opacity: .55; }
  #gnote { margin: 2vh 0 0; max-width: 90vw; font-size: 1.9vh; opacity: .75; }
  iframe.game { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: #000; z-index: 10; }
  #badge { position: fixed; left: 1.4vw; top: 1.6vh; z-index: 11; padding: .7vh 1.1vw; border-radius: .9vh; background: rgba(5, 10, 18, .72); font-size: 1.9vh; pointer-events: none; }
</style></head><body>
<div id="wrap">
  <div id="stage"><div id="view"><canvas id="gl"></canvas><canvas id="flat" class="hidden"></canvas></div><div id="state">Looking…</div><div id="live"></div></div>
  <div id="panel"><h1>Graphics check</h1><table id="rows"></table><div id="line"></div>
    <div class="acts"><span class="act on" id="again">Test again</span><span class="act" id="check">Games check</span></div><p class="hint" id="hint"></p></div>
</div>
<div id="games" class="hidden"><h1>Games check</h1><p id="gabout"></p><table id="gtab"></table><p id="gnote"></p><p class="hint" id="ghint"></p></div>
<div id="badge" class="hidden"></div>
<script src="../pad.js"></script>
<script src="../low3d.js"></script>
<script>
/* Sofa Box OS: what this box's browser gives the box's own 3D games (Low3D, ../low3d.js). WebGL 1 and 2, the GPU behind
   it (its unmasked renderer: on a Raspberry Pi, VC4 is a Pi 3, V3D 4.2 a Pi 4, V3D 7.1 a Pi 5; SwiftShader or llvmpipe
   is software), the cores and memory the browser reports, and a ~2 s drawing test: draw calls and screens of fill
   that hold 60 fps. Then what a game would choose, and a small scene drawn that way, its frame rate live (the engine's
   governor steps it up or down as a game would). "Test again" runs the test again; Back is the box's.

   The games check: each game in ../games.json ("games") in turn, opened with #demo in a frame of this page (the same
   address, so this page can watch it), 15 s each after it settles. Then a table: frames a second (timed from the
   game's own window), late frames (more than 25 ms apart), the slowest, the game's own work each frame, memory, and
   the rung or tier the game chose when it says (window.SofaStats). A starts, B stops or goes back. In the address,
   #games opens it, &run starts it, &secs=N measures N seconds each, &only=id+id checks those games alone. */
(function () {
  "use strict";
  const L3 = window.Low3D, U = L3.U, $ = id => document.getElementById(id), H = location.hash || "";
  let probe = null, bench = null, board = null, running = false, gov = null, mode = null, g3 = null, flat = null, scene = null;
  let view = "graphics", topAt = Math.max(1, performance.now()), act = 0, info = null;
  const glc = $("gl"), flc = $("flat"), cam = L3.camera();
  function show(stateText) {
    const pl = probe ? L3.plan(probe, bench) : null, rows = probe ? L3.rows(probe, bench, pl) : [];
    if (board) rows.unshift(["Board", board]);
    if (probe && bench) { const r = L3.planRay(probe, bench), h = L3.LADDER.ray[r.rung].h; rows.push(["Drawn by the processor", "games like Ironmaw start at " + Math.round(h * 16 / 9) + "×" + h + ", " + L3.LADDER.ray[r.rung].fps + " fps (rung " + r.rung + " of " + (L3.LADDER.ray.length - 1) + ")" + (r.fx ? ", the GPU adding the glow" : "")]); }
    if (probe) rows.push(["Page", probe.view + " at " + probe.dpr + "× · screen " + probe.screen]);
    $("rows").innerHTML = rows.map(r => "<tr><td>" + r[0] + "</td><td>" + U.esc(r[1]) + "</td></tr>").join("");
    $("line").textContent = probe ? (board ? board + " | " : "") + L3.line(probe, bench, pl) : "";
    if (stateText != null) $("state").textContent = stateText;
  }
  const key = b => "<kbd>" + U.esc(SofaPad.connected() ? SofaPad.label(b) : b === "a" ? "Enter" : "Back") + "</kbd>";
  function hint() {
    $("hint").innerHTML = key("a") + " choose &nbsp; ◀ ▶ move &nbsp; Back: out";
    $("ghint").innerHTML = GC.running ? "" : key("a") + (GC.results.length ? " again" : " start") + " &nbsp; " + key("b") + " to the graphics check";
  }
  function focusAct(i) { act = U.clamp(i, 0, 1); $("again").classList.toggle("on", act === 0); $("check").classList.toggle("on", act === 1); }
  function run() {
    if (running) return; running = true; bench = null; scene = null;
    probe = L3.probe(); show("Testing… (about two seconds)");
    if (probe.webgl1 && !probe.software && !g3) { try { g3 = new L3.GL(glc, { antialias: probe.family === "desktop" || probe.family === "pi5" }); } catch (e) { g3 = null; show("WebGL is there but wouldn't start: " + e.message); } }
    glc.classList.toggle("hidden", !g3); flc.classList.add("hidden");
    L3.bench(probe.software ? null : g3, r => {
      bench = r; running = false;
      const pl = L3.plan(probe, bench);
      show(pl.mode === "gl" ? "Games here draw in 3D, from rung " + pl.rung + ". The scene above is drawn that way." :
        "Games here draw in 2D (" + (probe.software ? "the GPU is software, the 2D sea is quicker there" : pl.why) + "). The scene above is drawn that way.");
      start(pl); said();
    }, (phase, load, holds) => { $("state").textContent = (phase < 0 ? "The screen's rate…" : phase === 0 ? "Draw calls: " + load : "Fill: " + load + " screens") + (holds ? " ✓" : " ✗"); });
  }
  // a small scene, as a game would draw it here: an islet, buoys, the sea and sky, the camera going round
  function start(pl) {
    mode = pl.mode === "gl" && g3 ? "gl" : "flat";
    if (mode === "flat" && !flat) flat = new L3.Flat(flc);
    glc.classList.toggle("hidden", mode !== "gl"); flc.classList.toggle("hidden", mode !== "flat");
    const lad = L3.LADDER[mode];
    gov = new L3.Governor(lad, pl.rung, pl.top, () => size());
    const pic = document.createElement("canvas"); pic.width = pic.height = 256;
    const g = pic.getContext("2d"); g.fillStyle = "#1f6c9a"; g.fillRect(0, 0, 256, 256);
    const gr = g.createRadialGradient(128, 128, 20, 128, 128, 70); gr.addColorStop(0, "#5ec0c4"); gr.addColorStop(1, "#5ec0c400"); g.fillStyle = gr; g.fillRect(0, 0, 256, 256);
    g.fillStyle = "#e8d4a0"; g.beginPath(); g.arc(128, 128, 30, 0, 7); g.fill(); g.fillStyle = "#78a860"; g.beginPath(); g.arc(128, 128, 24, 0, 7); g.fill();
    const air = { top: 0x4a7cc8, horizon: 0xcfe2f0, fog: 0xc8dcec, sun: [0.4, 0.6, 0.5], sunCol: 0xfff2dc, amb: 0x8ea4bc, ground: 0x585048 };
    const isle = new L3.Mesh(1024); isle.seed = 5; isle.jit = 0.05;
    isle.at(0, 0, 0); isle.stack([[30, -0.9], [28, 0.6]], 12, 0xe7d2a2, null, 0.06); isle.stack([[26, 0.6], [22, 5], [14, 10]], 10, [0x7da862, 0x74a05a], 0x86b06a, 0.1);
    for (let i = 0; i < 6; i++) L3.Kit.palm(isle, Math.cos(i * 1.1) * 10, 8, Math.sin(i * 1.1) * 10, 1, 0x7a5a3e, 0x4f8a4c);
    L3.Kit.lighthouse(isle, 4, 9, -4, null);
    const marks = new L3.Mesh(512);
    for (let i = 0; i < 8; i++) L3.Kit.buoy(marks, Math.cos(i / 8 * U.TAU) * 52, Math.sin(i / 8 * U.TAU) * 52, 0xee5e3c, 0xf4efe4);
    const hills = []; const hr = U.rand(9); for (let i = 0; i < 20; i++) hills.push({ a: i / 20 * U.TAU, d: 900 + hr() * 300, r: 100 + hr() * 150, h: 40 + hr() * 100, seed: i });
    if (mode === "gl") {                             // as the box's 3D games draw (Low3D's second way): light baked in, a painted sky, mirror images in the water
      g3.light(Object.assign({ near: 160, far: 520, fogSun: 0xfff0d8 }, air));
      const sea = new L3.Mesh(8); sea.at(0, 0, 0); sea.tri(-3000, 0, -3000, 3000, 0, -3000, 3000, 0, 3000, 0xffffff, 0, -1, 0); sea.tri(-3000, 0, -3000, 3000, 0, 3000, -3000, 0, 3000, 0xffffff, 0, -1, 0);
      const world = L3.Mesh.join([isle, marks]).light(air), sl = Math.hypot(0.4, 0.6, 0.5);
      const shore = document.createElement("canvas"); shore.width = shore.height = 64;
      const sg = shore.getContext("2d"), rg = sg.createRadialGradient(32, 32, 7, 32, 32, 13); rg.addColorStop(0, "#fff"); rg.addColorStop(1, "#000"); sg.fillStyle = rg; sg.fillRect(0, 0, 64, 64);
      const sky = L3.Kit.sky({ w: Math.min(probe.maxTex || 2048, 2048), h: 256, top: air.top, mid: 0x8ab4e0, horizon: air.horizon, haze: air.fog, seed: 4, ridges: [{ h: 0.05, col: 0xa0a8c0, seed: 2 }],
        clouds: { n: 16, col: 0xffffff, lit: 0xffffff, lo: 0.06, hi: 0.6, len: 0.5 }, sun: { az: Math.atan2(0.4, 0.5), el: Math.asin(0.6 / sl), size: 0.07, col: 0xffffff, glow: 0xfff2dc, halo: 0.7 } });
      scene = { isle: g3.upload(world), sea: g3.upload(sea), tex: g3.picture(pic, { alpha: shore, mip: true }), sky: g3.picture(sky, { round: true }), rip: g3.picture(null, L3.Kit.ripples(128, 5)) };
      g3.warm(["still", "dome", "water"]);
    } else {
      flat.ground(pic, -128, -128, 256, 0x1f6c9a); flat.air({ top: air.top, horizon: air.horizon, fog: air.fog, hill: 0xb4bed0, hills: L3.Kit.skyline(hills, 720), near: 120, far: 380 });
      const light = { sun: [-0.45, 0.8, -0.4], sunCol: U.rgb01(air.sunCol), amb: U.rgb01(air.amb), ground: U.rgb01(air.ground) };
      const b = new L3.Mesh(256); L3.Kit.buoy(b, 0, 0, 0xee5e3c, 0xf4efe4);
      scene = { isle: L3.bake(isle, { ppu: 3, pitch: 0.15, light }), buoy: L3.bake(b, { ppu: 10, pitch: 0.12, light }) };
    }
    size(); gov.hold(1200);
  }
  function size() {                                  // (the scene is a part of the page: the same share of it as a game's picture is of the screen)
    const dev = Math.round($("view").clientHeight * (devicePixelRatio || 1)), full = Math.round(innerHeight * (devicePixelRatio || 1));
    const s = L3.wholeSize(dev, Math.min(dev, gov.cur.h * dev / full)), h = s[0], w = Math.round(h * 16 / 9);
    if (mode === "gl") { glc.width = w; glc.height = h; } else flat.size(w, h);
    (mode === "gl" ? glc : flc).style.imageRendering = s[1] > 1 ? "pixelated" : "auto";
  }
  let liveAt = 0;
  function frame(now) {
    requestAnimationFrame(frame);
    input.tick(now);
    if (view !== "graphics" || !scene || running || !gov.tick(now)) return;     // (not while the games check is on)
    const t0 = performance.now();
    L3.orbit(cam, 0, 0, 78, 14, now / 6000, 0, 0); cam.ty = 4; cam.fov = 0.8;
    if (mode === "gl") {
      L3.begin({ mode, g3 }, cam, 0.6, 2400);
      const R = gov.cur; g3.dome(scene.sky, 0); g3.seeUnder = R.mirror > 0;
      if (R.mirror) { g3.mirror(true); if (R.mirror > 1) g3.dome(scene.sky, 0); g3.still(scene.isle); g3.mirror(false); }
      g3.water(scene.sea, scene.tex, scene.rip, -128, -128, 256, now / 1000, { rich: R.look > 0 }); g3.still(scene.isle);
    } else {
      L3.begin({ mode, flat }, cam);
      flat.sprite(scene.isle, 0, 0, 0, 1 / 3);
      for (let i = 0; i < 8; i++) flat.sprite(scene.buoy, Math.cos(i / 8 * U.TAU) * 52, 0, Math.sin(i / 8 * U.TAU) * 52, 0.1);
      flat.flush();
    }
    gov.work(performance.now() - t0);
    if (now - liveAt > 500) {
      liveAt = now;
      const w = mode === "gl" ? glc.width : flat.w, h = mode === "gl" ? glc.height : flat.h;
      $("live").textContent = gov.fps + " fps · " + (mode === "gl" ? "3D" : "2D") + " rung " + gov.rung + " · " + w + "×" + h + (gov.log.length ? "\n" + gov.log[gov.log.length - 1] : "");
    }
  }

  // ---------------------------------------------------------------- the games check
  const GC = { list: null, results: [], i: -1, running: false, frame: null, timers: [], ticker: 0, hz: 0, precise: null, endAt: 0,
    secs: Math.max(1, +(H.match(/secs=(\d+)/) || [0, 15])[1]), only: (H.match(/only=([a-z0-9+-]+)/) || [0, ""])[1].split("+").filter(Boolean) };
  const SETTLE = 2000, OPEN = 20000, TUNE = 12000;
  function later(fn, ms) { GC.timers.push(setTimeout(fn, ms)); }
  function clear() {
    for (const t of GC.timers) clearTimeout(t);
    GC.timers = [];
    if (GC.frame) { GC.frame.remove(); GC.frame = null; }
  }
  function boxInfo(ms) {                             // (the box's agent; elsewhere there's none)
    const ask = fetch("/box/api/info").then(r => r.ok ? r.json() : null).catch(() => null);
    return ms ? Promise.race([ask, new Promise(ok => setTimeout(() => ok(null), ms))]) : ask;
  }
  const stats = W => { try { return W.SofaStats || null; } catch (e) { return null; } };
  function games(on) {
    view = on ? "games" : "graphics";
    $("games").classList.toggle("hidden", !on); $("wrap").classList.toggle("hidden", on);
    if (on) table();
    else {
      topAt = performance.now();
      if (!probe && !running) setTimeout(run, 300);
      else if (gov) { gov.hold(1200); gov.frames = 0; gov.fpsAt = topAt; }      // (its count starts again: not the time away)
    }
    hint();
  }
  function gamesRun() {
    if (GC.running || !GC.list || !GC.list.length) return;
    GC.running = true; GC.i = -1;
    GC.results = GC.list.map(g => ({ id: g.id, name: g.name, state: "waiting" }));
    table(); hint();
    // the screen's rate (a 50 Hz TV draws at most 50 frames a second), and whether this browser's memory figure moves
    // (Chromium can round it and refresh it only every 20 minutes: then it can't tell the games apart)
    const ts = [], m = performance.memory, heap0 = m ? m.usedJSHeapSize : 0, junk = [];
    for (let i = 0; i < 60000; i++) junk.push({ i, s: "x" + i });
    (function count(t) {
      ts.push(t);
      if (ts.length < 26) return requestAnimationFrame(count);
      const gaps = ts.slice(3).map((v, i, a) => i ? v - a[i - 1] : 0).slice(1).sort((a, b) => a - b);
      GC.hz = Math.round(1000 / gaps[gaps.length >> 1]);
      GC.precise = m ? performance.memory.usedJSHeapSize !== heap0 && junk.length > 0 : null;
      GC.ticker = setInterval(badge, 500);
      next();
    })(performance.now());
  }
  function gamesStop() {
    const r = GC.results[GC.i];
    if (r && r.state !== "done" && r.state !== "didn't open") r.state = "stopped";
    for (const x of GC.results) if (x.state === "waiting") x.state = "not run";
    gamesEnd();
  }
  function gamesEnd() { GC.running = false; clear(); clearInterval(GC.ticker); badge(); table(); hint(); gamesSaid(); }
  function next() {
    clear();
    if (!GC.running) return;
    GC.i++; table();
    if (GC.i >= GC.list.length) return gamesEnd();
    const g = GC.list[GC.i], r = GC.results[GC.i], f = document.createElement("iframe");
    r.state = "opening";
    // inert: it can't take the focus, so the keys stay this page's; the address is the box's own (same origin)
    f.className = "game"; f.setAttribute("inert", ""); f.setAttribute("tabindex", "-1"); f.setAttribute("aria-hidden", "true");
    f.src = "../" + encodeURIComponent(g.id) + "/#demo";
    f.addEventListener("load", () => opened(f, r), { once: true });
    later(() => { if (f === GC.frame && r.state === "opening") { r.state = "didn't open"; next(); } }, OPEN);
    GC.frame = f; document.body.appendChild(f); badge();
  }
  function opened(f, r) {
    if (f !== GC.frame) return;
    let W = null;
    try { W = f.contentWindow; if (!W.document) throw new Error("no page"); } catch (e) { r.state = "didn't open"; return next(); }
    r.errors = 0; r.error = "";
    const slip = m => { r.errors++; if (!r.error) r.error = String(m || "error").slice(0, 120); };
    W.addEventListener("error", e => slip(e.message));
    W.addEventListener("unhandledrejection", e => slip(e.reason && e.reason.message || e.reason));
    const ce = W.console && W.console.error;
    if (ce) W.console.error = function () { slip(Array.prototype.join.call(arguments, " ")); return ce.apply(this, arguments); };
    // the controller is the check's while it runs (B stops it): the game sees none, so no press starts it or reaches a save
    try { Object.defineProperty(W.navigator, "getGamepads", { configurable: true, value: () => [] }); } catch (e) { /* it keeps it */ }
    r.state = "starting"; badge();
    const t0 = performance.now();
    (function settle() {                             // (an engine game tunes itself to the box first: SofaStats.ready)
      if (f !== GC.frame) return;
      const S = stats(W);
      if (S && S.ready === false && performance.now() - t0 < TUNE) return later(settle, 200);
      later(() => measure(f, W, r), SETTLE);
    })();
  }
  function measure(f, W, r) {
    if (f !== GC.frame) return;
    const raf = W.requestAnimationFrame.bind(W), wp = W.performance;
    // the game's own work each frame: its requestAnimationFrame callbacks, timed (each one asks again every frame)
    let at = -1, spent = 0, wsum = 0, wn = 0;
    W.requestAnimationFrame = function (cb) {
      return raf(function (ts) {
        if (ts !== at) { if (at >= 0) { wsum += spent; wn++; } at = ts; spent = 0; }
        const s = wp.now();
        try { cb(ts); } finally { spent += wp.now() - s; }
      });
    };
    let first = 0, last = 0, frames = 0, late = 0, worst = 0, heap = 0, ended = false;
    const end = performance.now() + GC.secs * 1000;
    const mem = () => { const m = wp.memory; if (m && m.usedJSHeapSize > heap) heap = m.usedJSHeapSize; };
    const memT = setInterval(mem, 1000); mem();
    r.state = "measuring"; GC.endAt = end; badge();
    function tick(ts) {                              // the frames, from the game's own window
      if (f !== GC.frame || ended) return;
      if (last) { const gap = ts - last; if (gap > 25) late++; if (gap > worst) worst = gap; } else first = ts;
      last = ts; frames++;
      if (performance.now() >= end) return done();
      raf(tick);
    }
    function done() {
      if (ended || f !== GC.frame) return;
      ended = true; clearInterval(memT);
      const S = stats(W) || {}, secs = (last - first) / 1000;
      Object.assign(r, { state: "done", secs, fps: secs > 0 ? (frames - 1) / secs : 0, late, gaps: Math.max(0, frames - 1), worst,
        script: wn ? wsum / wn : null, heap: GC.precise ? heap : null, demo: !!S.demo, tier: typeof S.tier === "string" ? S.tier : null,
        drawn: +S.fps || null, workMs: +S.workMs || null, hidden: document.hidden });
      if (!info) return later(next, 300);
      boxInfo(4000).then(j => { if (j && j.memory_free) r.free = j.memory_free; if (f === GC.frame) next(); });   // (the game still there)
    }
    raf(tick);
    later(done, GC.secs * 1000 + 4000);            // (the frames stopped coming: the page went behind something)
  }
  function badge() {
    const b = $("badge"), r = GC.running && GC.results[GC.i];
    b.classList.toggle("hidden", !r);
    if (!r) return;
    const left = Math.max(0, Math.ceil((GC.endAt - performance.now()) / 1000));
    b.textContent = "Games check · " + (GC.i + 1) + " of " + GC.list.length + " · " + r.name + " · " +
      (r.state === "measuring" ? left + " s" : r.state === "starting" ? "settling" : "opening") + " · " + (SofaPad.connected() ? SofaPad.label("b") : "Back") + " stops";
  }
  // On the box a page's console errors are kept for "Send a report" (and nothing else of the games reaches one), so
  // what the checks found is said there, a line each: the only measure there is of a real box
  function said() {
    if (!info || !probe) return;
    console.error("Graphics check: " + (board ? board + " | " : "") + L3.line(probe, bench, L3.plan(probe, bench)) + " | page " + probe.view + " at " + probe.dpr + "x");
    try { const c = document.createElement("canvas"), gl = c.getContext("webgl"); if (gl) { console.error("Graphics check: WebGL extensions: " + (gl.getSupportedExtensions() || []).join(" ").replace(/WEBGL_|EXT_|OES_/g, m => m[0]).slice(0, 250)); const l = gl.getExtension("WEBGL_lose_context"); if (l) l.loseContext(); } } catch (e) { /* none */ }
  }
  function gamesSaid() {
    if (!info) return;
    for (const r of GC.results) if (r.state === "done") console.error("Games check: " + r.name + ": " + r.fps.toFixed(1) + " fps of " + (GC.hz || 60) + ", " + r.late + " of " + r.gaps + " late, worst " + Math.round(r.worst) + " ms, script " +
      (r.script != null ? r.script.toFixed(1) : "?") + " ms" + (r.tier ? ", " + r.tier + (r.drawn ? ", " + r.drawn + " drawn" : "") : "") + (r.free ? ", " + MB(r.free) + " free" : "") + (r.errors ? ", " + r.errors + " errors" : "") + (r.demo ? "" : " (title screen)"));
      else console.error("Games check: " + r.name + ": " + r.state);
  }
  const MB = v => Math.round(v / 1048576) + " MB";
  const band = (v, good, fair, more) => (more ? v >= good : v <= good) ? "good" : (more ? v >= fair : v <= fair) ? "fair" : "poor";
  function table() {
    if (!GC.list) { $("gabout").textContent = "Finding the games…"; return; }
    const n = GC.list.length, mins = Math.max(1, Math.round(n * (GC.secs + 4) / 60)), hz = GC.hz || 60;
    $("gabout").textContent = n ? (GC.only.length ? "Each of these " : "Each of the box's ") + n + " games for " + GC.secs + " seconds, one after another (about " + mins + " minute" + (mins > 1 ? "s" : "") +
      "), opened in its demo mode: a game that can play by itself is measured playing, the others on their title screen. No game's saves are touched." : "No games found.";
    const R = GC.results.length ? GC.results : GC.list.map(g => ({ id: g.id, name: g.name, state: "waiting" }));
    const head = ["Game", "Showed", "Frames a second", "Late (over 25 ms)", "Slowest", "Script a frame", "Memory", "It chose"];
    const cell = (v, cls) => "<td" + (cls ? ' class="' + cls + '"' : "") + ">" + v + "</td>";
    const rows = R.map((r, i) => {
      if (r.state !== "done") {
        const what = { waiting: "", opening: "opening…", starting: "settling…", measuring: "measuring…", stopped: "stopped", "not run": "not run", "didn't open": "didn't open" }[r.state] || r.state;
        return "<tr" + (GC.running && i === GC.i ? ' class="at"' : "") + ">" + cell(U.esc(r.name)) + cell(U.esc(what), "dim") + cell("", "") .repeat(6) + "</tr>";
      }
      const pct = r.gaps ? r.late / r.gaps * 100 : 0;
      const showed = (r.demo ? "playing itself" : "its title screen") + (r.hidden ? " (hidden: not counted)" : "") + (r.errors ? " · " + r.errors + " error" + (r.errors > 1 ? "s" : "") : "");
      const memory = [r.heap ? "JS " + MB(r.heap) : "", r.free ? MB(r.free) + " free" : ""].filter(Boolean).join(" · ") || "–";
      const work = r.script != null ? r.script : r.workMs;
      return "<tr>" + cell(U.esc(r.name)) + cell(U.esc(showed), r.errors ? "poor" : "") +
        cell(r.fps.toFixed(1), "n " + band(r.fps, hz * 0.92, hz * 0.75, true)) +
        cell(r.late + " · " + (pct < 10 ? pct.toFixed(1) : Math.round(pct)) + "%", "n " + band(pct, 2, 10)) +
        cell(Math.round(r.worst) + " ms", "n " + band(r.worst, 34, 100)) +
        cell(work != null ? work.toFixed(1) + " ms" : "–", work != null ? "n " + band(work, 8, 14) : "n") +
        cell(memory, "n") + cell(U.esc(r.tier ? r.tier + (r.drawn ? ", " + r.drawn + " drawn a second" : "") : "–")) + "</tr>";
    });
    $("gtab").innerHTML = "<tr>" + head.map(h => "<th>" + h + "</th>").join("") + "</tr>" + rows.join("");
    const ran = R.some(r => r.state === "done"), slips = R.filter(r => r.errors).map(r => r.name + ": " + r.error);
    $("gnote").textContent = ran ? "Screen " + hz + " Hz. Frames a second and late frames are the browser's, timed in each game's own page; a game " +
      "drawing on a 30 fps rung still shows the screen's rate here, and says what it draws under \"It chose\". Script: the game's own work each frame. " +
      (GC.precise ? "JS: the page's script memory at most. " : GC.precise === false ? "JS memory isn't shown: this browser rounds it and refreshes it every 20 minutes, so it can't tell the games apart. " : "") +
      (info ? "Free: the box's memory left while the game ran. These numbers go with the next report you send (Settings, Help, Send a report). " : "") + (slips.length ? "Errors: " + slips.join(" · ") : "") : "";
  }

  // the controller (and a remote's or the phone's keys): ◀ ▶ and A on the graphics check, A and B in the games check
  function button(b, how) {
    if (view === "graphics") {
      if (b === "left" || b === "up") focusAct(act - 1);
      else if (b === "right" || b === "down") focusAct(act + 1);
      else if (how === "press" && (b === "a" || b === "start")) { if (act === 0) run(); else games(true); }
      return;
    }
    if (how !== "press") return;
    if (GC.running) { if (b === "b") gamesStop(); return; }
    if (b === "a" || b === "start") gamesRun();
    else if (b === "b") games(false);
  }
  const input = new L3.Input({
    keys: { Enter: "a", NumpadEnter: "a", " ": "a", Escape: "b", Backspace: "b", BrowserBack: "b", GoBack: "b",
            ArrowLeft: "left", ArrowRight: "right", ArrowUp: "up", ArrowDown: "down" },
    on: (b, how) => { if (how === "press" || how === "repeat") button(b, how); },
    top: () => view === "graphics" ? topAt : 0,     // (Back on the graphics check is the box's: out)
    connected: hint
  });
  window.GamesCheck = { run: gamesRun, stop: gamesStop, get running() { return GC.running; }, get results() { return GC.results; },
    get hz() { return GC.hz; }, get precise() { return GC.precise; } };
  requestAnimationFrame(frame);
  // the board's own name, from the box (only on a Sofa Box; nothing leaves the box)
  boxInfo().then(j => {
    info = j;
    if (j && j.board) board = j.board.model + " · " + Math.round((j.board.memory_mb || 0) / 1024 * 10) / 10 + " GB · " + (j.light ? "light look" : "full look");
    show(null);
  });
  fetch("../games.json").then(r => r.ok ? r.json() : null).catch(() => null).then(j => {
    const all = (j && j.games) || [];
    GC.list = GC.only.length ? all.filter(g => GC.only.includes(g.id)) : all;
    table();
    if (view === "games" && /[#&]run\b/.test(H)) gamesRun();
  });
  hint();
  if (/^#games/.test(H)) games(true); else setTimeout(run, 300);
})();
</script></body></html>
