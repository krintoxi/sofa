<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Halogen</title>
<style>

  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0d10; color: #efe6d2; font: 700 16px/1.25 ui-monospace, "DejaVu Sans Mono", "SFMono-Regular", Menlo, Consolas, monospace; }
  #view { position: absolute; overflow: hidden; background: #0b0d10; --u: 5.4px; --ink: #0b0d10; --bone: #efe6d2; --green: #39ff88; --pink: #ff2e88; }

  #fps { position: absolute; right: calc(var(--u) * 3); top: 46%; font: 600 calc(var(--u) * 2) ui-monospace, monospace; color: var(--green); text-align: right; white-space: pre; will-change: transform; }
  .screen { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: calc(var(--u) * 2); text-transform: uppercase; letter-spacing: .04em; }
  .screen > * { will-change: transform; }
  h1.logo { margin: 0; padding: 0 calc(var(--u) * 2); font-size: calc(var(--u) * 13); font-weight: 900; letter-spacing: .2em; color: var(--bone); line-height: 1;
    text-shadow: calc(var(--u) * .7) calc(var(--u) * .7) 0 var(--pink); border-bottom: calc(var(--u) * .6) solid var(--green); }
  .tag { margin: 0; padding: calc(var(--u) * .4) calc(var(--u) * 1.4); font-size: calc(var(--u) * 2.3); letter-spacing: .1em; text-align: center; max-width: calc(var(--u) * 150); background: rgba(11, 13, 16, .7); }
  h2 { margin: 0 0 calc(var(--u) * .5); padding: 0 calc(var(--u) * 1.5); font-size: calc(var(--u) * 5); font-weight: 900; letter-spacing: .1em; border-left: calc(var(--u) * 1.2) solid var(--pink); }
  .menu { display: flex; flex-direction: column; gap: calc(var(--u) * .9); min-width: calc(var(--u) * 46); }

    border: calc(var(--u) * .3) solid rgba(239, 230, 210, .22); color: inherit; text-align: center; }

<script>/* touch: a phone's or tablet's controls, drawn on the picture (pad.js, SofaPad.touch; ENGINE.md, "Touch") */

<script>
/* HALOGEN's city and rules: the land and its streets, where every building stands, the cars and how each handles,
   the races, and who drives when nobody does. A script of its own, with nothing of the screen in it, so the checks can
   build the city and race round it in node with the game's own numbers (window.HalogenRules). */
(function () {
"use strict";
const L3 = window.Low3D, U = L3.U, TAU = U.TAU, clamp = U.clamp, lerp = U.lerp, wrap = U.wrap;
const MAP = 1280, HALF = MAP / 2, CELL = 8, CHUNK = 80, SEED = 7, WATER = 0, SIDE = 4, LIFT = 0.1;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
function vnoise(seed) {
  const h = (i, j) => { let a = (Math.imul(i, 374761393) + Math.imul(j, 668265263) + Math.imul(seed, 1442695041)) | 0; a = Math.imul(a ^ (a >>> 13), 1274126177); return ((a ^ (a >>> 16)) >>> 0) / 4294967296; };

    return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v; };
}
function fbm(nz, x, z, oct) { let s = 0, a = 0.5, f = 1, t = 0; for (let k = 0; k < oct; k++) { s += nz(x * f, z * f) * a; t += a; a *= 0.5; f *= 2; } return s / t; }

// ---------------------------------------------------------------- the cars. spec: Low3D's Car (how it moves); look:
// Kit.car's recipe (how it's built). Four, each its own feel: what pulls it, how it holds, how it lets go.
const CARS = [
  { id: "kernel", name: "KERNEL", about: "Rear-driven and even-handed. It tells you before it lets go.",
    spec: { mass: 1300, len: 2.62, front: 0.52, grip: 1.12, slide: 0.84, peak: 0.14, power: 250, top: 65, gears: 5, launch: 0.92, drive: -1, loose: 0.55, brake: 1.2, hand: 0.4, turn: 0.58, turnAt: 23, quick: 7.5, assist: 0.5, calm: 1.6, wide: 1.62 },
    look: { len: 4.35, wide: 1.82, high: 1.26, hood: 0.3, deck: 0.17, belt: 0.76, nose: 0.78, tail: 0.92, roof: 0.76, wing: 0.14 } },
  { id: "packet", name: "PACKET", about: "Small, light, pulled by its front wheels. Quick to turn in and hard to upset.",
    spec: { mass: 1020, len: 2.45, front: 0.6, grip: 1.16, slide: 0.88, peak: 0.13, power: 165, top: 58, gears: 5, launch: 0.82, drive: 1, loose: 0.5, brake: 1.25, hand: 0.36, turn: 0.64, turnAt: 22, quick: 9.5, assist: 0.55, calm: 1.9, wide: 1.52 },
    look: { len: 3.85, wide: 1.72, high: 1.4, hood: 0.24, deck: 0.04, belt: 0.82, nose: 0.82, tail: 1.0, roof: 0.8, rake0: 0.25, rake1: 1.0, wheel: 0.31, base: 0.63, shift: 0.035 } },
  { id: "segfault", name: "SEGFAULT", about: "All engine. The fastest thing here in a straight line, and sideways everywhere else.",
    spec: { mass: 1640, len: 2.86, front: 0.55, grip: 1.04, slide: 0.86, peak: 0.15, power: 400, top: 74, gears: 5, launch: 0.86, drive: -1, loose: 0.9, brake: 1.08, hand: 0.44, turn: 0.54, turnAt: 24, quick: 6, assist: 0.42, calm: 1.35, wide: 1.7 },
    look: { len: 4.85, wide: 1.92, high: 1.3, hood: 0.36, deck: 0.2, belt: 0.84, nose: 0.9, tail: 0.94, roof: 0.72, rake0: 1.5, rake1: 1.0, wheel: 0.36, scoop: 1, base: 0.6 } },
  { id: "mutex", name: "MUTEX", about: "All four wheels driven. It leaves the line hardest and will not step out of it.",
    spec: { mass: 1500, len: 2.68, front: 0.56, grip: 1.2, slide: 0.8, peak: 0.13, power: 310, top: 68, gears: 6, launch: 1.0, drive: 0, loose: 0.42, brake: 1.25, hand: 0.5, turn: 0.56, turnAt: 23, quick: 7, assist: 0.6, calm: 2.1, wide: 1.66 },
    look: { len: 4.5, wide: 1.88, high: 1.36, hood: 0.28, deck: 0.14, belt: 0.82, nose: 0.84, tail: 0.96, roof: 0.78, rake0: 0.7, rake1: 1.1, wing: 0.24, wheel: 0.34 } }
];
const CAR_BY = {}; for (const c of CARS) CAR_BY[c.id] = c;
const PAINTS = [["Phosphor", 0x39ff88, 0x0b0d10], ["Hot pink", 0xff2e88, 0x0b0d10], ["Bone", 0xefe6d2, 0x1a1c22], ["Ink", 0x16181e, 0x39ff88], ["Sodium", 0xff9a2a, 0x0b0d10], ["Arc blue", 0x3aa2f2, 0xefe6d2], ["Signal red", 0xe0302a, 0x0b0d10], ["Violet", 0x8a5cf0, 0xefe6d2]];
// who else is out at night: a name, what they drive and in what colours, how well (1: as well as the line allows)
const RIVALS = [{ name: "nullptr", car: "kernel", col: 0xff2e88, trim: 0x0b0d10, skill: 1.0 }, { name: "0xBEEF", car: "segfault", col: 0xff9a2a, trim: 0x0b0d10, skill: 0.985 },
  { name: "sigkill", car: "mutex", col: 0x3aa2f2, trim: 0xefe6d2, skill: 0.97 }, { name: "tty0", car: "packet", col: 0xefe6d2, trim: 0x1a1c22, skill: 0.955 }, { name: "fork", car: "kernel", col: 0x8a5cf0, trim: 0xefe6d2, skill: 0.94 }];

// ---------------------------------------------------------------- the land, before a road is cut into it
const N1 = vnoise(SEED * 13 + 5), N2 = vnoise(SEED * 29 + 11);
const shoreOf = (x, z) => x * 0.5 + z * 0.87 - 395 + (fbm(N2, x * 0.006 + 3, z * 0.006 + 9, 2) - 0.5) * 130;   // over 0: the bay (south-east)
function terrain(x, z) {
  let h = 3.4 + (fbm(N1, x * 0.004 + 11, z * 0.004 + 7, 3) - 0.5) * 6.5;
  h += 38 * (1 - smooth(50, 390, Math.hypot(x + 335, z + 300)));        // Stack Hill, in the north-west
  h += 15 * (1 - smooth(40, 250, Math.hypot(x - 430, z + 440)));        // a lower rise in the north-east
  const s = shoreOf(x, z);
  if (s > -70) h = s < 0 ? lerp(h, 1.5, smooth(-70, -14, s)) : lerp(1.5, -3.2, smooth(0, 9, s));   // level quays, then the water
  const e = Math.max(Math.abs(x), Math.abs(z));
  if (e > 588) h += 26 * smooth(588, 640, e) * (1 - smooth(-60, 0, s));  // the rim: the ground rises beyond the last road
  return h;
}
const ZONES = ["mid", "glass", "docks", "hill"];
function zoneOf(x, z) {
  if (shoreOf(x, z) > -150) return 2;
  if (terrain(x, z) > 14 && Math.hypot(x + 335, z + 300) < 330) return 3;
  const dx = (x - 70) / 270, dz = (z + 30) / 235; if (dx * dx + dz * dz < 1) return 1;
  return 0;
}

// ---------------------------------------------------------------- the city: land, streets, every building's place
// Built whole when the game loads: a few thousand numbers. What's drawn is made a chunk at a time by the game (Stream);
// what's driven on, bumped into and raced along is all here.
const NET = { ni: 10, nj: 10, pitch: 124, warp: 27 };
function city() {
  const W = { MAP, CELL, CHUNK, water: WATER, terrain, zoneOf, shoreOf };
  const net = W.net = L3.Roads.net({ ni: NET.ni, nj: NET.nj, pitch: NET.pitch, warp: NET.warp, seed: SEED * 3 + 1,
    keep: (x, z) => shoreOf(x, z) < -34 && terrain(x, z) > 1,
    wide: (i, j, along) => { const k = along ? i : j; return k === 0 || k === 9 || k === 4 ? 8 : 6; } });
  const R = W.roads = new L3.Roads({ nodes: net.nodes, lines: net.lines, height: terrain, step: 4, ease: 0.1 });
  const land = W.land = new L3.Land(MAP, MAP / CELL, 0); land.jit = 0.03;
  land.fill(terrain); R.grade(land, { side: SIDE + 1, blend: 14 });
  const o = new Float32Array(10);
  // what a wheel stands on: the land as it's drawn, and the road's own surface where there is one
  W.ground = (x, z) => { const y = land.on(x, z); return y < WATER ? WATER : y + LIFT; };
  W.grip = (x, z) => R.near(x, z, o) && o[2] < o[7] + SIDE + 1 ? 1 : 0.62;   // (a road and its pavement; off them, loose ground)
  W.env = { ground: W.ground, grip: W.grip };
  lotsOf(W); eventsOf(W);
  W.spawn = W.events.length ? W.events[0].start : { x: 0, z: 0, yaw: 0 };
  return W;
}
// the buildings, set along both sides of every street with their fronts to it: none on a road or its pavement, none
// in another, none in the water. Each: where, how wide (along the street), how deep, how high, which way it faces,
// the ground under it. In arrays (no object each), and in squares of 32 m to find what's near a place.
const HG = 32, HW = Math.ceil(MAP / HG);
function lotsOf(W) {
  const R = W.roads, land = W.land, rnd = U.rand(SEED * 31 + 7), o = new Float32Array(10), MAXN = 4096, T5 = [0, 0, 0, 0, 0];
  const B = W.lots = { n: 0, x: new Float32Array(MAXN), z: new Float32Array(MAXN), w: new Float32Array(MAXN), d: new Float32Array(MAXN), h: new Float32Array(MAXN), yaw: new Float32Array(MAXN),
    y: new Float32Array(MAXN), foot: new Float32Array(MAXN), kind: new Uint8Array(MAXN), zone: new Uint8Array(MAXN), seed: new Uint16Array(MAXN), cells: [] };
  for (let i = 0; i < HW * HW; i++) B.cells.push([]);
  const cellAt = (x, z) => clamp(Math.floor((z + HALF) / HG), 0, HW - 1) * HW + clamp(Math.floor((x + HALF) / HG), 0, HW - 1);
  const C = new Float32Array(10);
  const corners = (x, z, yaw, w, d, grow) => { const c = Math.cos(yaw), s = Math.sin(yaw), hw = w / 2 + grow, hd = d / 2 + grow;
    for (let k = 0; k < 4; k++) { const lx = k & 1 ? hw : -hw, lz = k & 2 ? hd : -hd; C[k * 2] = x + lx * c + lz * s; C[k * 2 + 1] = z - lx * s + lz * c; } C[8] = x; C[9] = z; };
  const fits = (x, z, yaw, w, d) => {
    corners(x, z, yaw, w, d, 0);
    for (let k = 0; k < 5; k++) { const px = C[k * 2], pz = C[k * 2 + 1]; if (Math.abs(px) > 600 || Math.abs(pz) > 600 || shoreOf(px, pz) > -12) return false; if (R.near(px, pz, o) && o[2] < o[7] + SIDE) return false; }
    const r = Math.hypot(w, d) / 2, gi = Math.floor((x + HALF) / HG), gj = Math.floor((z + HALF) / HG);
    for (let j = gj - 2; j <= gj + 2; j++) for (let i = gi - 2; i <= gi + 2; i++) { if (i < 0 || j < 0 || i >= HW || j >= HW) continue;
      for (const q of B.cells[j * HW + i]) { const dx = B.x[q] - x, dz = B.z[q] - z, rr = r + Math.hypot(B.w[q], B.d[q]) / 2 + 1.2; if (dx * dx + dz * dz < rr * rr && boxes(x, z, yaw, w / 2 + 0.8, d / 2 + 0.8, B.x[q], B.z[q], B.yaw[q], B.w[q] / 2 + 0.8, B.d[q] / 2 + 0.8)) return false; } }
    return true;
  };
  const SPEC = [   // by zone: how wide, how deep, the gap to the next, how often a plot is left empty
    { w: [14, 24], d: [13, 18], gap: [1.5, 5], skip: 0.07 }, { w: [22, 32], d: [20, 26], gap: [3, 8], skip: 0.05 }, { w: [26, 40], d: [18, 26], gap: [4, 11], skip: 0.16 }, { w: [10, 16], d: [10, 13], gap: [2, 6], skip: 0.12 }];
  const span = a => a[0] + rnd() * (a[1] - a[0]);
  for (const L of R.lines) for (const sd of [1, -1]) {
    const P = L.P; let s = 5 + rnd() * 6;
    while (s < P.len - 8 && B.n < MAXN) {
      P.at(s, T5); const zone = zoneOf(T5[0], T5[1]), S = SPEC[zone]; let w = span(S.w), d = span(S.d);
      if (rnd() < S.skip) { s += w + span(S.gap); continue; }
      let placed = false;
      for (let tries = 0; tries < 3 && !placed; tries++, w *= 0.72, d *= 0.85) {
        if (s + w > P.len) break;
        P.at(s + w / 2, T5); const off = L.half + SIDE + 0.7 + d / 2, x = T5[0] + T5[3] * off * sd, z = T5[1] - T5[2] * off * sd, yaw = Math.atan2(-sd * T5[3], sd * T5[2]);
        if (!fits(x, z, yaw, w, d)) continue;

    ui.text("/" + units.length, x1 + 2 * S, y + 7 * big - 7 * mid, mid, BONE, 0.8, 0, INK); ui.rect(M, y + 7 * big + 2 * S, x1 - M + 2 * S + ui.width("/" + units.length, mid), S, PINK, 1); y += 7 * big + 6 * S;
    if (race.ev.closed) { ui.text("LAP " + lapOf(u) + "/" + race.ev.laps, M, y, mid, GREEN, 1, 0, INK); y += 7 * mid + 2 * S; }
    ui.text(time(state === "race" || state === "done" ? (u.done ? u.time : race.t) : 0), M, y, mid, BONE, 1, 0, INK); y += 7 * mid + 2 * S;
    ui.text(race.ev.name.toUpperCase(), M, y, S, BONE, 0.75, 0, INK);
    if (state === "race" && !u.done) { const g = race.ev.gates[u.passed % race.n], a = wrap(Math.atan2(g.x - c.x, g.z - c.z) - cam.yaw); if (Math.abs(a) > 0.7) ui.arrow(w / 2, M + 8 * S, 7 * S, -a, PINK, 1); }
  } else if (near >= 0 && Math.abs(c.speed) < 14) {
    const e = W.events[near], b = save.best[e.id], t1 = e.name.toUpperCase(), yy = Math.round(h * 0.62);
    ui.text(t1, w / 2, yy, 3 * S, e.closed ? GREEN : PINK, 1, 0.5, INK);
    ui.text((e.closed ? e.laps + " LAPS, " : "SPRINT, ") + (e.len * (e.closed ? e.laps : 1) / 1000).toFixed(1) + " KM, " + (e.field + 1) + " CARS" + (b ? "  BEST " + ord(b.place).toUpperCase() + " " + time(b.time) : ""), w / 2, yy + 24 * S, S, BONE, 0.9, 0.5, INK);
    ui.text(Math.abs(c.speed) < 3 ? label("a").toUpperCase() + ": RACE" : "STOP HERE TO RACE", w / 2, yy + 34 * S, 2 * S, BONE, 1, 0.5, INK);
  }
  if (sayText) {
    const cut = sayText.indexOf("<small>"), a = cut < 0 ? sayText : sayText.slice(0, cut), b = cut < 0 ? "" : sayText.slice(cut + 7).replace("</small>", "");
    const k1 = a.length > 12 ? 3 * S : 5 * S, sy = Math.round(h * 0.24);
    if (a) ui.text(a.toUpperCase(), w / 2, sy, k1, a === "Go!" ? GREEN : BONE, 1, 0.5, PINK);
    if (b) ui.text(b.toUpperCase(), w / 2, sy + 7 * k1 + 3 * S, 2 * S, BONE, 0.95, 0.5, INK);
  }
  ui.end();
}

// ---------------------------------------------------------------- the menus' content
const MEDAL = ["", "1st", "2nd", "3rd"];
function renderEvents() {
  $("eventcards").innerHTML = W.events.map((e, i) => { const b = save.best[e.id];
    return `<div class="item card" data-do="event" data-i="${i}"><span class="medal">${b && b.place <= 3 ? MEDAL[b.place] : ""}</span><span class="kind">${e.closed ? "Circuit · " + e.laps + " laps" : "Sprint"} · ${(e.len * (e.closed ? e.laps : 1) / 1000).toFixed(1)} km · ${e.field + 1} cars</span>
      <span class="nm">${e.name}</span><span class="info">${e.about}</span><span class="info">${b ? "Your best: " + ord(b.place) + " in " + time(b.time) : "Not raced yet"}</span></div>`; }).join("");
  hints();
}
function garageEnter() {
  const S = menu.o.screens.garage, ids = openCars(), names = {}, pn = {}; for (const c of HR.CARS) names[c.id] = c.name; HR.PAINTS.forEach((p, i) => pn[i] = p[0]);
  picks.car = ids.indexOf(save.car) >= 0 ? save.car : "kernel"; picks.paint = save.paint;
  S.options = [{ k: "car", name: "Car", vals: ids, names }, { k: "paint", name: "Paint", vals: HR.PAINTS.map((p, i) => i), names: pn }];
  renderGarage(); hints();
}
function garageChanged() { save.car = picks.car; save.paint = picks.paint; store(); setPlayer(); if (state === "attract") AUTO.pace = W.events[0].paceFor(PL.K.id); frozen = false; renderGarage(); }
const PREVIEWS = new Map();
function renderGarage() {
  const K = HR.CAR_BY[picks.car], p = HR.PAINTS[picks.paint], key = K.id + "|" + picks.paint, s = K.spec;
  if (!PREVIEWS.has(key)) PREVIEWS.set(key, L3.bake(carMesh(K, p[1], p[2]), { yaw: 2.45, pitch: 0.3, ppu: 46, glow: 0.2 }).c);
  const pic = $("garagepic"); pic.textContent = ""; pic.appendChild(PREVIEWS.get(key));
  const bar = (v, lo, hi) => `<div class="bar"><i style="width:${Math.round(clamp((v - lo) / (hi - lo), 0.08, 1) * 100)}%"></i></div>`;
  $("garagestats").innerHTML = `<h3>${K.name}</h3><div class="about">${K.about}</div><div class="sgrid"><span>Top speed</span>${bar(s.top, 52, 76)}<span>Pull</span>${bar(s.power / s.mass, 0.14, 0.26)}` +
    `<span>Grip</span>${bar(s.grip, 0.98, 1.22)}<span>Turn-in</span>${bar(s.quick, 5, 10)}<span>Slide</span>${bar(s.loose, 0.3, 0.95)}</div>`;
  const locked = HR.CARS.filter(c => openCars().indexOf(c.id) < 0).map(c => c.name + (c.id === "segfault" ? " (three podiums)" : " (three wins)"));
  $("garagelocked").textContent = locked.length ? "Still to win: " + locked.join(", ") : "Every car won.";
}
function optionChanged(k) {
  store();
  if (k === "music" || k === "sound") volumes();
  if (k === "picture") { clearTimeout(optionChanged.t); optionChanged.t = setTimeout(() => E.setPicture(), 700); }   // (once the choice settles: it rebuilds the world)
  if (k === "pixels") E.resize();
  frozen = false;
}
function renderBox() { $("boxtable").innerHTML = E.rows().map(r => `<tr><td>${r[0]}</td><td>${U.esc(r[1])}</td></tr>`).join(""); }
function retest() { $("boxtable").innerHTML = "<tr><td>Test</td><td>running… (about two seconds)</td></tr>"; E.retest(renderBox); }

addEventListener("pointerdown", () => synth.start());
document.addEventListener("visibilitychange", () => { if (document.hidden && (state === "race" || state === "roam")) pause(); });
// for checks (#test): the game's own parts, a way to stand anywhere, and to let time pass without drawing
if (E.test) window.HG = { get state() { return state; }, get W() { return W; }, get car() { return PL.car; }, get PL() { return PL; }, get units() { return units; }, get rivals() { return rivals; }, get race() { return race; },
  get mode() { return E.mode; }, get screen() { return menu.at; }, get stream() { return STREAM; }, get G() { return G; }, get view() { return VIEW; }, get hud() { return E.ui.n; }, get near() { return near; },
  E, HR, menu, cam, save: () => save, startRace, freeRoam, toTitle, pause, resume, backOnRoad, openCars,
  get auto() { return auto; }, set auto(v) { auto = !!v; if (auto && race) { AUTO.P = race.ev.P; AUTO.pace = race.ev.paceFor(PL.K.id); AUTO.st.i = PL.unit.i; } },
  goto(x, z, yaw) { place(x, z, yaw || 0); updateCam(1 / 60, 0); },
  go() { if (state === "countdown") { state = "race"; race.t = 0; say(""); } },
  quiet() { say(""); hudAt = 0; },
  press(b) { onButton(b, "press"); },
  // at junction i j of the street net, `out` metres towards its neighbour (di, dj), facing that way
  stand(i, j, di, dj, out) { const a = R.nodes[W.net.id(i, j)], b = R.nodes[W.net.id(i + di, j + dj)], l = Math.hypot(b.x - a.x, b.z - a.z), k = (out || 0) / l; place(a.x + (b.x - a.x) * k, a.z + (b.z - a.z) * k, Math.atan2(b.x - a.x, b.z - a.z)); updateCam(1 / 60, 0); },
  slide() { const c = PL.car; c.vx = Math.sin(c.yaw) * 24; c.vz = Math.cos(c.yaw) * 24; for (let n = 0; n < 70; n++) { PL.ctl.steer = 1; PL.ctl.hand = n < 40; PL.ctl.gas = n < 40 ? 0 : 1; PL.ctl.brake = 0; stepPlayer(1 / 60); } camSnap = false; for (let n = 0; n < 30; n++) updateCam(1 / 60, 0); held = true; },
  set held(v) { held = !!v; },
  sim(secs) { for (let n = Math.round(secs * 60); n > 0; n--) update(1 / 60); camSnap = true; },
  finish() { if (!race) return; const u = PL.unit; if (state === "countdown") state = "race"; u.passed = race.need; u.done = true; u.time = race.t || 60; finished(); } };
E.start();
})();
