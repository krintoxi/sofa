<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>WYRD</title>
<style>

  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0d10; color: #efe6d2; font: 700 16px/1.25 ui-monospace, "DejaVu Sans Mono", "SFMono-Regular", Menlo, Consolas, monospace; }
  #view { position: absolute; overflow: hidden; background: #0b0d10; --u: 5.4px; --ink: #0b0d10; --bone: #efe6d2; --green: #39ff88; --pink: #ff2e88; }
  #view canvas.world { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block; }
  .hidden { display: none !important; }
  #fps { position: absolute; right: calc(var(--u) * 3); top: 46%; font: 600 calc(var(--u) * 2) ui-monospace, monospace; color: var(--green); text-align: right; white-space: pre; will-change: transform; }
  .screen { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: calc(var(--u) * 1.6); text-transform: uppercase; letter-spacing: .04em; }
  .screen > * { will-change: transform; }
  h1.logo { margin: 0; padding: 0 calc(var(--u) * 2); font-size: calc(var(--u) * 15); font-weight: 900; letter-spacing: .3em; color: var(--bone); line-height: 1;
    text-shadow: calc(var(--u) * .7) calc(var(--u) * .7) 0 var(--pink); border-bottom: calc(var(--u) * .6) solid var(--green); }
  .tag { margin: 0; padding: calc(var(--u) * .4) calc(var(--u) * 1.4); font-size: calc(var(--u) * 2.2); letter-spacing: .1em; text-align: center; max-width: calc(var(--u) * 150); background: rgba(11, 13, 16, .74); }
  .tag.plain { text-transform: none; letter-spacing: 0; font-weight: 600; line-height: 1.45; }
  h2 { margin: 0 0 calc(var(--u) * .4); padding: 0 calc(var(--u) * 1.5); font-size: calc(var(--u) * 4.4); font-weight: 900; letter-spacing: .1em; border-left: calc(var(--u) * 1.2) solid var(--pink); background: rgba(11, 13, 16, .7); }
  .menu { display: flex; flex-direction: column; gap: calc(var(--u) * .8); min-width: calc(var(--u) * 50); }
  .item { box-sizing: border-box; padding: calc(var(--u) * 1) calc(var(--u) * 2.6); font-size: calc(var(--u) * 2.6); background: rgba(11, 13, 16, .84);
    border: calc(var(--u) * .3) solid rgba(239, 230, 210, .22); color: inherit; text-align: center; }
  .item.on { background: var(--green); color: var(--ink); border-color: var(--bone); box-shadow: calc(var(--u) * .7) calc(var(--u) * .7) 0 var(--pink); }
  .item.row { display: flex; justify-content: space-between; gap: calc(var(--u) * 4); text-align: left; min-width: calc(var(--u) * 84); }
  .item.row b { font-weight: 800; }
  .item.off { opacity: .45; }
  .item .cost { font-size: .78em; opacity: .85; font-weight: 600; text-transform: none; letter-spacing: 0; }
  .item.on .cost { opacity: 1; }
  .hint { position: absolute; bottom: calc(var(--u) * 2.6); left: 50%; transform: translateX(-50%); margin: 0; padding: calc(var(--u) * .5) calc(var(--u) * 1.6); white-space: nowrap; font-size: calc(var(--u) * 2); background: rgba(11, 13, 16, .78); }
  .hint kbd { display: inline-block; min-width: 1.4em; padding: 0 .4em; background: var(--bone); color: var(--ink); font: inherit; font-weight: 900; text-align: center; }
  .cards { display: grid; grid-template-columns: repeat(3, calc(var(--u) * 46)); gap: calc(var(--u) * 1.6); }
  .card { padding: calc(var(--u) * 1.3) calc(var(--u) * 1.6); text-align: left; min-height: calc(var(--u) * 16); text-transform: none; letter-spacing: 0; }
  .card .nm { font-size: calc(var(--u) * 2.6); font-weight: 900; display: block; text-transform: uppercase; letter-spacing: .05em; }
  .card .info { font-size: calc(var(--u) * 1.8); opacity: .88; display: block; margin-top: calc(var(--u) * .5); font-weight: 600; }
  /* the bag: items in a grid, what's worn beside it, the chosen one described below */
  .bagwrap { display: flex; gap: calc(var(--u) * 2.4); align-items: flex-start; }
  .grid { display: grid; grid-template-columns: repeat(6, calc(var(--u) * 13)); gap: calc(var(--u) * .7); }
  .slot { box-sizing: border-box; height: calc(var(--u) * 9.6); padding: calc(var(--u) * .5) calc(var(--u) * .6); font-size: calc(var(--u) * 1.6); line-height: 1.15; text-transform: none; letter-spacing: 0;
    background: rgba(11, 13, 16, .86); border: calc(var(--u) * .3) solid rgba(239, 230, 210, .18); overflow: hidden; position: relative; }
  .slot .k { display: block; font-size: .8em; opacity: .7; text-transform: uppercase; }
  .slot .up { position: absolute; right: calc(var(--u) * .5); top: calc(var(--u) * .3); color: var(--green); font-weight: 900; }
  .slot.empty { opacity: .35; }
  .slot.on { border-color: var(--bone); box-shadow: calc(var(--u) * .5) calc(var(--u) * .5) 0 var(--pink); background: rgba(57, 255, 136, .16); }
  .worn { display: flex; flex-direction: column; gap: calc(var(--u) * .6); width: calc(var(--u) * 46); }
  .worn .slot { height: auto; min-height: calc(var(--u) * 5.4); }
  .about { box-sizing: border-box; width: calc(var(--u) * 132); min-height: calc(var(--u) * 15); padding: calc(var(--u) * 1) calc(var(--u) * 1.6); font-size: calc(var(--u) * 1.9); text-transform: none; letter-spacing: 0; line-height: 1.4; background: rgba(11, 13, 16, .88); border-left: calc(var(--u) * .8) solid var(--green); }
  .about b.nm { font-size: 1.2em; text-transform: uppercase; letter-spacing: .04em; }
  .about .better { color: var(--green); } .about .worse { color: var(--pink); }
  .stats { display: grid; grid-template-columns: auto auto; gap: calc(var(--u) * .2) calc(var(--u) * 2); font-size: calc(var(--u) * 1.8); text-transform: none; letter-spacing: 0; padding: calc(var(--u) * 1) calc(var(--u) * 1.4); background: rgba(11, 13, 16, .86); }
  .stats b { color: var(--green); text-align: right; }
  table.box { border-collapse: collapse; font-size: calc(var(--u) * 2.1); max-width: calc(var(--u) * 156); text-transform: none; letter-spacing: 0; background: rgba(11, 13, 16, .86); }
  table.box td { padding: calc(var(--u) * .35) calc(var(--u) * 1.6); vertical-align: top; }
  table.box td:first-child { color: var(--green); white-space: nowrap; text-align: right; text-transform: uppercase; }
  table.box td:last-child { font-weight: 700; word-break: break-word; }
  .story { max-width: calc(var(--u) * 120); font-size: calc(var(--u) * 2.4); line-height: 1.55; text-transform: none; letter-spacing: 0; text-align: center; padding: calc(var(--u) * 1.4) calc(var(--u) * 3); background: rgba(11, 13, 16, .82); }
  .row-buttons { display: flex; gap: calc(var(--u) * 2); }

  #shop .item, #way .item { padding: calc(var(--u) * .7) calc(var(--u) * 2.2); font-size: calc(var(--u) * 2.2); }
  /* the skills: a row each, how far through its level as a bar */
  #skills .item { padding: calc(var(--u) * .9) calc(var(--u) * 2.2); font-size: calc(var(--u) * 2.4); min-width: calc(var(--u) * 132); align-items: center; }
  #skills .dot { display: inline-block; width: calc(var(--u) * 1.6); height: calc(var(--u) * 1.6); margin-right: calc(var(--u) * 1.4); }
  #skills .xp { display: block; width: calc(var(--u) * 56); height: calc(var(--u) * 1.6); background: rgba(239, 230, 210, .16); }
  #skills .xp i { display: block; height: 100%; }
  #skills .item.on .xp { background: rgba(11, 13, 16, .3); }
  #create { align-items: flex-start; padding-left: calc(var(--u) * 9); }
  #create .menu { min-width: calc(var(--u) * 72); }
  #create .tag { text-align: left; max-width: calc(var(--u) * 72); }
  #loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: calc(var(--u) * 3); background: #0b0d10; text-transform: uppercase; letter-spacing: .1em; }
  #loading.see { background: none; }
  #loading .bar { width: calc(var(--u) * 50); height: calc(var(--u) * 1.2); background: rgba(239, 230, 210, .15); overflow: hidden; }
  #loading .bar i { display: block; height: 100%; width: 0; background: var(--green); }
  #loading p { margin: 0; font-size: calc(var(--u) * 2.2); opacity: .85; }

<div id="view">

  <canvas id="flat" class="world hidden"></canvas>
  <div id="title" class="screen hidden">
    <h1 class="logo">WYRD</h1><p class="tag">Endless descent. Hold the thread.</p>
    <div class="menu" id="titlemenu"></div>
    <p class="hint" id="titleHint"></p>
  </div>
  <div id="slots" class="screen solid hidden"><h2>Your delvers</h2><p class="tag">Three can go down the Maw. Each keeps their own gear and depth.</p>
    <div class="cards" id="slotcards"></div><p class="hint" id="slotsHint"></p></div>
  <div id="create" class="screen solid hidden"><h2>A new delver</h2><p class="tag plain" id="createAbout"></p>
    <div class="menu" id="createlist"></div><p class="hint" id="createHint"></p></div>
  <div id="bag" class="screen solid hidden"><h2 id="bagTitle">The bag</h2>
    <div class="bagwrap"><div class="grid" id="baggrid"></div><div class="worn" id="worn"></div><div class="stats" id="herostats"></div></div>
    <div class="about" id="bagabout"></div><p class="hint" id="bagHint"></p></div>
  <div id="shop" class="screen solid hidden"><h2 id="shopTitle"></h2><p class="tag plain" id="shopAbout"></p>
    <div class="menu" id="shoplist"></div><p class="tag" id="shopHave"></p><p class="hint" id="shopHint"></p></div>
  <div id="way" class="screen solid hidden"><h2>The waystone</h2><p class="tag plain" id="wayAbout"></p>
    <div class="menu" id="waylist"></div><p class="hint" id="wayHint"></p></div>
  <div id="skills" class="screen solid hidden"><h2>Skills</h2>
    <div class="menu" id="skilllist"></div><div class="about" id="skillabout"></div><p class="hint" id="skillsHint"></p></div>
  <div id="options" class="screen solid hidden"><h2>Options</h2><div class="menu" id="optlist"></div><p class="hint" id="optionsHint"></p></div>
  <div id="box" class="screen solid hidden"><h2>This box</h2><table class="box" id="boxtable"></table>
    <div class="row-buttons"><div class="item" data-do="retest">Test again</div><div class="item" data-do="check">Games check</div><div class="item" data-do="back">Back</div></div><p class="hint" id="boxHint"></p></div>
  <div id="pause" class="screen hidden"><h2>Paused</h2><div class="menu" id="pausemenu"></div><p class="hint" id="pauseHint"></p></div>
  <div id="fallen" class="screen hidden"><h2>Fallen</h2><p class="story" id="fallenText"></p>
    <div class="row-buttons"><div class="item" data-do="rise">Wake in Hearthrim</div></div><p class="hint" id="fallenHint"></p></div>
  <div id="ending" class="screen solid hidden"><h2 id="endTitle">The thread holds</h2><p class="story" id="endText"></p>
    <div class="row-buttons"><div class="item" data-do="endnext">Go on</div></div><p class="hint" id="endHint"></p></div>
  <div id="loading"><h1 class="logo">WYRD</h1><div class="bar"><i id="loadbar"></i></div><p id="loadtext">Lighting the lamps…</p></div>
  <div id="fps" class="hidden"></div>
</div>

<script>
/* WYRD's skilling rules, on their own: numbers and plain functions, no drawing and no page. The game below reads them,
   and the box's checks play them in node (tests/test_box_games.py), so what a level costs and what it opens is said in
   one place. Five skills, each to 75: Mining and Woodcutting gather; Smithing and Firemaking use up what they gathered;
   Summoning grows with the creatures bound to you. */
(function (root) {
"use strict";
const MAX = 75;
const SKILLS = ["mine", "smith", "wood", "fire", "summon"];
const SKILL = {
  mine: { name: "Mining", col: 0x4ae8ff, about: "Ore from the rock. Better ore opens as you learn, and a better pick is quicker." },
  smith: { name: "Smithing", col: 0xff4a3a, about: "Ore into bars at a furnace, bars into gear, picks, hatchets and saddles at the anvil." },
  wood: { name: "Woodcutting", col: 0x39ff88, about: "Logs from the trees. Better wood opens as you learn, and a better hatchet is quicker." },
  fire: { name: "Firemaking", col: 0xff2e88, about: "Logs into fires. A fire mends you, leaves embers for the furnace, and does more as you learn." },
  summon: { name: "Summoning", col: 0xb06cff, about: "Creatures bound to you at a kinstone: some carry, some gather, some you ride." }
};
// from level L to L + 1. The whole road to 75 is TOTAL[75], just under 300,000.
const need = L => Math.round(40 + 12 * L + 1.9 * L * L);
const TOTAL = [0, 0]; for (let L = 1; L < MAX; L++) TOTAL[L + 1] = TOTAL[L] + need(L);   // (TOTAL[L]: where level L starts)
function levelOf(xp) { let L = 1; while (L < MAX && TOTAL[L + 1] <= xp) L++; return L; }
const into = xp => { const L = levelOf(xp); return L >= MAX ? 1 : (xp - TOTAL[L]) / need(L); };   // how far through its level, 0 to 1
// six kinds of ore and of tree, each opened by a level; what one of them is worth
const TIER_LVL = [1, 12, 24, 38, 52, 65];
const ORES = ["copper", "iron", "silver", "cobalt", "starsteel", "ashsteel"];
const TREES = ["fir", "birch", "rowan", "blackthorn", "ironbark", "wyrdwood"];
const GATHER_XP = [10, 18, 30, 46, 68, 96];
const SMELT_XP = GATHER_XP.map(x => Math.round(x * 0.6)), FORGE_XP = GATHER_XP.map(x => Math.round(x * 0.6)), BURN_XP = GATHER_XP.map(x => Math.round(x * 1.15));
const tierFor = L => { let t = 0; for (let i = 0; i < 6; i++) if (L >= TIER_LVL[i]) t = i; return t; };
// a swing at a rock or a tree: how long it takes with a tool of that tier, and how likely it is to come away with one
const swing = tool => 1.2 * (1 - 0.07 * Math.min(5, tool || 0));
const chance = (level, tier) => Math.max(0, Math.min(0.95, 0.55 + (level - TIER_LVL[tier]) * 0.01));
const NODE = { ore: { holds: 4, back: 30 }, tree: { holds: 5, back: 40 } };   // what a rock or a tree gives before it's spent, and how long till it's back (s)
const PACK = 40;                                     // ore, bars and logs carried before a trip home
const EMBER_BARS = 5;                                // bars one ember fires the furnace for (silver and better need the heat)
const HEAT_TIER = 2;
// what a fire does, by level
const FIRE = [
  { lvl: 1, name: "Warmth", about: "A fire mends you while you stand by it, and leaves an ember for every log." },
  { lvl: 15, name: "Torch", about: "You carry a brand from your fires: you see farther in caves." },
  { lvl: 30, name: "Braziers", about: "Cold braziers take your flame: the Hollow's inner doors open to it." },
  { lvl: 45, name: "Hearthglow", about: "A fire you've stood by leaves you warm: a tenth more from every skill for ten minutes." },
  { lvl: 60, name: "Long burning", about: "Your fires burn twice as long." }
];
const fireCan = (level, name) => FIRE.some(f => f.name === name && level >= f.lvl);
// what the anvil makes beyond gear: a pick and a hatchet of each metal (three bars and a log for the haft)
const TOOL = { bars: 3, logs: 1 };
// the creatures: pets are found while skilling (their trade says which skill finds them) once Summoning is high enough,
// mounts answer a saddle made at the anvil. bond: what binding one is worth to Summoning. One pet walks with you and
// gives its help; a mount is ridden.
const KIN = [
  { id: "glowbat", name: "Glowbat", kind: "pet", lvl: 1, bond: 500, found: "mine", model: "bat", size: 0.6, fly: 1.5, help: "light", about: "Lights the dark, and coin and finds come to you from twice as far." },
