# The Sofa box's keys while a video plays (the TV remote over HDMI, a game controller and the front
# panel all arrive as these keys). OK and Back go to the box agent: OK skips the intro when it's on.
ENTER        run "/usr/bin/curl" "-s" "-o" "/dev/null" "http://127.0.0.1:8091/box/native/key?k=ok"
KP_ENTER     run "/usr/bin/curl" "-s" "-o" "/dev/null" "http://127.0.0.1:8091/box/native/key?k=ok"
ESC          run "/usr/bin/curl" "-s" "-o" "/dev/null" "http://127.0.0.1:8091/box/native/key?k=back"
BS           run "/usr/bin/curl" "-s" "-o" "/dev/null" "http://127.0.0.1:8091/box/native/key?k=back"
GO_BACK      run "/usr/bin/curl" "-s" "-o" "/dev/null" "http://127.0.0.1:8091/box/native/key?k=back"
STOP         run "/usr/bin/curl" "-s" "-o" "/dev/null" "http://127.0.0.1:8091/box/native/key?k=back"
HOMEPAGE     run "/usr/bin/curl" "-s" "-o" "/dev/null" "http://127.0.0.1:8091/box/native/key?k=home"
F1           run "/usr/bin/curl" "-s" "-o" "/dev/null" "http://127.0.0.1:8091/box/native/key?k=home"
q            run "/usr/bin/curl" "-s" "-o" "/dev/null" "http://127.0.0.1:8091/box/native/key?k=back"
SPACE        cycle pause
PLAYPAUSE    cycle pause
PLAY         set pause no
PAUSE        set pause yes
LEFT         seek -10
RIGHT        seek 30
REWIND       seek -10
FORWARD      seek 30
UP           show-progress
DOWN         show-progress
PGUP         seek 300
PGDWN        seek -300
s            cycle sub
a            cycle audio
1            seek 10 absolute-percent
2            seek 20 absolute-percent
3            seek 30 absolute-percent
4            seek 40 absolute-percent
5            seek 50 absolute-percent
6            seek 60 absolute-percent
7            seek 70 absolute-percent
8            seek 80 absolute-percent
9            seek 90 absolute-percent
0            seek 0 absolute-percent
/            cycle sub
