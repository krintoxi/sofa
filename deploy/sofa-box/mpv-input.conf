# The Sofa box's keys while a video plays (the TV remote over HDMI, a game controller, the phone remote and the
# front panel all arrive as these keys). The box's player screen (sofa-player.lua, inside mpv) answers OK, the
# arrows and Back itself, at once: OK pauses or skips the intro, left and right skip (presses add up), up and down
# show where it is, Back stops, the numbers go 10%, 20%... in (the screen too: a video Sofa converts goes there
# as well, further than it has converted). Home and Menu go to the box agent.
ENTER        script-binding sofa_player/ok
KP_ENTER     script-binding sofa_player/ok
ESC          script-binding sofa_player/back
BS           script-binding sofa_player/back
GO_BACK      script-binding sofa_player/back
STOP         script-binding sofa_player/back
q            script-binding sofa_player/back
HOMEPAGE     run "/usr/bin/curl" "-s" "-o" "/dev/null" "-X" "POST" "-H" "X-Sofa-Box: 1" "http://127.0.0.1:8091/box/native/key?k=home"
F1           run "/usr/bin/curl" "-s" "-o" "/dev/null" "-X" "POST" "-H" "X-Sofa-Box: 1" "http://127.0.0.1:8091/box/native/key?k=home"
F2           run "/usr/bin/curl" "-s" "-o" "/dev/null" "-X" "POST" "-H" "X-Sofa-Box: 1" "http://127.0.0.1:8091/box/native/key?k=menu"
MENU         run "/usr/bin/curl" "-s" "-o" "/dev/null" "-X" "POST" "-H" "X-Sofa-Box: 1" "http://127.0.0.1:8091/box/native/key?k=menu"
SPACE        script-binding sofa_player/toggle
PLAYPAUSE    script-binding sofa_player/toggle
PLAY         set pause no
PAUSE        set pause yes
LEFT         script-binding sofa_player/back10
RIGHT        script-binding sofa_player/on30
REWIND       script-binding sofa_player/back10
FORWARD      script-binding sofa_player/on30
UP           script-binding sofa_player/show
DOWN         script-binding sofa_player/show
PGUP         script-binding sofa_player/on300
PGDWN        script-binding sofa_player/back300
s            cycle sub
a            cycle audio
1            script-message-to sofa_player percent 10
2            script-message-to sofa_player percent 20
3            script-message-to sofa_player percent 30
4            script-message-to sofa_player percent 40
5            script-message-to sofa_player percent 50
6            script-message-to sofa_player percent 60
7            script-message-to sofa_player percent 70
8            script-message-to sofa_player percent 80
9            script-message-to sofa_player percent 90
0            script-message-to sofa_player percent 0
/            cycle sub
