<!doctype html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

<meta name="author" content="EdgeVenture.uk">
<title>Sofa</title>
<link rel="preload" href="/client/vendor/fonts/instrument-sans-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>

</head>
<body>
<div id="splash" aria-hidden="true">
  <div class="splash-glow"></div>
  <svg class="splash-mark" viewBox="0 0 30 22"><use href="#i-sofa"/></svg>
  <div class="splash-word"><span>S</span><span>o</span><span>f</span><span>a</span></div>
  <div class="splash-bar"><i></i></div>

</div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">

  <symbol id="i-back" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M15 5l-7 7 7 7"/></symbol>

  <symbol id="i-fwd" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M20 12a8 8 0 1 1-2.4-5.7M20 4v4h-4"/><text x="12" y="15.5" font-size="7" font-weight="700" text-anchor="middle" fill="currentColor" font-family="sans-serif">30</text></symbol>
  <symbol id="i-skip" viewBox="0 0 24 24"><path fill="currentColor" d="M6 6.2v11.6a.8.8 0 0 0 1.2.7l8.6-5.8a.8.8 0 0 0 0-1.4L7.2 5.5a.8.8 0 0 0-1.2.7zM16.5 5.5h2v13h-2z"/></symbol>
  <symbol id="i-vol" viewBox="0 0 24 24"><path fill="currentColor" d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></symbol>
  <symbol id="i-mute" viewBox="0 0 24 24"><path fill="currentColor" d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" d="M16 9.5l5 5M21 9.5l-5 5"/></symbol>

  <symbol id="i-unfull" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></symbol>
  <symbol id="i-glow" viewBox="0 0 24 24"><rect x="5" y="7" width="14" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" d="M2.5 9v6M21.5 9v6M8 3.5h8M8 20.5h8"/></symbol>
  <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path stroke="currentColor" stroke-width="2.4" stroke-linecap="round" d="M12 11v6"/><circle cx="12" cy="7.6" r="1.4" fill="currentColor"/></symbol>
  <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="2" fill="currentColor"/><circle cx="12" cy="12" r="2" fill="currentColor"/><circle cx="19" cy="12" r="2" fill="currentColor"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></symbol>
  <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2.5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="9" cy="10" r="1.8" fill="currentColor"/><path fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" d="M4 17l5-4 4 3 3-2 4 3"/></symbol>
  <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="10.5" width="14" height="10" rx="2.5" fill="currentColor"/><path fill="none" stroke="currentColor" stroke-width="2.2" d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M16 16l4 4"/></symbol>
  <symbol id="i-sofa" viewBox="0 0 30 22"><path fill="currentColor" d="M5 4.5A4.5 4.5 0 0 1 9.5 0h11A4.5 4.5 0 0 1 25 4.5V8a4 4 0 0 0-4 4v1H9v-1a4 4 0 0 0-4-4z"/><path fill="currentColor" d="M0 12a3 3 0 0 1 6 0v3h18v-3a3 3 0 0 1 6 0v6a2 2 0 0 1-2 2h-1v2h-3v-2H7v2H4v-2H3a3 3 0 0 1-3-3z"/></symbol>
  <symbol id="i-cc" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" d="M10.5 10.2a2.3 2.3 0 1 0 0 3.6M17 10.2a2.3 2.3 0 1 0 0 3.6"/></symbol>
  <symbol id="i-prev" viewBox="0 0 24 24"><path fill="currentColor" d="M18 6.2v11.6a.8.8 0 0 1-1.2.7l-8.6-5.8a.8.8 0 0 1 0-1.4l8.6-5.8a.8.8 0 0 1 1.2.7zM5.5 5.5h2v13h-2z"/></symbol>
  <symbol id="i-shuffle" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M3 7h3.5c2 0 3.2 1 4.3 2.7l2.4 3.6C14.3 15 15.5 17 17.5 17H21M3 17h3.5c1.4 0 2.4-.6 3.3-1.6M14.2 8.6C15 7.6 16 7 17.5 7H21M18.5 4.5 21 7l-2.5 2.5M18.5 14.5 21 17l-2.5 2.5"/></symbol>
  <symbol id="i-repeat" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M4 11V9a3 3 0 0 1 3-3h12M16 3l3 3-3 3M20 13v2a3 3 0 0 1-3 3H5M8 21l-3-3 3-3"/></symbol>
  <symbol id="i-queue" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" d="M4 6h12M4 11h12M4 16h7M15 15.5v5l4-2.5z"/></symbol>
  <symbol id="i-pip" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="12" y="11.5" width="7" height="5.5" rx="1.2" fill="currentColor"/></symbol>
  <symbol id="i-list" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" d="M9 6.5h11M9 12h11M9 17.5h11"/><circle cx="4.8" cy="6.5" r="1.3" fill="currentColor"/><circle cx="4.8" cy="12" r="1.3" fill="currentColor"/><circle cx="4.8" cy="17.5" r="1.3" fill="currentColor"/></symbol>
  <symbol id="i-keys" viewBox="0 0 24 24"><rect x="2.5" y="6" width="19" height="12" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.7"/><path stroke="currentColor" stroke-width="1.7" stroke-linecap="round" d="M6 10h.01M9.3 10h.01M12.6 10h.01M15.9 10h.01M18 10h.01M8 14h8"/></symbol>
  <symbol id="i-gear" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" d="M12 8.6a3.4 3.4 0 1 0 0 6.8 3.4 3.4 0 0 0 0-6.8zM19.4 13.5l1.6 1.2-1.8 3.1-1.9-.7a7.6 7.6 0 0 1-2 1.2l-.3 2h-3.6l-.3-2a7.6 7.6 0 0 1-2-1.2l-1.9.7L3 14.7l1.6-1.2a7.7 7.7 0 0 1 0-3L3 9.3l1.8-3.1 1.9.7a7.6 7.6 0 0 1 2-1.2l.3-2h3.6l.3 2a7.6 7.6 0 0 1 2 1.2l1.9-.7L21 9.3l-1.6 1.2a7.7 7.7 0 0 1 0 3z"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></symbol>
  <symbol id="i-cast" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M3 8V6.5A1.5 1.5 0 0 1 4.5 5h15A1.5 1.5 0 0 1 21 6.5v11a1.5 1.5 0 0 1-1.5 1.5H14M3 12a7 7 0 0 1 7 7M3 15.5A3.5 3.5 0 0 1 6.5 19"/><circle cx="3.6" cy="18.6" r="1.1" fill="currentColor"/></symbol>
  <symbol id="i-stop" viewBox="0 0 24 24"><rect x="6.5" y="6.5" width="11" height="11" rx="2" fill="currentColor"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></symbol>
</svg>

<div class="glow" aria-hidden="true"><img id="glowA" alt=""><img id="glowB" alt=""></div>
<div class="notice" id="notice" hidden></div>
<header class="bar" id="bar">
  <a class="brand" href="#/"><svg><use href="#i-sofa"/></svg><span id="brandName">Sofa</span></a>
  <nav class="nav" aria-label="Library" id="nav" hidden>
    <a href="#/" data-nav="home">Home</a>
    <a href="#/shows" data-nav="shows">Shows</a>
    <a href="#/movies" data-nav="movies">Movies</a>
    <a href="#/mylist" data-nav="mylist">My List</a>
    <a href="#/music" data-nav="music">Music</a>
    <a href="#/live" data-nav="live">Live TV</a>
    <a href="#/adult" data-nav="adult" id="navAdult" hidden>Adult</a>
    <a href="#/server" data-nav="server" id="navServer" hidden>Server</a>
  </nav>
  <a class="search-btn" id="searchBtn" href="#/search" aria-label="Search" hidden><svg><use href="#i-search"/></svg></a>
  <label class="search" id="searchBox" hidden>
    <svg><use href="#i-search"/></svg>
    <input id="q" type="search" placeholder="Search shows and movies" aria-label="Search shows, movies and episodes" autocomplete="off">
  </label>
  <button class="cast-btn" id="castBtn" type="button" aria-label="Play on another screen" title="Play on another screen" hidden><svg><use href="#i-cast"/></svg></button>
  <div class="who" id="who" hidden><button class="who-btn" id="whoBtn" type="button" aria-label="Who's watching? Switch profile"><span class="av" id="whoAv"></span><span class="name" id="whoName"></span></button><button class="link-btn" id="lookBtn" type="button" aria-label="Look and feel">Theme</button><button class="link-btn" id="signOut" type="button">Sign out</button></div>
</header>
<main id="view"></main>
<footer id="foot"></footer>

<div class="player" id="player" hidden role="dialog" aria-label="Video player">
  <canvas width="32" height="18"></canvas>
  <video preload="metadata" playsinline></video>
  <div class="p-top">
    <button class="ibtn" data-act="close" aria-label="Back to library"><svg><use href="#i-back"/></svg></button>
    <div class="p-names"><div class="p-show"></div><div class="p-title"></div></div>
    <span class="spacer"></span>
    <button class="ibtn" data-act="help" aria-label="Keyboard shortcuts" title="Keyboard shortcuts (?)"><svg><use href="#i-keys"/></svg></button>
  </div>
  <div class="p-spinner" hidden><i></i><span class="p-spin-text"></span><span class="p-spin-hint"></span></div>
  <div class="p-seekhint" aria-hidden="true"></div>
  <div class="p-pause-info" hidden></div>
  <div class="p-eps" hidden role="dialog" aria-label="Episodes"></div>
  <div class="p-help" hidden role="dialog" aria-label="Keyboard shortcuts"></div>
  <button class="p-skip" hidden data-act="skip"></button>
  <div class="p-opts" hidden role="menu" aria-label="Player options"></div>
  <div class="p-still" hidden role="dialog" aria-label="Are you still watching?"><h2>Are you still watching?</h2>
    <div class="actions"><button class="btn primary" data-act="still-yes">Continue watching</button><button class="btn" data-act="close">Back to browse</button></div></div>
  <div class="p-flash"><svg><use href="#i-play"/></svg></div>
  <div class="p-chip" hidden><span></span><button data-act="restart">Start over</button></div>
  <div class="p-next" hidden>
    <div class="frame"></div>
    <div class="label"></div>
    <div class="name"></div>
    <div class="row2"><button class="btn primary" data-act="next">Play now</button><button class="btn" data-act="cancel-next">Hide</button></div>
  </div>
  <div class="cc-menu" role="menu" aria-label="Audio and subtitles" hidden></div>
  <div class="p-error" hidden></div>
  <div class="p-bottom">
    <div class="scrub" tabindex="0" role="slider" aria-label="Seek" aria-valuemin="0">
      <div class="track"><div class="buf"></div><div class="fill"></div></div>
      <div class="knob"></div><div class="hover-time"><span class="p-thumb" hidden></span><span class="ht-label"></span></div>
    </div>
    <div class="p-row">
      <button class="ibtn big" data-act="toggle" aria-label="Play"><svg><use href="#i-play"/></svg></button>
      <button class="ibtn" data-act="rew" aria-label="Back 10 seconds"><svg><use href="#i-rew"/></svg></button>
      <button class="ibtn" data-act="fwd" aria-label="Forward 30 seconds"><svg><use href="#i-fwd"/></svg></button>
      <div class="vol">
        <button class="ibtn" data-act="mute" aria-label="Mute"><svg><use href="#i-vol"/></svg></button>
        <input type="range" min="0" max="1" step="0.05" value="1" aria-label="Volume">
      </div>
      <span class="p-time">0:00 / 0:00</span><span class="p-ends"></span><span class="p-mode" hidden></span>
      <span class="spacer"></span>
      <button class="ibtn" data-act="eps" aria-label="Episodes" title="Episodes (E)" hidden><svg><use href="#i-list"/></svg></button>
      <button class="ibtn" data-act="cc" aria-label="Audio and subtitles" title="Audio and subtitles (C)" aria-pressed="false" hidden><svg><use href="#i-cc"/></svg></button>
      <button class="speed" data-act="speed" aria-label="Playback speed">1×</button>
      <button class="ibtn" data-act="opts" aria-label="Options" title="Options"><svg><use href="#i-gear"/></svg></button>
      <button class="ibtn" data-act="next" aria-label="Next episode"><svg><use href="#i-skip"/></svg></button>
      <button class="ibtn" data-act="pip" aria-label="Picture in picture" title="Picture in picture (P)" hidden><svg><use href="#i-pip"/></svg></button>
      <button class="ibtn" data-act="ambient" aria-label="Glow around the picture" aria-pressed="true"><svg><use href="#i-glow"/></svg></button>
      <button class="ibtn" data-act="full" aria-label="Full screen"><svg><use href="#i-full"/></svg></button>
    </div>
  </div>
</div>
<audio id="music" preload="auto"></audio>
<div class="mbar" id="mbar" hidden aria-label="Music player">
  <div class="now"><span class="art"></span><div style="min-width:0"><b></b><span></span></div>
    <button class="heart" data-m="like" aria-pressed="false" aria-label="Like">♥</button></div>
  <div class="mid">
    <div class="ctrls">
      <button class="ibtn" data-m="shuffle" aria-pressed="false" aria-label="Shuffle"><svg><use href="#i-shuffle"/></svg></button>
      <button class="ibtn" data-m="prev" aria-label="Previous"><svg><use href="#i-prev"/></svg></button>
      <button class="ibtn big" data-m="toggle" aria-label="Play"><svg><use href="#i-play"/></svg></button>
      <button class="ibtn" data-m="next" aria-label="Next"><svg><use href="#i-skip"/></svg></button>
      <button class="ibtn" data-m="repeat" aria-pressed="false" aria-label="Repeat"><svg><use href="#i-repeat"/></svg></button>
    </div>
    <div class="line"><span class="cur">0:00</span><input type="range" min="0" max="1000" value="0" aria-label="Seek"><span class="dur">0:00</span></div>
  </div>
  <div class="right">
    <button class="ibtn small" data-m="sleep" aria-label="Sleep timer"><svg><use href="#i-moon"/></svg></button>
    <button class="ibtn" data-m="queue" aria-label="Up next"><svg><use href="#i-queue"/></svg></button>
    <button class="ibtn" data-m="mute" aria-label="Mute"><svg><use href="#i-vol"/></svg></button>
    <input type="range" min="0" max="1" step="0.05" value="1" aria-label="Volume" data-m="volume">
  </div>
</div>
<div class="qpanel" id="qpanel" hidden></div>
<div class="sleep-menu" id="sleepMenu" hidden></div>
<script src="/client/app.js"></script>
</body>
</html>
